<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Swiftwater Rescue – Öffentliche Ansicht</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<link rel="stylesheet" href="common.css?v=0">
<style>
/* Öffentliche Ansicht (Public Mode): nur lesen, ohne Anmeldung, Link mit geheimem Schlüssel (?k=) von der Einsatzleitung */
html,body{height:100%}body{display:flex;flex-direction:column}
#pbHead{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.5rem 1rem;padding-top:calc(.5rem + env(safe-area-inset-top));border-bottom:1px solid var(--line)}#pbHead h1{margin:0;font-size:1.1rem;flex:1 1 14rem}
.badge.real{background:var(--alarm)}
#pbBody{flex:1;display:flex;min-height:0}#pbMap{flex:1;min-width:0;background:#0c1c25}
#pbSide{width:22rem;overflow:auto;border-left:1px solid var(--line);padding:.6rem .8rem;padding-bottom:calc(.6rem + env(safe-area-inset-bottom))}#pbSide h3{margin:.8rem 0 .3rem;font-size:1rem}#pbSide h3:first-child{margin-top:0}
.pg{font-size:.8rem;font-weight:700;color:var(--mut);margin-top:.5rem}
.pp{display:flex;gap:.45rem;align-items:center;padding:.3rem 0;border-bottom:1px solid var(--line);font-size:.9rem}.pp i{width:.8rem;height:.8rem;border-radius:50%;flex:0 0 auto}.pp .nm{flex:1;min-width:0;overflow-wrap:anywhere}.pp small{display:block;color:var(--mut)}.pp button{padding:.25rem .45rem;font-size:.8rem}
.leaflet-tooltip.pblbl{background:#0f2430e6;color:#fff;border:0;box-shadow:none;font-weight:600;padding:1px 5px}.leaflet-tooltip.pblbl::before{display:none}
#pbFollow{position:absolute;z-index:1000;left:3.4rem;top:.6rem;display:flex;gap:.4rem;align-items:center;background:#0f2430e6;color:#fff;border-radius:999px;padding:.2rem .3rem .2rem .7rem;font-size:.85rem}#pbFollow[hidden]{display:none}#pbFollow button{padding:.1rem .45rem;font-size:.8rem}
#pbView{position:absolute;z-index:1000;top:.6rem;right:.6rem;width:46px;height:46px;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px #0008}#pbView[aria-expanded=true]{background:var(--ex);border-color:var(--ex)}
#viewBox{position:absolute;top:3.7rem;right:.6rem;max-height:calc(100% - 4.4rem);cursor:auto;font:1rem/1.4 "Segoe UI",system-ui,sans-serif} /* in der Karte: sonst Schrift von Leaflet */
#pbAuto[aria-pressed=true]{background:var(--ex);border-color:var(--ex);color:#fff}
#pbWait{position:absolute;inset:0;z-index:2000;background:var(--bg);display:flex;align-items:flex-start;justify-content:center}#pbWait[hidden]{display:none}#pbBody{position:relative}
#pbMsg{max-width:420px;margin:12vh auto;padding:1.2rem;text-align:center}
/* Einsatzprotokoll live (Issue #54, nur mit public_log), neueste zuerst */
.pl{padding:.3rem 0 .3rem .5rem;border-left:4px solid;border-bottom:1px solid var(--line);font-size:.85rem;overflow-wrap:anywhere}.pl .t{color:var(--mut);margin-right:.35rem}
@media(max-width:760px){#pbBody{flex-direction:column}#pbSide{width:auto;height:38%;border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<div id="pbHead"><h1 id="pbTitle">Öffentliche Ansicht</h1><span id="pbTime" class="mut"></span><button id="pbAuto" aria-pressed="false" hidden title="Karte zeigt laufend alle sichtbaren aktiven Positionen und folgt ihnen">Auto-Übersicht</button></div>
<div id="pbBody"><div id="pbWait" hidden></div><div id="pbMap"><div id="pbFollow" hidden><span></span> <button title="Folgen beenden">✕</button></div><button id="pbView" aria-expanded="false" aria-controls="viewBox" aria-label="Ansicht: Grundkarte und Kartenelemente" title="Ansicht: Grundkarte und Kartenelemente ein- und ausblenden"></button><div id="viewBox" hidden></div></div><aside id="pbSide"></aside></div>
<script src="common.js?v=0"></script>
<script>
// Daten über die Route public/state (ohne Anmeldung); Aktualisierung alle 5 s.
// Suchgebiet wie in der Einsatz-App (riverArea in common.js), Gewässernetz über public/net (gleicher Server-Cache).
const K=new URLSearchParams(location.search).get('k')||'';
let map=null,lay=null,bases={},baseKey=null,ps=null,cs='lv95',timer=null,fitted=false,followId=null,areaInfo='';const nets=new Map();
const ago=ts=>{const s=Math.max(0,ps.now-ts);return s<60?'vor '+s+' s':s<3600?'vor '+Math.round(s/60)+' min':'vor '+Math.floor(s/3600)+' h'};
function stopWith(t,b){clearInterval(timer);$('#pbBody').innerHTML=`<div id="pbMsg" class="card"><h2>${esc(t)}</h2><div class="mut">${esc(b)}</div></div>`;map=null}
function initMap(d){const p=plsList(d)[0];map=L.map('pbMap').setView(p?[p.lat,p.lon]:[46.8,8.2],p?14:8);
  // Grundkarte über das Fenster «Ansicht» wie in der Einsatz-App (setBase, pro Gerät gemerkt in sw_base)
  Object.entries(MAP_PROVIDERS).forEach(([k,P])=>bases[k]=L.tileLayer(P.url,{attribution:P.attr,maxZoom:P.maxZoom}));
  let sv=null;try{sv=localStorage.getItem('sw_base')}catch(e){}baseKey=MAP_PROVIDERS[sv]?sv:DEFAULT_BASE;bases[baseKey].addTo(map);
  const vb=$('#viewBox'),bv=$('#pbView');bv.innerHTML=VIEW_ICON;[vb,bv].forEach(x=>{L.DomEvent.disableClickPropagation(x);L.DomEvent.disableScrollPropagation(x)});
  bv.onclick=()=>viewBox();vb.onclick=e=>{const a=e.target.closest('[data-va]');if(a)setVis(viewCats().map(v=>v[0]),a.dataset.va==='1');if(e.target.closest('#bViewX'))viewBox(false)};
  vb.onchange=e=>{const t=e.target;if(t.name==='vbase')setBase(t.value);else if(t.dataset.vk)setVis([t.dataset.vk],t.checked)};
  lay=L.layerGroup().addTo(map);airLay=L.layerGroup().addTo(map);airLay._air=new Map(); // Helikopter (Issue #73) in eigener Ebene, damit offene Popups das Neuzeichnen überstehen
  $('#pbSide').onclick=e=>{const f=e.target.closest('[data-f]');if(f)return toggleFollow(+f.dataset.f);
    const b=e.target.closest('[data-ll]');if(b)map.panTo(b.dataset.ll.split(',').map(Number))};
  L.DomEvent.disableClickPropagation($('#pbFollow'));$('#pbFollow button').onclick=stopFollow;map.on('dragstart',()=>{if(followId!=null||autoView)stopFollow()}); // von Hand verschieben beendet das Folgen und die Auto-Übersicht
  map.on('zoomstart',()=>{if(autoView&&Date.now()-autoBusy>1500)stopFollow()}); // Zoomen von Hand beendet die Auto-Übersicht
  const ab=$('#pbAuto');ab.hidden=false;ab.onclick=()=>setAuto(!autoView)}
/* ---------- Ansicht (Issue #48): Grundkarte und Kategorien auf der Karte ein-/ausblenden wie in der Einsatz-App ---------- */
// Nur die Karte, die Seitenleiste bleibt; ausgeblendete Posten begrenzen das Suchgebiet weiterhin. Pro Gerät gemerkt (sw_pview, getrennt von der Einsatz-App).
// Kategorien ausgeschalteter Funktionen (features aus public/state) fehlen, Nachrichten gibt es hier nicht.
const viewHide=(()=>{try{return new Set(JSON.parse(localStorage.getItem('sw_pview')||'[]'))}catch(e){return new Set()}})();
const vis=k=>!viewHide.has(k);
const viewCats=()=>VIEW.filter(([k,,f])=>k!=='mm'&&(k!=='air'||!!(ps&&ps.air))&&(!f||!ps||!ps.features||ps.features[f]!==0)); // Helikopter nur, wenn die Verwaltung sie hier freigibt (air)
/* ---------- Helikopter (Issue #73): über public/air, mit jeder Aktualisierung ---------- */
let airLay=null,airD=null;
function loadAir(){if(!ps||!ps.air||!vis('air')){airD=null;return drawAirP()}api('public/air&k='+encodeURIComponent(K)).then(a=>{airD=a}).catch(()=>{airD=null}).finally(drawAirP)}
function drawAirP(){if(!airLay)return;const on=ps&&ps.air&&vis('air')&&airD;airSync(map,airLay,on?airD.air||[]:[],on?airD.now:0,(a,b)=>fmtC(a,b,cs));airAttr(map,on?airD:null)}
function setVis(keys,on){keys.forEach(k=>on?viewHide.delete(k):viewHide.add(k));try{localStorage.setItem('sw_pview',JSON.stringify([...viewHide]))}catch(e){}
  if(ps){draw();if(keys.includes('air'))loadAir()}$('#viewBox').querySelectorAll('[data-vk]').forEach(c=>c.checked=vis(c.dataset.vk))}
function setBase(k){if(!MAP_PROVIDERS[k]||k===baseKey)return;map.removeLayer(bases[baseKey]);baseKey=k;bases[k].addTo(map);try{localStorage.setItem('sw_base',k)}catch(e){}}
function viewBox(on){const b=$('#viewBox');if(!b)return;on=on===undefined?b.hidden:on;b.hidden=!on;$('#pbView').setAttribute('aria-expanded',on);if(on)b.innerHTML=viewHtml(baseKey,viewCats(),vis)}
document.addEventListener('click',e=>{const b=$('#viewBox');if(b&&!b.hidden&&!e.target.closest('#viewBox,#pbView'))viewBox(false)});
document.addEventListener('keydown',e=>{const b=$('#viewBox');if(e.key==='Escape'&&b&&!b.hidden){viewBox(false);$('#pbView').focus()}});
// Folgen: Karte bleibt bei jeder Aktualisierung auf der Person (Zoom bleibt); endet über ✕, beim Verschieben oder wenn die Person den Einsatz verlässt
function toggleFollow(id){followId=followId===id?null:id;if(followId!=null)autoView=false,saveAuto();draw()}
function stopFollow(){followId=null;if(autoView)autoView=false,saveAuto();draw()}
// Auto-Übersicht (Issue #51, wie in der Einsatz-App): Karte zeigt bei jeder Aktualisierung alle sichtbaren aktiven Positionen (Einsatzkräfte, nicht gerettete Rettlinge
// mit Standort, PLS fürs Suchgebiet) und folgt ihnen; endet über ✕, Verschieben oder Zoomen von Hand und beim Folgen einer Person. Pro Gerät gemerkt (sw_pauto).
let autoView=(()=>{try{return localStorage.getItem('sw_pauto')==='1'}catch(e){return false}})(),autoKey='',autoBusy=0;
function saveAuto(){autoKey='';try{localStorage.setItem('sw_pauto',autoView?'1':'0')}catch(e){}}
function setAuto(on){autoView=on;if(on)followId=null;saveAuto();if(ps)draw()}
function autoFit(pts){if(!autoView)return;const k=JSON.stringify(pts.map(p=>p.map(x=>x.toFixed(5))));if(!pts.length||k===autoKey)return;autoKey=k;
  autoBusy=Date.now();if(pts.length>1)map.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:16});else map.setView(pts[0],15)}
// Suchgebiet aus allen PLS der vermissten Rettlinge (sources, Issue #24), Gewässernetz je PLS über public/net
function drawArea(d){if(d.features&&d.features.area===0){areaInfo='';return} // Funktion «Suchgebiet» aus (Issue #75)
  const i=d.incident,posts=d.participants.filter(p=>p.lat!=null&&(d.roles.find(r=>r.id===p.role_id)||{}).is_post);
  const a=searchArea(d.sources||[],nets,i.flow_ms,d.now,posts,(s,R)=>overpassNet('public/net&k='+encodeURIComponent(K)+'&m='+R+'&la='+s.lat+'&lo='+s.lon),()=>{if(ps)draw()},d.rescuees);
  areaInfo=a.info.join(' ');if(!vis('area'))return;
  a.circles.forEach(c=>L.circle([c.lat,c.lon],{radius:c.r,color:'#ff4d2e',weight:2,fillOpacity:.12,dashArray:'6',interactive:false}).addTo(lay));
  a.polys.forEach(cp=>L.polygon(cp,{color:'#ff4d2e',weight:1,fillOpacity:.28,interactive:false}).addTo(lay));
  a.lines.forEach(pts=>L.polyline(pts.map(p=>[p.lat,p.lon]),{color:'#ff4d2e',weight:3,interactive:false}).addTo(lay))}
// Alle PLS: der des Einsatzes und die eigenen der Rettlinge; on = zählt fürs Suchgebiet
function plsList(d){const i=d.incident,l=[];if(i.lat!=null)l.push({lat:i.lat,lon:i.lon,at:i.pls_at,label:'PLS',on:(d.sources||[]).some(s=>!s.own)});
  d.rescuees.filter(r=>r.pls_lat!=null).forEach(r=>l.push({lat:r.pls_lat,lon:r.pls_lon,at:r.pls_at,label:'PLS '+r.name,on:!r.rescued_at&&r.lat==null}));return l}
async function load(){let d;try{d=await api('public/state&k='+encodeURIComponent(K))}catch(e){return stopWith('Öffentliche Ansicht nicht verfügbar',e.message)}
  // vorbereitete Übung noch nicht gestartet (Issue #29): Warteseite, die Seite prüft weiter und wechselt beim Start zur Live-Ansicht
  const w=$('#pbWait');w.hidden=!d.waiting;
  if(d.waiting){$('#pbTitle').innerHTML=kindBadge(d)+' '+esc(d.title);document.title=kindOf(d).name+': '+d.title;$('#pbTime').textContent='öffentliche Ansicht, nur lesen';
    w.innerHTML=`<div id="pbMsg" class="card"><h2>Noch nicht begonnen</h2><div class="mut">Diese Seite aktualisiert sich automatisch und zeigt die Ansicht, sobald es losgeht.</div></div>`;return}
  ps=d;const i=d.incident;cs=d.coord_sys||'lv95';
  $('#pbTitle').innerHTML=`${kindBadge(i)} ${esc(i.message)}`;document.title=kindOf(i).name+': '+i.message;
  if(i.ended_at)return stopWith(kindOf(i).name+' beendet.','Die öffentliche Ansicht zeigt nur laufende Einsätze.');
  $('#pbTime').textContent='seit '+Math.round((d.now-i.alarm_at)/60)+' min · öffentliche Ansicht, nur lesen';
  if(!map)initMap(d);draw();loadAir()}
function draw(){const d=ps,i=d.incident,col=p=>(d.roles.find(r=>r.id===p.role_id)||{}).color||'#cfd8dc',ll=(a,b)=>`data-ll="${a},${b}"`;lay.clearLayers();
  drawArea(d);
  const pl=plsList(d);if(vis('pls'))pl.forEach(p=>L.circleMarker([p.lat,p.lon],{radius:9,color:'#fff',weight:2,fillColor:'#ff4d2e',fillOpacity:p.on?1:.4,opacity:p.on?1:.5}).bindTooltip(esc(p.label),{permanent:true,direction:'right',className:'pblbl'}).addTo(lay));
  d.pois.filter(p=>vis(p.kind==='area'?'ar':'pt')).forEach(p=>{const l=p.kind==='area'?L.polygon(p.pts,{color:p.color,weight:2,fillOpacity:.15}):L.circleMarker(p.pts[0],{radius:7,color:'#fff',weight:2,fillColor:p.color,fillOpacity:1});l.bindTooltip(esc(p.name),{permanent:true,direction:p.kind==='area'?'center':'right',className:'pblbl'}).addTo(lay)});
  if(vis('res'))d.rescuees.filter(r=>r.lat!=null).forEach(r=>L.circleMarker([r.lat,r.lon],{radius:9,color:'#fff',weight:2,fillColor:r.rescued_at?'#35c27a':'#ff9f1c',fillOpacity:1}).bindTooltip((r.rescued_at?'✓ ':'R ')+esc(r.name),{permanent:true,direction:'right',offset:[8,0],className:'pblbl'}).addTo(lay));
  const withPos=d.participants.filter(p=>p.lat!=null);
  // ext: externe Einsatzkraft mit festem Standort (Issue #39), gestrichelter Rand
  withPos.filter(p=>vis(p.ext?'ext':'app')).forEach(p=>L.circleMarker([p.lat,p.lon],{radius:8,color:p.ext?(p.color&&p.role_id!=null?col(p):'#fff'):'#0f2430',weight:p.ext&&p.color&&p.role_id!=null?3:2,dashArray:p.ext?'3':null,fillColor:p.ext&&p.color||col(p),fillOpacity:1}).bindTooltip(esc(p.name),{permanent:true,direction:'right',offset:[8,0],className:'pblbl'}).addTo(lay));
  autoFit([...(vis('pls')?pl.filter(p=>p.on):[]),...withPos.filter(p=>vis(p.ext?'ext':'app')),...(vis('res')?d.rescuees.filter(r=>r.lat!=null&&!r.rescued_at):[])].map(p=>[p.lat,p.lon]));if(autoView)fitted=true;
  if(!fitted){const all=[...pl.map(p=>[p.lat,p.lon]),...withPos.map(p=>[p.lat,p.lon])];if(all.length)fitted=true;if(all.length>1)map.fitBounds(L.latLngBounds(all),{padding:[40,40],maxZoom:16});else if(all.length)map.setView(all[0],14)}
  const fp=followId!=null&&d.participants.find(p=>p.id===followId);if(!fp)followId=null;else if(fp.lat!=null)map.panTo([fp.lat,fp.lon]);
  $('#pbFollow').hidden=!fp&&!autoView;$('#pbFollow span').innerHTML=fp?'Folgt: <b>'+esc(fp.name+(fp.lat==null?' (kein Standort)':''))+'</b>':'Auto-Übersicht';$('#pbFollow button').title=fp?'Folgen beenden':'Auto-Übersicht beenden';
  const ab=$('#pbAuto');ab.setAttribute('aria-pressed',autoView);ab.textContent=(autoView?'✓ ':'')+'Auto-Übersicht';
  // Seitenleiste: Lage, Einsatzkräfte nach Spezialrolle (ohne Rolle zuletzt), Rettlinge, Einsatzprotokoll (log, nur wenn die Einsatzleitung es zeigt)
  const grp=[...d.roles.map(r=>({r,items:d.participants.filter(p=>p.role_id===r.id)})),{r:null,items:d.participants.filter(p=>!d.roles.some(r=>r.id===p.role_id))}].filter(g=>g.items.length);
  const row=p=>`<div class="pp"><i style="background:${esc(p.ext&&p.color||col(p))}"></i><span class="nm">${esc(p.name)}<small>${d.anon?'':esc(p.mode_name||'')+' · '}${p.lat!=null?(p.ext?'fester Standort':'Standort '+ago(p.loc_at))+(fmtC(p.lat,p.lon,cs)?' · '+esc(fmtC(p.lat,p.lon,cs)):''):'kein Standort'}</small></span>${p.lat!=null?`<button ${ll(p.lat,p.lon)}>Zentrieren</button>`:''}${p.ext?'':`<button data-f="${p.id}"${followId===p.id?' class="pri"':''}>${followId===p.id?'Folgt ✕':'Folgen'}</button>`}</div>`;
  const rs=d.rescuees.map(r=>`<div class="pp"><i style="background:${r.rescued_at?'#35c27a':r.lat!=null?'#ff9f1c':'#ff4d2e'}"></i><span class="nm">${esc(r.name)}<small>${r.rescued_at?'gerettet':r.lat!=null?'Standort bekannt':'vermisst'}${r.descr?' · '+esc(r.descr):''}</small></span>${r.lat!=null?`<button ${ll(r.lat,r.lon)}>Zentrieren</button>`:''}</div>`).join('');
  $('#pbSide').innerHTML=`<h3>Lage</h3><div class="mut">Alarmeingang ${new Date(i.alarm_at*1000).toLocaleString('de-CH')}</div>${pl.map(p=>`<div class="mut">${esc(p.label)} ${esc(fmtC(p.lat,p.lon,cs))} · ab ${fmtDT(p.at)} <button ${ll(p.lat,p.lon)} style="padding:.15rem .4rem;font-size:.8rem">Zeigen</button></div>`).join('')||'<div class="mut">Kein PLS gesetzt</div>'}<div class="mut">${i.flow_ms?'Fliessgeschwindigkeit '+i.flow_ms+' m/s':'Fliessgeschwindigkeit nicht gesetzt'}</div>${areaInfo&&i.flow_ms?`<div class="mut">${esc(areaInfo)}</div>`:''}${d.anon?'<div class="mut">Namen sind ausgeblendet.</div>':''}
    <h3>Einsatzkräfte (${d.participants.length})</h3>${grp.map(g=>`<div class="pg">${g.r?`<span style="color:${esc(g.r.color)}">●</span> ${esc(g.r.name)}`:'Ohne Spezialrolle'} (${g.items.length})</div>`+g.items.map(row).join('')).join('')||'<div class="mut">Noch niemand im Einsatz</div>'}
    <h3>Rettlinge (${d.rescuees.length})</h3>${rs||'<div class="mut">Keine erfasst</div>'}
    ${d.log?`<h3>Einsatzprotokoll</h3>${d.log.map(x=>`<div class="pl" style="border-left-color:${KIND_COL[x.kind]||'#888'}"><span class="t">${fmtT(x.ts)}</span><b>${esc(x.name||'System')}</b> ${esc(x.text)}</div>`).join('')||'<div class="mut">Noch keine Einträge</div>'}`:''}`}
if(!K)stopWith('Öffentliche Ansicht nicht verfügbar','Der Link ist unvollständig.');else{load();timer=setInterval(load,5000)}
</script></body></html>
