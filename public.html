<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Swiftwater Rescue – Öffentliche Ansicht</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<link rel="stylesheet" href="common.css?v=0">
<style>
/* Öffentliche Ansicht (Public Mode): nur lesen, ohne Anmeldung, Link mit geheimem Schlüssel (?k=) von der Einsatzleitung */
html,body{height:100%}body{display:flex;flex-direction:column}
#pbHead{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.5rem 1rem;padding-top:calc(.5rem + env(safe-area-inset-top));border-bottom:1px solid var(--line)}#pbHead h1{margin:0;font-size:1.1rem;flex:1 1 14rem}
.badge.real{background:var(--alarm)}
#pbBody{flex:1;display:flex;min-height:0}#pbMap{flex:1;min-width:0;background:#0c1c25}
#pbSide{width:22rem;overflow:auto;border-left:1px solid var(--line);padding:.6rem .8rem;padding-bottom:calc(.6rem + env(safe-area-inset-bottom))}#pbSide h3{margin:.8rem 0 .3rem;font-size:1rem}#pbSide h3:first-child{margin-top:0}
.pg{font-size:.8rem;font-weight:700;color:var(--mut);margin-top:.5rem}
.pp{display:flex;gap:.45rem;align-items:center;padding:.3rem 0;border-bottom:1px solid var(--line);font-size:.9rem}.pp i{width:.8rem;height:.8rem;border-radius:50%;flex:0 0 auto}.pp .nm{flex:1;min-width:0;overflow-wrap:anywhere}.pp small{display:block;color:var(--mut)}.pp button{padding:.25rem .45rem;font-size:.8rem}
.leaflet-tooltip.pblbl{background:#0f2430e6;color:#fff;border:0;box-shadow:none;font-weight:600;padding:1px 5px}.leaflet-tooltip.pblbl::before{display:none}
#pbMsg{max-width:420px;margin:12vh auto;padding:1.2rem;text-align:center}
@media(max-width:760px){#pbBody{flex-direction:column}#pbSide{width:auto;height:38%;border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<div id="pbHead"><h1 id="pbTitle">Öffentliche Ansicht</h1><span id="pbTime" class="mut"></span></div>
<div id="pbBody"><div id="pbMap"></div><aside id="pbSide"></aside></div>
<script src="common.js?v=0"></script>
<script>
// Daten über die Route public/state (ohne Anmeldung); Aktualisierung alle 5 s. Das Suchgebiet entlang des Gewässers wird hier nicht gezeichnet, nur der PLS.
const K=new URLSearchParams(location.search).get('k')||'';
let map=null,lay=null,ps=null,cs='lv95',timer=null,fitted=false;
const ago=ts=>{const s=Math.max(0,ps.now-ts);return s<60?'vor '+s+' s':s<3600?'vor '+Math.round(s/60)+' min':'vor '+Math.floor(s/3600)+' h'};
function stopWith(t,b){clearInterval(timer);$('#pbBody').innerHTML=`<div id="pbMsg" class="card"><h2>${esc(t)}</h2><div class="mut">${esc(b)}</div></div>`;map=null}
function initMap(i){map=L.map('pbMap').setView([i.lat,i.lon],14);const bases={};
  Object.values(MAP_PROVIDERS).forEach(P=>bases[P.label]=L.tileLayer(P.url,{attribution:P.attr,maxZoom:P.maxZoom}));
  let sv=null;try{sv=localStorage.getItem('sw_base')}catch(e){}bases[(MAP_PROVIDERS[sv]||MAP_PROVIDERS[DEFAULT_BASE]).label].addTo(map);L.control.layers(bases,null,{position:'topright'}).addTo(map);
  map.on('baselayerchange',e=>{const k=Object.keys(MAP_PROVIDERS).find(k=>MAP_PROVIDERS[k].label===e.name);try{localStorage.setItem('sw_base',k)}catch(_){}});
  lay=L.layerGroup().addTo(map);
  $('#pbSide').onclick=e=>{const b=e.target.closest('[data-ll]');if(b)map.panTo(b.dataset.ll.split(',').map(Number))}}
async function load(){let d;try{d=await api('public/state&k='+encodeURIComponent(K))}catch(e){return stopWith('Öffentliche Ansicht nicht verfügbar',e.message)}
  ps=d;const i=d.incident;cs=d.coord_sys||'lv95';
  $('#pbTitle').innerHTML=`${i.is_exercise?'<span class="badge">Übung</span>':'<span class="badge real">Einsatz</span>'} ${esc(i.message)}`;document.title=(i.is_exercise?'Übung: ':'Einsatz: ')+i.message;
  if(i.ended_at)return stopWith(i.is_exercise?'Die Übung ist beendet.':'Der Einsatz ist beendet.','Die öffentliche Ansicht zeigt nur laufende Einsätze.');
  $('#pbTime').textContent='seit '+Math.round((d.now-i.alarm_at)/60)+' min · öffentliche Ansicht, nur lesen';
  if(!map)initMap(i);draw()}
function draw(){const d=ps,i=d.incident,col=p=>(d.roles.find(r=>r.id===p.role_id)||{}).color||'#cfd8dc',ll=(a,b)=>`data-ll="${a},${b}"`;lay.clearLayers();
  L.circleMarker([i.lat,i.lon],{radius:9,color:'#fff',weight:2,fillColor:'#ff4d2e',fillOpacity:1}).bindTooltip('PLS',{permanent:true,direction:'right',className:'pblbl'}).addTo(lay);
  d.pois.forEach(p=>{const l=p.kind==='area'?L.polygon(p.pts,{color:p.color,weight:2,fillOpacity:.15}):L.circleMarker(p.pts[0],{radius:7,color:'#fff',weight:2,fillColor:p.color,fillOpacity:1});l.bindTooltip(esc(p.name),{permanent:true,direction:p.kind==='area'?'center':'right',className:'pblbl'}).addTo(lay)});
  d.rescuees.filter(r=>r.lat!=null).forEach(r=>L.circleMarker([r.lat,r.lon],{radius:9,color:'#fff',weight:2,fillColor:r.rescued_at?'#35c27a':'#ff9f1c',fillOpacity:1}).bindTooltip((r.rescued_at?'✓ ':'R ')+esc(r.name),{permanent:true,direction:'right',offset:[8,0],className:'pblbl'}).addTo(lay));
  const withPos=d.participants.filter(p=>p.lat!=null);
  withPos.forEach(p=>L.circleMarker([p.lat,p.lon],{radius:8,color:'#0f2430',weight:2,fillColor:col(p),fillOpacity:1}).bindTooltip(esc(p.name),{permanent:true,direction:'right',offset:[8,0],className:'pblbl'}).addTo(lay));
  if(!fitted){fitted=true;const all=[[i.lat,i.lon],...withPos.map(p=>[p.lat,p.lon])];if(all.length>1)map.fitBounds(L.latLngBounds(all),{padding:[40,40],maxZoom:16})}
  // Seitenleiste: Lage, Einsatzkräfte nach Spezialrolle (ohne Rolle zuletzt), Rettlinge
  const grp=[...d.roles.map(r=>({r,items:d.participants.filter(p=>p.role_id===r.id)})),{r:null,items:d.participants.filter(p=>!d.roles.some(r=>r.id===p.role_id))}].filter(g=>g.items.length);
  const row=p=>`<div class="pp"><i style="background:${esc(col(p))}"></i><span class="nm">${esc(p.name)}<small>${d.anon?'':esc(p.mode_name||'')+' · '}${p.lat!=null?'Standort '+ago(p.loc_at)+(fmtC(p.lat,p.lon,cs)?' · '+esc(fmtC(p.lat,p.lon,cs)):''):'kein Standort'}</small></span>${p.lat!=null?`<button ${ll(p.lat,p.lon)}>Zentrieren</button>`:''}</div>`;
  const rs=d.rescuees.map(r=>`<div class="pp"><i style="background:${r.rescued_at?'#35c27a':r.lat!=null?'#ff9f1c':'#ff4d2e'}"></i><span class="nm">${esc(r.name)}<small>${r.rescued_at?'gerettet':r.lat!=null?'Standort bekannt':'vermisst'}${r.descr?' · '+esc(r.descr):''}</small></span>${r.lat!=null?`<button ${ll(r.lat,r.lon)}>Zentrieren</button>`:''}</div>`).join('');
  $('#pbSide').innerHTML=`<h3>Lage</h3><div class="mut">Alarmeingang ${new Date(i.alarm_at*1000).toLocaleString('de-CH')}</div><div class="mut">PLS ${esc(fmtC(i.lat,i.lon,cs))} <button ${ll(i.lat,i.lon)} style="padding:.15rem .4rem;font-size:.8rem">Zeigen</button></div><div class="mut">${i.flow_ms?'Fliessgeschwindigkeit '+i.flow_ms+' m/s':'Fliessgeschwindigkeit nicht gesetzt'}</div>${d.anon?'<div class="mut">Namen sind ausgeblendet.</div>':''}
    <h3>Einsatzkräfte (${d.participants.length})</h3>${grp.map(g=>`<div class="pg">${g.r?`<span style="color:${esc(g.r.color)}">●</span> ${esc(g.r.name)}`:'Ohne Spezialrolle'} (${g.items.length})</div>`+g.items.map(row).join('')).join('')||'<div class="mut">Noch niemand im Einsatz</div>'}
    <h3>Rettlinge (${d.rescuees.length})</h3>${rs||'<div class="mut">Keine erfasst</div>'}`}
if(!K)stopWith('Öffentliche Ansicht nicht verfügbar','Der Link ist unvollständig.');else{load();timer=setInterval(load,5000)}
</script></body></html>
