@keyframes bl{50%{background:#8f1d0a}}@media(prefers-reduced-motion:reduce){#alarm{animation:none}}
#alarm button{background:#fff;color:#000;font-weight:700;padding:1rem}#alarm h2{margin:0;font-size:1.8rem}
</style></head><body>
<div id="alarm" role="alertdialog"><h2 id="aT"></h2><div id="aB"></div><button id="aOk">Quittieren</button></div>
<div id="toasts" aria-live="polite"></div>
<div id="app"></div>
<script src="common.js"></script>
<script>
/* ---------- Konfiguration ---------- */
// Kartenanbieter austauschbar: aktiven Eintrag über MAP_PROVIDER wählen oder neuen ergänzen.
const DEFAULT_BASE='swisstopo_sat'; // Standard-Hintergrund; der Benutzer kann über das Ebenen-Symbol (oben rechts) umschalten, die Wahl wird gemerkt.
const MAP_PROVIDERS={
  swisstopo_sat:{label:'Luftbild (swisstopo)',url:'https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg',attr:'&copy; swisstopo',maxZoom:18},
  swisstopo:{label:'Landeskarte (swisstopo)',url:'https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg',attr:'&copy; swisstopo',maxZoom:18},
  osm:{label:'OpenStreetMap',url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',attr:'&copy; OpenStreetMap',maxZoom:19}
};
// Gewässernetz (OpenStreetMap via Overpass). Austauschbar: Funktion loadNet() liefert Wege als {id,nodes[],geometry[{lat,lon}]} in Fliessrichtung.
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
const BANK_M=30;   // Breite des Ufergebiets pro Seite in Metern
const WATER_M=80;  // Standort so nahe an der Gewässerachse gilt als «auf dem Gewässer» (Boot); zählt im Einsatzlog nicht als Fahrt
const SNAP_M=300;  // maximale Distanz PLS zum Gewässer
// Einrückoptionen kommen vom Server (Verwaltung → Einrückoptionen); share_location=0: Standort wird nicht geteilt
let modes=[];
const modeOf=k=>modes.find(x=>x.code===k)||{code:k,name:k,share_location:1,active:0},shares=k=>!!modeOf(k).share_location;
/* ---------- Helfer ($, esc, api, fail, fmtT in common.js) ---------- */
let msgInit=false,areaShape=null,lastRiver='',suggText='',suggVal=null,areaLogged={},creating=false,openSec=new Set(['mine','rescuee','flow','manage']),locStatus='',lastPos=null,manual=false,hb=null,me=null,roles=[],st=null,map,layers={},lastMsg=0,lastIncId=null,lastEnded=null,alarmQ=[],watchId=null,lastSent=0,fitted=null;
onUnauth=()=>render();
/* ---------- Alarm ---------- */
let actx,beepT;function beep(on){clearInterval(beepT);if(!on)return;actx=actx||new(window.AudioContext||webkitAudioContext)();
  beepT=setInterval(()=>{const o=actx.createOscillator();o.frequency.value=880;o.connect(actx.destination);o.start();o.stop(actx.currentTime+.4);navigator.vibrate&&navigator.vibrate([300,100,300])},1000)}
function ping(){try{actx=actx||new(window.AudioContext||webkitAudioContext)();const o=actx.createOscillator();o.frequency.value=660;o.connect(actx.destination);o.start();o.stop(actx.currentTime+.25)}catch(e){}navigator.vibrate&&navigator.vibrate(200)}
// critical: Vollbild-Alarm mit Dauerton (scharfer Einsatz oder Übungsmodus), sonst normale Benachrichtigung (Übung)
function notify(t,b,key,critical){if(critical)return alarm(t,b,key);if(key){if(ackGet().includes(key))return false;ackAdd(key)}
  const d=document.createElement('div');d.className='toast';d.innerHTML=`<b>${esc(t)}</b><div>${esc(b)}</div>`;d.onclick=()=>d.remove();$('#toasts').appendChild(d);setTimeout(()=>d.remove(),20000);ping();
  if('Notification'in window&&Notification.permission==='granted')new Notification(t,{body:b});return true}
const ackGet=()=>{try{return JSON.parse(localStorage.getItem('sw_acked')||'[]')}catch(e){return[]}};
function ackAdd(k){try{const a=ackGet();if(!a.includes(k)){a.push(k);localStorage.setItem('sw_acked',JSON.stringify(a.slice(-300)))}}catch(e){}}
let curKey=null;
function alarm(t,b,key){if(key&&(ackGet().includes(key)||key===curKey||alarmQ.some(q=>q[2]===key)))return false;alarmQ.push([t,b,key]);showAlarm();return true}
function showAlarm(){if($('#alarm').style.display==='flex'||!alarmQ.length)return;const[t,b,k]=alarmQ.shift();curKey=k||null;$('#aT').textContent=t;$('#aB').textContent=b;$('#alarm').style.display='flex';beep(true);
  if('Notification'in window&&Notification.permission==='granted')new Notification(t,{body:b,requireInteraction:true})}
$('#aOk').onclick=()=>{if(curKey)ackAdd(curKey);curKey=null;$('#alarm').style.display='none';beep(false);showAlarm()};
/* ---------- Hauptansicht ---------- */
function toggleSheet(f){const w=$('#sheetWrap');if(!w)return;const o=f===undefined?!w.classList.contains('open'):f;w.classList.toggle('open',o);document.body.classList.toggle('so',o);if(o&&panel)togglePanel(panel,false)}
function updateChip(){const c=$('#chip');if(!c)return;$('#fitBtns').hidden=!(st&&st.incident);if(st&&st.incident){const x=!!st.incident.is_exercise;c.hidden=false;c.classList.toggle('ex',x);c.textContent=(x?'Übung: ':'Einsatz: ')+st.incident.message+' · '+Math.round((st.now-st.incident.alarm_at)/60)+' min'}else c.hidden=true}
function shell(){$('#app').innerHTML=`<div id="map"></div><button id="bMenu" class="fab" aria-label="Menü">☰</button><div id="chip" hidden></div><div id="areaNote" hidden></div><div id="fitBtns" hidden><button id="bFitA" title="Ganzes Suchgebiet anzeigen">Suchgebiet</button><button id="bFitF" title="Alle Einsatzkräfte mit Standort anzeigen">Einsatzkräfte</button><button id="bPeople" aria-expanded="false" aria-controls="people" title="Liste aller Personen im Einsatz">Personen</button><button id="bMsg" aria-expanded="false" aria-controls="msgs" title="Nachrichten lesen und senden">Nachrichten<span class="cnt" id="msgCnt" hidden></span></button></div><div id="followChip" hidden role="status"><span></span><button id="bUnfollow" aria-label="Folgen beenden" title="Folgen beenden">✕</button></div><div id="people" hidden role="dialog" aria-label="Personen im Einsatz"><div class="phead"><b>Personen im Einsatz</b><button id="bPeopleX" aria-label="Liste schliessen">✕</button></div><div id="peopleList"></div></div><div id="msgs" hidden role="dialog" aria-label="Nachrichten"><div class="phead"><b>Nachrichten</b><button id="bMsgX" aria-label="Nachrichten schliessen">✕</button></div><div id="msgList" aria-live="polite"></div><div id="msgForm"></div></div><div id="sheetWrap"><div id="sheetBar"><b>Swiftwater Rescue</b><button id="bClose" aria-label="Menü schliessen">✕</button></div><div id="sheet"></div></div>`;
  $('#bMenu').onclick=()=>toggleSheet();$('#bFitA').onclick=fitArea;$('#bFitF').onclick=fitForces;$('#bClose').onclick=()=>toggleSheet(false);$('#chip').onclick=()=>toggleSheet(true);
  followId=null;panel=null;msgSeen=0;msgFormKey='';$('#bPeople').onclick=()=>togglePanel('people');$('#bPeopleX').onclick=()=>togglePanel('people',false);$('#bUnfollow').onclick=stopFollow;
  $('#bMsg').onclick=()=>togglePanel('msgs');$('#bMsgX').onclick=()=>togglePanel('msgs',false);
  $('#peopleList').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.c)centerOn(+b.dataset.c);else if(b.dataset.f)toggleFollow(+b.dataset.f)};
  $('#sheet').addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)e.target.open?openSec.add(k):openSec.delete(k)},true);
  map=L.map('map',{zoomControl:false}).setView([46.8,8.2],8);L.control.zoom({position:'bottomright'}).addTo(map);
  const bases={};Object.values(MAP_PROVIDERS).forEach(P=>bases[P.label]=L.tileLayer(P.url,{attribution:P.attr,maxZoom:P.maxZoom}));
  const sv=localStorage.getItem('sw_base');bases[(MAP_PROVIDERS[sv]||MAP_PROVIDERS[DEFAULT_BASE]).label].addTo(map);L.control.layers(bases,null,{position:'topright'}).addTo(map);
  map.on('baselayerchange',e=>{const k=Object.keys(MAP_PROVIDERS).find(k=>MAP_PROVIDERS[k].label===e.name);localStorage.setItem('sw_base',k)});
  layers={};fitted=null;map.on('zoomend',drawMap);map.on('dragstart',()=>{if(followId!=null)stopFollow()}); // von Hand verschieben beendet das Folgen
  if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()}
function mk(p){const r=roles.find(x=>x.id==p.role_id),col=r?r.color:'#8fb0bd';
  const ini=(p.name||'?').split(' ').map(s=>s[0]).join('').slice(0,2).toUpperCase();
  return `<div class="mk" style="border-color:${col};${p.photo?`background-image:url(${p.photo})`:''}">${p.photo?'':esc(ini)}</div>`}
function drawMap(){const n=$('#areaNote');if(!st||!st.incident){if(n)n.hidden=true;return}const i=st.incident;['pls','area','pp','rm'].forEach(k=>layers[k]&&map.removeLayer(layers[k]));
  layers.pls=L.marker([i.lat,i.lon],{icon:L.divIcon({className:'',html:'<div class="pls"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map).bindTooltip('PLS');
  try{layers.area=drawArea(i);if(layers.area)layers.area.addTo(map)}catch(e){console.error('Suchgebiet',e);areaInfo='Fehler Suchgebiet: '+e.message}if(n){n.textContent=window.markPick?'Tippe auf die Karte, um die Position des Rettlings zu setzen.':areaInfo;n.hidden=!(areaInfo||window.markPick)}checkArea();
  // Einsatzelemente gruppieren, wenn sie im Bild < 40 px auseinanderliegen
  const act=st.participants.filter(p=>p.lat!=null&&!p.left_at&&p.mode!=='declined'),groups=[];
  act.forEach(p=>{const pt=map.latLngToLayerPoint([p.lat,p.lon]);const g=groups.find(g=>g.pt.distanceTo(pt)<40);g?g.items.push(p):groups.push({pt,items:[p]})});
  layers.pp=L.layerGroup(groups.map(g=>{const a=g.items[0];const ll=[a.lat,a.lon];
    if(g.items.length===1)return L.marker(ll,{icon:L.divIcon({className:'',html:mk(a),iconSize:[38,38],iconAnchor:[19,19]})}).bindTooltip(esc(a.name)+(roleName(a)?' – '+esc(roleName(a)):''));
    return L.marker(ll,{icon:L.divIcon({className:'',html:`<div class="mk cl">${g.items.length}</div>`,iconSize:[38,38],iconAnchor:[19,19]})}).bindTooltip(g.items.map(x=>esc(x.name)).join(', '))})).addTo(map);
  layers.rm=L.layerGroup((st.marks||[]).map(x=>L.marker([x.lat,x.lon],{icon:L.divIcon({className:'',html:'<div class="rm">R</div>',iconSize:[34,34],iconAnchor:[17,17]}),zIndexOffset:1000}).bindTooltip('Rettling – '+(x.manual?'manuell (Einsatzleitung)':esc(x.name))+' · '+fmtT(x.ts)))).addTo(map);
  if(fitted!==i.id){fitted=i.id;map.setView([i.lat,i.lon],14)}}
/* ---------- Suchgebiet entlang des Flusslaufs ---------- */
let net=null,netLoading=false,areaInfo='';
async function loadNet(i,R){netLoading=true;let err='';
  const q=`[out:json][timeout:25];way(around:${Math.round(R)},${i.lat},${i.lon})["waterway"~"^(river|stream|canal)$"];out geom;`;
  for(const url of OVERPASS){try{
    const r=await fetch(url,{method:'POST',body:new URLSearchParams({data:q})});if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();if(!j.elements)throw new Error('ungültige Antwort');
    const ways=j.elements.filter(e=>e.geometry&&e.nodes),byNode=new Map();
    ways.forEach(w=>w.nodes.forEach((n,k)=>{(byNode.get(n)||byNode.set(n,[]).get(n)).push({w,k})}));
    net={inc:i.id,R,ways,byNode};netLoading=false;drawMap();draw();return}catch(e){err=e.message}}
  net={inc:i.id,R,fail:true,err,retryAt:Date.now()+20000};netLoading=false;drawMap();draw()}
const dist=(a,b)=>map.distance([a.lat,a.lon],[b.lat,b.lon]);
function follow(w,k,rem,seen){const pts=[w.geometry[k]];seen=new Set(seen).add(w.id);
  for(let j=k+1;j<w.geometry.length;j++){const a=w.geometry[j-1],b=w.geometry[j],d=dist(a,b);
    if(d>=rem){const f=rem/d;pts.push({lat:a.lat+(b.lat-a.lat)*f,lon:a.lon+(b.lon-a.lon)*f});return[pts]}
    pts.push(b);rem-=d}
  const nexts=(net.byNode.get(w.nodes[w.nodes.length-1])||[]).filter(e=>!seen.has(e.w.id)&&e.k<e.w.geometry.length-1);
  if(!nexts.length)return[pts];
  return nexts.flatMap(e=>follow(e.w,e.k,rem,seen).map(br=>pts.concat(br.slice(1))))}
function corridor(pts,w){const C=L.CRS.EPSG3857,k=w/Math.cos(pts[0].lat*Math.PI/180),P=pts.map(p=>C.project(L.latLng(p.lat,p.lon))),A=[],B=[];
  P.forEach((p,j)=>{const a=P[Math.max(0,j-1)],b=P[Math.min(P.length-1,j+1)];let dx=b.x-a.x,dy=b.y-a.y;const n=Math.hypot(dx,dy)||1;dx/=n;dy/=n;
    A.push(C.unproject(L.point(p.x-dy*k,p.y+dx*k)));B.push(C.unproject(L.point(p.x+dy*k,p.y-dx*k)))});return A.concat(B.reverse())}
function circleArea(i,D,why){areaShape={circle:{lat:i.lat,lon:i.lon,r:D}};areaInfo=why+' Darstellung als Kreis, Radius '+Math.round(D)+' m.';
  return L.circle([i.lat,i.lon],{radius:D,color:'#ff4d2e',weight:2,fillOpacity:.12,dashArray:'6'})}
function drawArea(i){areaInfo='';areaShape=null;const D=(i.flow_ms||0)*(st.now-i.alarm_at);if(D<=0){areaInfo='Fliessgeschwindigkeit fehlt.';return null}
  const need=Math.min(Math.max(5000,D*1.3),30000);
  if(!netLoading&&(!net||net.inc!==i.id||(!net.fail&&net.R<D*1.1&&net.R<30000)||(net.fail&&Date.now()>net.retryAt)))loadNet(i,need);
  if(!net||net.inc!==i.id)return circleArea(i,D,'Gewässerdaten werden geladen.');
  if(net.fail)return circleArea(i,D,'Gewässerdaten nicht verfügbar ('+net.err+'), neuer Versuch folgt.');
  let best=null,bd=1e12;net.ways.forEach(w=>w.geometry.forEach((g,k)=>{const d=dist(g,{lat:i.lat,lon:i.lon});if(d<bd){bd=d;best={w,k}}}));
  if(!best||bd>SNAP_M)return circleArea(i,D,'Kein Gewässer nahe der PLS.');
  areaShape={polys:[]};lastRiver=(best.w.tags&&best.w.tags.name)||'';const posts=st.participants.filter(p=>p.lat!=null&&!p.left_at&&(roles.find(r=>r.id==p.role_id)||{}).is_post);let cutBy=null,maxLen=0;
  const g=L.layerGroup();
  follow(best.w,best.k,D,new Set()).forEach(pts=>{
    for(let j=0;j<pts.length;j++){const po=posts.find(p=>dist(pts[j],{lat:p.lat,lon:p.lon})<120);if(po){pts=pts.slice(0,j+1);cutBy=po.name;break}}
    if(pts.length<2)return;let len=0;for(let j=1;j<pts.length;j++)len+=dist(pts[j-1],pts[j]);maxLen=Math.max(maxLen,len);
    const cp=corridor(pts,BANK_M);areaShape.polys.push(cp);g.addLayer(L.polygon(cp,{color:'#ff4d2e',weight:1,fillOpacity:.28,interactive:false}));
    g.addLayer(L.polyline(pts.map(p=>[p.lat,p.lon]),{color:'#ff4d2e',weight:3,interactive:false}))});
  areaInfo=`Suchgebiet: ${(maxLen/1000).toFixed(1)} km Flusslauf ab PLS (Driftdistanz ${Math.round(D)} m), Ufergebiet ${BANK_M} m je Seite`+(cutBy?`, endet am Posten ${cutBy}.`:'.');
  return g}
const roleName=p=>(roles.find(r=>r.id==p.role_id)||{}).name;

      if(st&&st.me&&!st.me.left_at&&st.me.mode!=='declined'&&nx.me&&nx.me.left_at&&!window.selfLeft&&notify('AUS EINSATZ ENTFERNT','Die Einsatzleitung hat dich aus dem Einsatz entfernt.','k:'+i.id+':'+nx.me.left_at,cr))toggleSheet(true);
      st=nx;if(nx.me&&!nx.me.left_at&&nx.me.mode!=='declined'&&shares(nx.me.mode))track();else stop()}
    else{if(st&&st.incident){const x=st.incident.is_exercise;if(notify(x?'ÜBUNG BEENDET':'EINSATZ BEENDET',x?'Die Übung wurde beendet.':'Der Einsatz wurde beendet.','e:'+st.incident.id,st.critical!==false))toggleSheet(true)}st=nx;lastIncId=null;stop()}
    if(st&&st.incident)creating=false;updateChip();drawMap();followNow();renderPeople();renderMsgs();renderBigLog();if(!document.activeElement.matches('input,textarea,select'))draw()}catch(e){console.error('Poll',e)}}
async function render(){clearInterval(timer);if(!token)return loginView($('#app'),'Swiftwater Rescue',render);
  try{me=(await api('me')).me}catch(e){return}
  if(me.must_change){$('#app').innerHTML='';return pwDialog(true,render)} // nach Zurücksetzen zuerst eigenes Passwort setzen
  try{roles=await api('roles');modes=await api('modes')}catch(e){return}
  shell();await poll();draw();timer=setInterval(poll,4000)}
render();
</script></body></html>
