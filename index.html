<script>

function shell(){$('#app').innerHTML=`<div id="map"></div><button id="bMenu" class="fab" aria-label="Menü">☰</button><div id="chip" hidden></div><div id="areaNote" hidden></div><div id="fitBtns" hidden><div id="camWrap"><button id="bCam" aria-expanded="false" aria-haspopup="menu" aria-controls="camMenu" title="Kartenausschnitt wählen">Kamerafokus</button><div id="camMenu" role="menu" hidden></div></div><button id="bPeople" aria-expanded="false" aria-controls="people" title="Liste aller Einsatzkräfte">Einsatzkräfte<span class="cnt n" id="peopleCnt" hidden></span></button><button id="bRes" aria-expanded="false" aria-controls="res" title="Rettlinge: Standort oder «gerettet» markieren">Rettlinge<span class="cnt" id="resCnt" hidden></span></button><button id="bMsg" aria-expanded="false" aria-controls="msgs" title="Nachrichten lesen und senden">Nachrichten<span class="cnt" id="msgCnt" hidden></span></button><button id="bPoi" aria-expanded="false" aria-controls="pois" title="Positionen und Bereiche der Einsatzleitung">Positionen &amp; Bereiche</button><button id="bRd" title="Distanz und Zeiten zwischen zwei Punkten entlang des Gewässers">Flussdistanz</button></div><div id="rdBox" hidden role="dialog" aria-label="Flussdistanz" aria-live="polite"></div><div id="pois" hidden role="dialog" aria-label="Positionen und Bereiche"><div class="phead"><b>Positionen &amp; Bereiche</b><button id="bPoiX" aria-label="Liste schliessen">✕</button></div><div id="poiList"></div><div id="poiForm"></div></div><div id="res" hidden role="dialog" aria-label="Rettlinge"><div class="phead"><b>Rettlinge</b><button id="bResX" aria-label="Liste schliessen">✕</button></div><div id="resList"></div><div id="resForm"><button class="pri" data-re="0">+ Rettling erfassen</button></div></div><div id="drawBar" hidden role="status"></div><div id="followChip" hidden role="status"><span></span><button id="bUnfollow" aria-label="Folgen beenden" title="Folgen beenden">✕</button></div><div id="people" hidden role="dialog" aria-label="Einsatzkräfte"><div class="phead"><b>Einsatzkräfte</b><button id="bPeopleX" aria-label="Liste schliessen">✕</button></div><div id="peopleList"></div></div><div id="msgs" hidden role="dialog" aria-label="Nachrichten"><div class="phead"><b>Nachrichten</b><button id="bMsgX" aria-label="Nachrichten schliessen">✕</button></div><div id="msgList" aria-live="polite"></div><label id="mmShowRow"><input type="checkbox" id="mmShow"> Nachrichten-Markierungen auf der Karte anzeigen</label><div id="msgForm"></div></div><div id="sheetWrap"><div id="sheetBar"><b>Swiftwater Rescue</b><button id="bClose" aria-label="Menü schliessen">✕</button></div><div id="sheet"></div></div>`;
  $('#bMenu').onclick=()=>toggleSheet();const an=$('#areaNote');an.onclick=()=>{if(an.classList.contains('more')){areaOpen=!areaOpen;drawNote()}};an.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&an.classList.contains('more')){e.preventDefault();an.onclick()}};$('#bCam').onclick=()=>camMenu();$('#camMenu').onclick=e=>{const b=e.target.closest('[data-cam]');if(!b)return;camMenu(false);const k=b.dataset.cam;k==='f'?fitForces():fitArea(k||null)};$('#bClose').onclick=()=>toggleSheet(false);$('#chip').onclick=()=>toggleSheet(true);

  const row=r=>{const s=resSt(r);return `<div class="rs${s==='ok'?' done':''}"><div class="hd"><b>${esc(r.name)}</b><span class="st ${s}">${RES_ST[s]}</span></div>${r.descr?`<div class="ds">${esc(r.descr)}</div>`:''}<small>${esc(resInfo(r))}</small><small>${esc(resPls(r))}</small><div class="bt">`
    +(can&&s!=='ok'?`${own?`<button class="pri" data-rl="${r.id}" title="Standort des Rettlings = mein aktueller Standort">📍 Fundort = mein Standort</button>`:''}<button data-rp="${r.id}" title="Fundort des Rettlings auf der Karte antippen">📍 Fundort auf Karte</button><button class="pri" data-rr="${r.id}" data-v="1">Gerettet</button>`:'')
    +(s==='miss'&&resPart(r)?`<button data-rsa="${r.id}" title="Suchgebiet dieses Rettlings anzeigen">Suchgebiet</button>`:'')+(r.lat!=null?`<button data-rg="${r.id}" title="Auf der Karte zeigen">Zeigen</button>`:'')+(can&&s==='ok'?`<button data-rr="${r.id}" data-v="0">Zurücknehmen</button>`:'')
    +(can?`<button data-rpls="${r.id}" title="Ort und Zeitpunkt, an dem der Rettling zuletzt gesehen wurde (PLS), auf der Karte setzen">PLS setzen</button><button data-re="${r.id}" aria-label="${esc(r.name)} bearbeiten" title="Name, Beschreibung und PLS ändern">✎</button>`:'')+(st.can_manage?`<button data-rd="${r.id}" aria-label="${esc(r.name)} entfernen" title="Für alle entfernen">✕</button>`:'')+'</div></div>'};
  $('#resList').innerHTML=['miss','loc','ok'].map(s=>{const l=rs.filter(r=>resSt(r)===s);return l.length?`<div class="pg">${RES_ST[s]} (${l.length})</div>`+l.map(row).join(''):''}).join('')
    ||`<div class="mut" style="padding:.6rem 0">Noch keine Rettlinge erfasst.</div>`;
  $('#resForm').hidden=!can}
// Erfassen/Bearbeiten: PLS des Einsatzes übernehmen oder eigener PLS (Ort über «PLS»/auf der Karte, Zeitpunkt hier änderbar)
function editRes(id){const r=((st&&st.rescuees)||[]).find(x=>x.id===id)||{name:'',descr:'',pls_lat:null},i=st.incident,own=r.pls_lat!=null;
  const plsH=own?`<label class="mut">Eigener PLS${esc(fcs(r.pls_lat,r.pls_lon,' · '))}, Drift ab<input id="rsT" type="datetime-local" value="${dtLocal(r.pls_at)}"></label><label class="row" style="align-items:center"><input type="checkbox" id="rsI" style="flex:0 0 auto"> <span>Stattdessen den PLS des Einsatzes übernehmen</span></label>`
    :`<div class="mut">PLS: ${i.lat!=null?'der des Einsatzes'+esc(fcs(i.lat,i.lon,' (',')'))+', Drift ab '+fmtDT(i.pls_at):'noch keiner (der Einsatz hat keinen PLS)'}</div><label class="row" style="align-items:center"><input type="checkbox" id="rsP" style="flex:0 0 auto" ${i.lat==null?'checked':''}> <span>${id?'Eigenen PLS auf der Karte setzen':'Danach eigenen PLS auf der Karte setzen'}</span></label>`;
  dlg(id?'Rettling bearbeiten':'Rettling erfassen',`<label class="mut">Name<input id="rsN" maxlength="80" placeholder="z. B. Person 1, Kind, Kanufahrer" value="${esc(r.name)}"></label><label class="mut">Beschreibung (Merkmale, Kleidung, Alter …)<textarea id="rsD" rows="4" maxlength="1000">${esc(r.descr||'')}</textarea></label>${plsH}`,
    async d=>{const name=$('#rsN',d).value.trim(),descr=$('#rsD',d).value;if(!name)throw new Error('Bitte einen Namen eingeben.');const body={id:id||undefined,name,descr};
      if(own)body.pls=$('#rsI',d).checked?null:{lat:r.pls_lat,lon:r.pls_lon,at:dtTs($('#rsT',d).value)||r.pls_at};
      const pick=!own&&$('#rsP',d).checked,res=await api('incident/rescuee/save',body);togglePanel('res',true);await poll();
      if(pick)setTimeout(()=>resPlsPick(res.id,name,descr),0)})}
// Eigener PLS eines Rettlings: Punkt auf der Karte, danach Zeitpunkt (Standard: der des bisherigen PLS)
function resPlsPick(id,name,descr){const r=resOf(id),at=r&&r.pls_lat!=null?r.pls_at:st.incident.pls_at;
  plsPick(`PLS von «${name}»`,at,(lat,lon,t)=>api('incident/rescuee/save',{id,name,descr,pls:{lat,lon,at:t}}).then(()=>togglePanel('res',true)))}
// PLS wählen: Punkt antippen, dann Zeitpunkt bestätigen; save(lat, lon, at)
function plsPick(what,at,save){pickPoint(`Tippe auf die Karte, um den ${what} zu setzen.`).then(q=>
  dlg(what,`<div class="mut">${esc(fc(q.lat,q.lng)||'')}</div><label class="mut">Zeitpunkt (Beginn der Drift)<input id="plT" type="datetime-local" value="${dtLocal(at||st.now)}"></label><div class="mut">Ab diesem Zeitpunkt wird die Driftdistanz mit der Fliessgeschwindigkeit berechnet.</div>`,
    async d=>{const t=dtTs($('#plT',d).value);if(!t)throw new Error('Bitte einen Zeitpunkt eingeben.');await save(+q.lat.toFixed(7),+q.lng.toFixed(7),t);poll()})).catch(fail)}
const dtLocal=ts=>new Date(ts*1000-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16),dtTs=v=>Math.floor(new Date(v).getTime()/1000)||0;
const resOf=id=>((st&&st.rescuees)||[]).find(x=>x.id===id);
document.addEventListener('click',e=>{const b=e.target.closest('[data-rl],[data-rp],[data-rr],[data-rg],[data-re],[data-rd],[data-rpls],[data-rsa]');if(!b)return;const d=b.dataset,id=+(d.rl||d.rp||d.rr||d.rg||d.re||d.rd||d.rpls||d.rsa),r=resOf(id);
  if(d.re!==undefined)return editRes(id);if(!r)return;
  if(d.rpls)return resPlsPick(id,r.name,r.descr||'');
  if(d.rsa){fitArea(resPart(r));if(narrow())togglePanel('res',false);return}
  if(d.rg){stopFollow();map.panTo([r.lat,r.lon]);if(narrow())togglePanel('res',false);return}
  if(d.rl)return api('incident/rescuee/locate',{id,own:1}).then(poll).catch(fail);
  if(d.rp)return pickPoint(`Tippe auf die Karte, um den Standort von «${r.name}» zu setzen.`).then(q=>api('incident/rescuee/locate',{id,lat:q.lat,lon:q.lng})).then(()=>{togglePanel('res',true);poll()}).catch(fail);
  if(d.rr){const v=+d.v;if(!confirm(v?`«${r.name}» als gerettet melden?`:`«Gerettet» bei «${r.name}» zurücknehmen?`))return;return api('incident/rescuee/rescued',{id,rescued:v}).then(()=>{map.closePopup();poll()}).catch(fail)}
  if(d.rd&&confirm(`Rettling «${r.name}» für alle entfernen?`))api('incident/rescuee/remove',{id}).then(poll).catch(fail)});
function bindMarks(){
  document.querySelectorAll('#sheet [data-kick]').forEach(x=>x.onclick=()=>{const n=x.dataset.n;confirm(n+' aus dem Einsatz entfernen?')&&api('incident/kick',{user_id:+x.dataset.kick}).then(poll).catch(fail)});
  document.querySelectorAll('#sheet [data-mr]').forEach(x=>x.onclick=()=>api('incident/mark/remove',{id:+x.dataset.mr}).then(poll).catch(fail));
  // Einsatzleitung: Spezialrolle einer Einsatzkraft umstellen
  document.querySelectorAll('#sheet [data-rset]').forEach(x=>x.onchange=()=>{x.blur();api('incident/role/set',{user_id:+x.dataset.rset,role_id:+x.value||null}).then(poll).catch(e=>{fail(e);poll()})})}
/* ---------- Polling ---------- */
// Alarmierungsart kommt vom Server (critical): scharfer Einsatz immer kritisch, Übung nur mit Übungsmodus
let timer;async function poll(){try{const nx=await api(`incident/state&since=${lastMsg}`);
    if(nx.incident){const i=nx.incident,cr=nx.critical!==false;if(lastIncId!==i.id){lastIncId=i.id;lastMsg=0;msgInit=false;msgData=[];if(notify(i.is_exercise?'ÜBUNG':'EINSATZ',i.message,'i:'+i.id,cr))toggleSheet(true)}
      // alle sehen alle Nachrichten, benachrichtigt werden nur die markierten Empfänger (bzw. alle bei «an alle»)
      (nx.messages||[]).forEach(m=>{lastMsg=Math.max(lastMsg,m.id);msgData.push(m);if(m.from_user!=me.id&&nx.me&&!nx.me.left_at&&nx.me.mode!=='declined'&&msgForMe(m))notify('Nachricht von '+m.from_name,m.text,'m:'+m.id,cr)});msgInit=true;
      if(st&&st.me&&!st.me.left_at&&st.me.mode!=='declined'&&nx.me&&nx.me.left_at&&!window.selfLeft&&notify('AUS EINSATZ ENTFERNT','Die Einsatzleitung hat dich aus dem Einsatz entfernt.','k:'+i.id+':'+nx.me.left_at,cr))toggleSheet(true);
      st=nx;if(nx.me&&!nx.me.left_at&&nx.me.mode!=='declined'&&shares(nx.me.mode))track();else stop()}
    else{if(st&&st.incident){const x=st.incident.is_exercise;if(notify(x?'ÜBUNG BEENDET':'EINSATZ BEENDET',x?'Die Übung wurde beendet.':'Der Einsatz wurde beendet.','e:'+st.incident.id,st.critical!==false))toggleSheet(true)}st=nx;lastIncId=null;stop()}
    if(st&&st.incident)creating=false;updateChip();drawMap();followNow();renderPeople();renderMsgs();renderPois();renderRes();renderBigLog();if(!document.activeElement.matches('input,textarea,select'))draw()}catch(e){console.error('Poll',e)}}
async function render(){clearInterval(timer);if(!token)return loginView($('#app'),'Swiftwater Rescue',render);
  try{me=(await api('me')).me}catch(e){return}
  if(me.must_change){$('#app').innerHTML='';return pwDialog(true,render)} // nach Zurücksetzen zuerst eigenes Passwort setzen
  try{roles=await api('roles');modes=await api('modes')}catch(e){return}
  shell();await poll();draw();timer=setInterval(poll,4000)}
render();
</script></body></html>
