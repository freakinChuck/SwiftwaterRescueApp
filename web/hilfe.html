<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Swiftwater Rescue – Bedienungsanleitung</title>
<link rel="icon" href="img/icon-192.png">
<link rel="stylesheet" href="common.css?v=0">
<style>
/* Bedienungsanleitung (Issue #37): ohne Anmeldung, Kapitel als Markdown in hilfe/*.md, Adresse hilfe.html#<Kapitel>/<Anker> */
body{line-height:1.55}
#hlHead{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.6rem 1rem;padding-top:calc(.6rem + env(safe-area-inset-top));border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
#hlHead h1{margin:0;font-size:1.15rem;flex:1 1 14rem}
#hlQ{flex:1 1 14rem;max-width:22rem;margin:0}
#hlWrap{display:grid;grid-template-columns:17rem minmax(0,1fr);gap:1.5rem;max-width:78rem;margin:0 auto;padding:0 1rem}
#hlToc{position:sticky;top:3.6rem;align-self:start;max-height:calc(100vh - 4.2rem);overflow:auto;padding:.8rem 0 2rem;font-size:.93rem}
#hlToc a{display:block;color:inherit;text-decoration:none;padding:.2rem .5rem;border-radius:5px}
#hlToc a:hover{background:var(--panel)}
#hlToc a.k{font-weight:700;margin-top:.35rem}#hlToc a.s{padding-left:1.3rem;color:var(--mut)}
#hlToc a[aria-current=true]{background:var(--ex);color:#fff}
#hlToc .sub{display:none}#hlToc .on .sub{display:block}
#hlMain{padding:.4rem 0 calc(3rem + env(safe-area-inset-bottom));min-width:0}
#hlMain h1{font-size:1.6rem;margin:.9rem 0 .5rem}#hlMain h2{font-size:1.3rem;margin:2rem 0 .4rem;padding-top:.6rem;border-top:1px solid var(--line)}
#hlMain h3{font-size:1.07rem;margin:1.4rem 0 .3rem}#hlMain h4{font-size:1rem;margin:1rem 0 .2rem}
#hlMain h2,#hlMain h3,#hlMain h4{scroll-margin-top:4rem}
#hlMain a{color:#7cc4ff}
#hlMain code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 .3rem;font-size:.9em}
#hlMain ul,#hlMain ol{padding-left:1.4rem;margin:.3rem 0 .7rem}#hlMain li{margin:.15rem 0}
#hlMain table{border-collapse:collapse;margin:.5rem 0 1rem;font-size:.93rem;width:100%}
#hlMain th{text-align:left;color:var(--mut);font-weight:600;border-bottom:1px solid var(--line);padding:.35rem .5rem}
#hlMain td{border-bottom:1px solid var(--line);padding:.35rem .5rem;vertical-align:top}
#hlMain blockquote{margin:.7rem 0;padding:.5rem .9rem;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ex);border-radius:6px}
#hlMain blockquote.w{border-left-color:var(--alarm)}
#hlMain blockquote p{margin:.3rem 0}
figure{margin:.8rem 0 1.2rem;display:inline-block;vertical-align:top;max-width:100%}
figure.p{width:min(18rem,100%);margin-right:1rem}
figure img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
figcaption{color:var(--mut);font-size:.85rem;margin-top:.3rem}
.hlres a{display:block;padding:.5rem .7rem;border:1px solid var(--line);border-radius:6px;margin:.4rem 0;color:inherit;text-decoration:none;background:var(--panel)}
.hlres a b{color:#7cc4ff}.hlres mark{background:#7a5a00;color:#fff;border-radius:2px}
.hlnav{display:flex;justify-content:space-between;gap:1rem;margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line)}
.hlnav a{color:#7cc4ff;text-decoration:none}
#hlBig{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
#hlBig img{max-width:96vw;max-height:94vh}
#hlTocBtn{display:none}
@media(max-width:820px){#hlWrap{grid-template-columns:1fr}#hlToc{display:none;position:static;max-height:none;border-bottom:1px solid var(--line)}#hlToc.open{display:block}#hlTocBtn{display:inline-block}
  #hlHead h1{font-size:1rem;flex-basis:9rem}#hlQ{order:5;flex-basis:100%;max-width:none}figure.p{width:min(15rem,100%)}}
@media print{#hlHead,#hlToc,.hlnav{display:none}#hlWrap{display:block}body{background:#fff;color:#000}}
</style></head><body>
<header id="hlHead"><h1>Swiftwater Rescue – Bedienungsanleitung</h1><button id="hlTocBtn" aria-expanded="false" aria-controls="hlToc">☰ Inhalt</button><input id="hlQ" type="search" placeholder="Anleitung durchsuchen …" aria-label="Anleitung durchsuchen"><a class="btn" href="./">Zur Einsatz-App</a></header>
<div id="hlWrap"><nav id="hlToc" aria-label="Inhalt"></nav><main id="hlMain"><div class="mut">Wird geladen …</div></main></div>
<script>
// Kapitel in dieser Reihenfolge, Datei hilfe/<Schlüssel>.md. Neue Kapitel hier eintragen.
const KAP=[['start','Erste Schritte'],['alarm','Alarm und Teilnahme'],['karte','Die Karte'],['einsatz','Im Einsatz'],['leitung','Einsatzleitung'],['planung','Übungen und Planungen'],['profil','Profil und Einstellungen'],['auswertung','Auswertung'],['verwaltung','Verwaltung'],['app','Native App (Android und iOS)']];
const V=(document.querySelector('link[href^="common.css"]').getAttribute('href').split('v=')[1]||'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=s=>s.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const MD={},DOC={}; // Rohtext und Aufbereitung je Kapitel

// Kleiner Markdown-Umsetzer: Überschriften mit {#anker}, Absätze, Listen (verschachtelt über Einzug), Tabellen, Hinweise (> , > ! = Warnung), Bilder, Links, fett, kursiv, Code
function inl(s,k){s=esc(s);
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,a,u)=>`<img src="${src(u)}" alt="${a}">`);
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,u)=>{const own=u[0]==='#',ext=/^https?:/.test(u);return`<a href="${own?'#'+(u.includes('/')||KAP.some(x=>x[0]===u.slice(1))?u.slice(1):k+'/'+u.slice(1)):u}"${ext?' target="_blank" rel="noopener"':''}>${t}</a>`});
  return s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(«])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>')}
const src=u=>/^(https?:|\/)/.test(u)?u:'hilfe/'+u+'?v='+V;
function md(txt,k){const L=txt.replace(/\r/g,'').split('\n'),out=[],heads=[];let i=0;
  const para=[];const flush=()=>{if(para.length){out.push('<p>'+inl(para.join(' '),k)+'</p>');para.length=0}};
  while(i<L.length){const l=L[i];
    let m=l.match(/^(#{1,4})\s+(.*?)(?:\s*\{#([\w-]+)\})?\s*$/);
    if(m){flush();const n=m[1].length,id=m[3]||slug(m[2]);if(n>1)heads.push([n,id,m[2]]);out.push(`<h${n} id="${k}/${id}">${inl(m[2],k)}</h${n}>`);i++;continue}
    if(/^\s*$/.test(l)){flush();i++;continue}
    m=l.match(/^!\[([^\]]*)\]\(([^)\s]+)\)\s*$/); // Bild allein auf der Zeile = Abbildung mit Beschriftung
    if(m){flush();const figs=[];while(i<L.length&&(m=L[i].match(/^!\[([^\]]*)\]\(([^)\s]+)\)\s*$/))){figs.push(`<figure><img src="${src(m[2])}" alt="${esc(m[1])}" loading="lazy"><figcaption>${inl(m[1],k)}</figcaption></figure>`);i++}out.push('<div>'+figs.join('')+'</div>');continue}
    if(/^>/.test(l)){flush();const b=[];while(i<L.length&&/^>/.test(L[i]))b.push(L[i++].replace(/^>\s?/,''));const w=/^!\s/.test(b[0]);if(w)b[0]=b[0].slice(2);out.push(`<blockquote${w?' class="w"':''}>${md(b.join('\n'),k).html}</blockquote>`);continue}
    if(/^\|/.test(l)){flush();const rows=[];while(i<L.length&&/^\|/.test(L[i]))rows.push(L[i++]);const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const hd=cells(rows[0]),body=rows.slice(/^\|[\s:-|]+\|$/.test(rows[1]||'')?2:1);out.push(`<table><thead><tr>${hd.map(c=>`<th>${inl(c,k)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${cells(r).map(c=>`<td>${inl(c,k)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);continue}
    if(/^\s*([-*]|\d+\.)\s/.test(l)){flush();const b=[];while(i<L.length&&(/^\s*([-*]|\d+\.)\s/.test(L[i])||(/^\s{2,}\S/.test(L[i])&&b.length)))b.push(L[i++]);out.push(list(b,k));continue}
    para.push(l.trim());i++}
  flush();return{html:out.join('\n'),heads}}
function list(lines,k){const ind=s=>s.match(/^\s*/)[0].length,base=ind(lines[0]),ol=/^\s*\d+\./.test(lines[0]);const items=[];
  for(const l of lines){if(ind(l)===base&&/^\s*([-*]|\d+\.)\s/.test(l))items.push([l.replace(/^\s*([-*]|\d+\.)\s+/,'')]);else items[items.length-1].push(l)}
  return`<${ol?'ol':'ul'}>${items.map(([t,...sub])=>{const nested=sub.filter(s=>/^\s*([-*]|\d+\.)\s/.test(s)),cont=sub.filter(s=>!/^\s*([-*]|\d+\.)\s/.test(s)&&!nested.length);
    return`<li>${inl([t,...cont.map(s=>s.trim())].join(' '),k)}${nested.length?list(sub,k):''}</li>`}).join('')}</${ol?'ol':'ul'}>`}

// Inhaltsverzeichnis: Kapitel, beim offenen Kapitel die Abschnitte (Stufe 2)
function toc(k,a){document.getElementById('hlToc').innerHTML=KAP.map(([key,t])=>`<div class="${key===k?'on':''}"><a class="k" href="#${key}" ${key===k&&!a?'aria-current="true"':''}>${esc(t)}</a><div class="sub">${(DOC[key]?DOC[key].heads:[]).filter(h=>h[0]===2).map(h=>`<a class="s" href="#${key}/${h[1]}" ${key===k&&a===h[1]?'aria-current="true"':''}>${inl(h[2],key)}</a>`).join('')}</div></div>`).join('')}
function show(){const h=decodeURIComponent(location.hash.slice(1)).replace(/^\//,''),[k0,a]=h.split('/'),k=KAP.some(x=>x[0]===k0)?k0:'start',m=document.getElementById('hlMain');
  document.getElementById('hlQ').value='';
  if(!DOC[k]){m.innerHTML='<div class="mut">Dieses Kapitel konnte nicht geladen werden (ohne Verbindung?).</div>';toc(k,a);return}
  const n=KAP.findIndex(x=>x[0]===k),pv=KAP[n-1],nx=KAP[n+1];
  m.innerHTML=DOC[k].html+`<div class="hlnav"><span>${pv?`<a href="#${pv[0]}">← ${esc(pv[1])}</a>`:''}</span><span>${nx?`<a href="#${nx[0]}">${esc(nx[1])} →</a>`:''}</span></div>`;
  m.querySelectorAll('figure img').forEach(im=>{const f=()=>im.closest('figure').classList.toggle('p',im.naturalHeight>im.naturalWidth);im.complete?f():im.onload=f});
  toc(k,a);document.getElementById('hlToc').classList.remove('open');document.title='Swiftwater Rescue – '+KAP[n][1];
  const t=a&&document.getElementById(k+'/'+a);if(!t){window.scrollTo(0,0);return}
  // Bilder davor haben vor dem Laden keine Höhe: zuerst springen, nach dem Laden nochmals (höchstens 3 s, nicht mehr nach eigenem Scrollen)
  t.scrollIntoView();const gen=++JUMP;
  const pre=[...m.querySelectorAll('figure img')].filter(im=>!im.complete&&(im.compareDocumentPosition(t)&Node.DOCUMENT_POSITION_FOLLOWING));
  pre.forEach(im=>im.loading='eager');
  Promise.race([Promise.all(pre.map(im=>new Promise(r=>{im.addEventListener('load',r);im.addEventListener('error',r)}))),new Promise(r=>setTimeout(r,3000))]).then(()=>{if(gen===JUMP)t.scrollIntoView()})}
let JUMP=0;['wheel','touchstart','keydown','mousedown'].forEach(e=>addEventListener(e,()=>JUMP++,{passive:true}));

// Suche über alle Kapitel: Abschnitte (bis Stufe 3) mit allen Suchwörtern
function search(q){const w=q.toLowerCase().split(/\s+/).filter(x=>x.length>1),m=document.getElementById('hlMain');if(!w.length){show();return}const res=[];
  for(const[k,t] of KAP){if(!MD[k])continue;let cur={id:'',title:t,txt:''};const secs=[cur];
    for(const l of MD[k].split('\n')){const h=l.match(/^(#{1,3})\s+(.*?)(?:\s*\{#([\w-]+)\})?\s*$/);if(h&&h[1].length>1){cur={id:h[3]||slug(h[2]),title:h[2],txt:''};secs.push(cur)}else cur.txt+=' '+l.replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/[*`>|#]/g,'')}
    for(const s of secs){const all=(s.title+' '+s.txt).toLowerCase();if(w.every(x=>all.includes(x))){const p=s.txt.toLowerCase().indexOf(w[0]),sn=s.txt.slice(Math.max(0,p-60),p+140).replace(/\s+/g,' ').trim();
      res.push(`<a href="#${k}${s.id?'/'+s.id:''}"><b>${esc(t)}${s.id?' › '+esc(s.title):''}</b><div class="mut">${esc(sn).replace(new RegExp('('+w.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'),'<mark>$1</mark>')} …</div></a>`)}}}
  m.innerHTML=`<h1>Suche</h1><div class="hlres">${res.length?res.join(''):'<p class="mut">Keine Treffer.</p>'}</div>`}

(async()=>{await Promise.all(KAP.map(async([k])=>{try{const r=await fetch('hilfe/'+k+'.md?v='+V);if(r.ok){MD[k]=await r.text();DOC[k]=md(MD[k],k)}}catch(e){}}));
  show();addEventListener('hashchange',show);
  const q=document.getElementById('hlQ');let tq;q.oninput=()=>{clearTimeout(tq);tq=setTimeout(()=>search(q.value),200)};
  q.onkeydown=e=>{if(e.key==='Escape'){q.value='';show()}};
  document.getElementById('hlMain').addEventListener('click',e=>{const im=e.target.closest('figure img');if(im){const d=document.createElement('div');d.id='hlBig';d.innerHTML=`<img src="${im.src}" alt="">`;d.onclick=()=>d.remove();document.body.appendChild(d)}});
  addEventListener('keydown',e=>{if(e.key==='Escape'){const b=document.getElementById('hlBig');if(b)b.remove()}});
  const tb=document.getElementById('hlTocBtn');tb.onclick=()=>{const o=document.getElementById('hlToc').classList.toggle('open');tb.setAttribute('aria-expanded',o)}})();
</script>
</body></html>
