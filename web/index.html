    +`<div class="pcard"><h4>Anzeige</h4><label class="mut">Koordinatensystem<select id="csys"><option value="">Standard: ${esc(COORD_SYS[me.coord_default]||COORD_SYS.lv95)}</option>${Object.entries(COORD_SYS).map(([k,v])=>`<option value="${k}" ${k===me.coord_sys?'selected':''}>${esc(v)}</option>`).join('')}<option value="none" ${me.coord_sys==='none'?'selected':''}>Keine Koordinaten anzeigen</option></select></label>${feat('nav')?`<label class="mut">Navigations-App (Knopf 🧭)<select id="navA"><option value="">Standard: ${esc(NAV_APPS[me.nav_default]||NAV_APPS.google)}</option>${(me.nav_apps||[]).filter(navOk).map(k=>`<option value="${k}" ${k===me.nav_app?'selected':''}>${esc(NAV_APPS[k])}</option>`).join('')}</select></label>`:''}</div>`
    +hyPrefs()+aiPrefs()
    +`<div class="pcard"><h4>Rechtliches</h4><div class="mut">Wer die App betreibt, welche Daten sie speichert und welche Lizenzen gelten.</div><div class="pbtns"><a class="btn" href="legal.html#impressum" target="_blank" rel="noopener">Impressum</a><a class="btn" href="legal.html#lizenzen" target="_blank" rel="noopener">Lizenzen</a><a class="btn" href="legal.html#datenschutz" target="_blank" rel="noopener">Datenschutz</a></div></div>`;
  // Issue #126: früher stand diese Prüfung doppelt; die zweite brach immer ab, Knöpfe und Abwesenheiten blieben ohne Funktion
  if(h===prefsHtml)return;prefsHtml=h;p.innerHTML=h;absMine();sessMine();hyBindPrefs(p);
  p.querySelectorAll('[data-aisel]').forEach(x=>x.onchange=e=>{e.target.blur();const v={};p.querySelectorAll('[data-aisel]').forEach(y=>{if(y.value)v[y.dataset.aisel]=y.value});
    api('me/settings',{ai_modes:v}).then(()=>api('me')).then(r=>{me=r.me;prefsHtml='';prefsDraw();draw()}).catch(fail)});
  $('#bPh').onclick=()=>$('#ph').click();$('#ph').onchange=photo;$('#bPw').onclick=()=>pwDialog(false);$('#bOut').onclick=async()=>{await pushOff(true);prefsHash();logout();stop();render()};bindPush();
  $('#exm').onchange=e=>{const v=e.target.checked?1:0;api('me/settings',{exercise_mode:v}).then(()=>{me.exercise_mode=v;prefsHtml='';e.target.blur();return poll()}).catch(x=>{e.target.checked=!v;e.target.blur();fail(x)})};
  // eigenes Koordinatensystem ('' = Standard der Verwaltung); Kartenebenen neu aufbauen, damit Popups die neue Anzeige zeigen
  $('#csys').onchange=e=>{const v=e.target.value,old=me.coord_sys;e.target.blur();me.coord_sys=v||null;poiKey=resKey='';prefsHtml='';api('me/settings',{coord_sys:v}).then(poll).catch(x=>{me.coord_sys=old;fail(x);poll()})};
  const na=$('#navA');if(na)na.onchange=e=>{const v=e.target.value,old=me.nav_app;e.target.blur();me.nav_app=v||null;prefsHtml='';api('me/settings',{nav_app:v}).catch(x=>{me.nav_app=old;fail(x);draw()})}}
// eigene Abwesenheiten im Profil (Issue #91): laden, erfassen, ändern, beenden
function absMine(){const el=$('#absMine');if(!el)return;api('absences').then(rs=>{if(!el.isConnected)return;el.innerHTML=absRows(rs,false)+'<div class="pbtns"><button id="bAbsN">+ Abwesenheit erfassen</button></div>';absBind(el,rs,absDone);$('#bAbsN').onclick=()=>absDialog(null,null,absDone)}).catch(()=>{if(el.isConnected)el.innerHTML='<div class="mut">Abwesenheiten nicht verfügbar (keine Verbindung).</div>'})}
// Angemeldete Apps im Profil (Issue #108): Gerätesitzungen der nativen Apps, nur angezeigt, wenn es welche gibt; die eigene lässt sich hier nicht entfernen (dafür Abmelden)
function sessMine(){const el=$('#sessMine');if(!el)return;api('me/sessions').then(rs=>{if(!el.isConnected)return;
  el.innerHTML=rs.length?`<h5>Angemeldete Apps</h5>${rs.map(r=>`<div class="row" style="align-items:center;justify-content:space-between;margin:.2rem 0"><span><b>${esc(r.device)}</b>${r.platform?' · '+esc({android:'Android',ios:'iOS'}[r.platform]||r.platform):''}${r.cur?' · <i>dieses Gerät</i>':''}<br><span class="mut">angemeldet ${esc(fmtDT(r.created))} · zuletzt ${esc(fmtDT(r.last_seen))}</span></span>${r.cur?'':`<button data-sess="${r.id}">Entfernen</button>`}</div>`).join('')}`:'';
  el.querySelectorAll('[data-sess]').forEach(b=>b.onclick=async()=>{if(!confirm('App auf diesem Gerät abmelden? Sie erhält danach keine Alarme mehr.'))return;try{await api('me/session/remove',{id:+b.dataset.sess});toast('App abgemeldet');sessMine()}catch(e){fail(e)}})}).catch(()=>{})}
function absDone(){api('me').then(r=>{me.absent=r.me.absent;prefsHtml='';prefsDraw();return poll()}).catch(fail)}
async function render(){clearInterval(timer);if(!token)return loginView($('#app'),'Swiftwater Rescue',render);
  try{me=(await api('me')).me}catch(e){if(e instanceof TypeError&&!bootOff&&bootOffline())return;if(e instanceof TypeError)setTimeout(render,5000);return} // offline: letzter Stand (Issue #67)
  if(me.must_change){$('#app').innerHTML='';return pwDialog(true,render)} // nach Zurücksetzen zuerst eigenes Passwort setzen
  try{roles=await api('roles');modes=await api('modes')}catch(e){return}
  lsSet('sw_boot',{uid:me.id,me,roles,modes});bootOff=false;pushSync().then(()=>{if($('#bPushOn,#bPushOff')||pushSt!=='?')draw()});
  shell();await poll();draw();timer=setInterval(poll,4000);if(location.hash==='#einstellungen')prefs(true);if(focusReq){focusReq=false;focusArea()}}
// Geöffnet über eine Benachrichtigung zum laufenden Einsatz (sw.js, notificationclick): ?fokus=1 beim Öffnen, Nachricht {sw:'focus'} an eine offene App
let focusReq=new URLSearchParams(location.search).has('fokus');if(focusReq)history.replaceState(null,'',location.pathname+location.hash);
if(navigator.serviceWorker)navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.sw==='focus'&&me)focusArea()});
render();
</script></body></html>
