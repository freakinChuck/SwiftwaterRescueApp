#rpFollow{position:absolute;top:.6rem;left:3.4rem;z-index:1000;background:var(--ex);color:#fff;border-radius:6px;padding:.2rem .3rem .2rem .7rem;font-size:.9rem;display:flex;gap:.4rem;align-items:center;box-shadow:0 1px 4px #0008;max-width:calc(100% - 4rem)}#rpFollow[hidden]{display:none}#rpFollow button{background:transparent;border:0;color:#fff;padding:.15rem .4rem}
.leaflet-tooltip.rplbl{background:#0f2430e6;color:#fff;border:0;box-shadow:none;font-weight:600;padding:1px 5px;font-size:calc(12px*var(--rpsz,1))} /* --rpsz: Regler «Grösse der Positionen» */
#rpSzL{display:flex;gap:.5rem;align-items:center}#rpSzL input{flex:1;padding:0}#rpSzL span{min-width:3.2rem;text-align:right;font-variant-numeric:tabular-nums}.leaflet-tooltip.rplbl::before{display:none}
@media(max-width:760px){#rpBody{flex-direction:column}#rpSide{width:auto;height:40%;border-left:0;border-top:1px solid var(--line)}}
/* Applikationslog (Issue #139): Zeile mit Stufe als Farbe links, Angaben aufklappbar */
.alf{align-items:center}.alf>select,.alf>input{flex:1 1 11rem;min-width:0}.alf>button{flex:0 0 auto}.alau{display:flex;gap:.4rem;align-items:center;flex:0 0 auto;white-space:nowrap}
.alc{flex:0 0 auto;padding:.15rem .55rem;border-radius:999px;font-size:.82rem;border:1px solid var(--line)}.alc.e{border-color:#ff6b6b;color:#ff9a8a}.alc.w{border-color:#e8b545;color:#f2cf7a}.alc.i{color:var(--mut)}#alDay{align-items:center}
.all{border-top:1px solid var(--line)}
.alr{display:grid;grid-template-columns:10.5rem 5.5rem 9rem minmax(0,1fr) minmax(0,14rem);gap:.25rem .7rem;padding:.4rem .6rem;border-left:4px solid var(--line);border-bottom:1px solid var(--line);font-size:.88rem;cursor:default}
.alr.warn{border-left-color:#e8b545}.alr.err{border-left-color:#ff6b6b}.alr.warn .alv{color:#f2cf7a}.alr.err .alv{color:#ff9a8a}.alr[data-al]:has(.mut):hover{background:#ffffff08}
.alt{color:var(--mut);white-space:nowrap}.alm{overflow-wrap:anywhere}.alu{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alx{grid-column:1/-1;margin:.2rem 0 0;padding:.5rem;background:var(--bg);border-radius:6px;font-size:.78rem;white-space:pre-wrap;overflow-wrap:anywhere;max-height:20rem;overflow:auto}
@media(max-width:900px){.alr{grid-template-columns:auto auto minmax(0,1fr)}.alm{grid-column:1/-1}.alu{grid-column:1/-1}}
</style></head><body>
<div id="app"></div>
<script src="common.js?v=0"></script>
<script>
/* Verwaltung: jede Person sieht die Bereiche, für die eine ihrer Benutzerrollen das Recht hat (Issue #63, NAV_PERM). Die API prüft die Berechtigung bei jedem Aufruf.
   Alle anderen sehen nur «Meine Einsätze» (Issue #61, Log und Replay der eigenen beendeten Einsätze), sofern die Verwaltung das nicht ausgeschaltet hat (my_runs). */
let me=null,users=[],roles=[],uroles=null;
onUnauth=()=>start();
// Benutzerrollen (Issue #63): mehrere je Person, Rechte = alle Rechte aller Rollen. Vergeben/entziehen nur Rollen, deren Rechte man selbst hat (prüft auch der Server)
const UR=id=>(uroles&&uroles.roles.find(r=>r.id===id))||{name:'?',perms:[]};
const ROLE_LABEL=u=>u.uroles.length?u.uroles.map(id=>esc(UR(id).name)).join(', '):'<span class="mut">keine</span>';
const urOk=r=>r.perms.every(can);
// Rollenauswahl: je Rolle eine Karte zum Antippen (aria-pressed) mit den enthaltenen Rechten
const urPermTxt=r=>r.sys==='admin'?'Alle Rechte, auch künftige':r.perms.map(k=>(uroles.perms.find(p=>p.k===k)||{name:k}).name).join(' · ')||'keine Rechte';
const roleChecks=u=>`<div class="urh"><span class="mut">Benutzerrollen <span class="urn"></span></span>${uroles.roles.length>8?'<input type="search" class="urf" placeholder="Rolle oder Recht suchen" aria-label="Rollen filtern">':''}</div><div class="urg" role="group" aria-label="Benutzerrollen">${uroles.roles.map(r=>{const on=u?u.uroles.includes(r.id):!!r.def&&urOk(r),lock=!urOk(r)||u&&u.id===me.id&&r.sys==='admin'&&on;
  return`<button type="button" class="urb" data-ur="${r.id}" aria-pressed="${on}" ${lock?'disabled':''} title="${esc(urPermTxt(r))}${lock?(urOk(r)?' – die eigene Rolle Systemadministrator bleibt':' – enthält Rechte, die du selbst nicht hast'):''}"><b>${esc(r.name)}</b><small>${esc(urPermTxt(r))}</small></button>`}).join('')}</div>`;
const pwField=(id,label)=>`<label class="mut">${label}<span class="pwr"><input id="${id}" autocomplete="off" spellcheck="false" value="${genPw()}"><button type="button" data-pwn title="Neues Passwort erzeugen">↻</button><button type="button" data-pwc>Kopieren</button></span></label>`;
const pwWire=d=>{const i=d.querySelector('.pwr input');d.querySelector('[data-pwn]').onclick=()=>i.value=genPw();
  d.querySelector('[data-pwc]').onclick=()=>navigator.clipboard.writeText(i.value).then(()=>toast('Startpasswort kopiert.','ok'),()=>{i.select();toast('Kopieren nicht möglich, bitte von Hand kopieren.','info')})};
const roleWire=el=>{const bs=[...el.querySelectorAll('.urb')],n=el.querySelector('.urn'),f=el.querySelector('.urf');
  const cnt=()=>{const k=bs.filter(b=>b.getAttribute('aria-pressed')==='true').length;n.textContent=k?`(${k} gewählt)`:'(keine gewählt)'};cnt();
  bs.forEach(b=>b.onclick=()=>{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');cnt()});
  if(f)f.oninput=()=>{const q=f.value.trim().toLowerCase();bs.forEach(b=>b.hidden=!!q&&!b.textContent.toLowerCase().includes(q))}};
const roleVal=el=>[...el.querySelectorAll('[data-ur]')].filter(c=>c.getAttribute('aria-pressed')==='true').map(c=>+c.dataset.ur);
async function start(){const a=$('#app');if(!token)return loginView(a,'Swiftwater Rescue – Verwaltung',start);
  try{me=(await api('me')).me}catch(e){if(token)a.innerHTML=`<div class="card"><p>${esc(e.message)}</p></div>`;return}
  if(me.must_change){a.innerHTML='';return pwDialog(true,start)}
  if(!nav().length&&me.my_runs==='off'){a.innerHTML=`<div class="card"><h1>Kein Zugriff</h1><p>Deine Benutzerrollen geben dir keinen Zugriff auf die Verwaltung.</p><div class="row"><a class="btn" href="./">Zur Einsatz-App</a><button id="bOut">Abmelden</button></div></div>`;$('#bOut').onclick=()=>{logout();start()};return}
  MY=myMode();const adm=nav().length>0;
  if(MY){a.innerHTML=`<header><h1>Swiftwater Rescue – Meine Einsätze</h1><span class="mut">${esc(me.name)}</span><a class="btn" href="./">Zur Einsatz-App</a>${adm?'<a class="btn" href="#" id="bVw">⚙ Verwaltung</a>':''}${userMenu()}</header>
    <div id="wrap" class="my"><main><section id="sMy"><h2>Meine Einsätze</h2><div class="mut">Wird geladen …</div></section></main></div>`;
    userMenuWire();
    if(adm)$('#bVw').onclick=e=>{e.preventDefault();location.hash='einsatzlog'};
    document.title='Swiftwater Rescue – Meine Einsätze';return loadMy()}
  a.innerHTML=`<header><h1>Swiftwater Rescue – Verwaltung</h1><a class="btn" href="./">Zur Einsatz-App</a>${me.my_runs!=='off'?'<a class="btn" href="#meine" title="Log und Replay deiner eigenen Einsätze, wie für Einsatzkräfte ohne Verwaltungsrechte">📋 Meine Einsätze</a>':''}${userMenu()}</header>
    <div id="wrap"><nav id="nav" aria-label="Bereiche der Verwaltung"><select id="navSel" aria-label="Bereich wählen">${nav().map(([g,its])=>`<optgroup label="${esc(g)}">${its.map(([k,,l])=>`<option value="${k}">${esc(l)}</option>`).join('')}</optgroup>`).join('')}</select>
    <div class="navl">${navItems().length>8?'<input type="search" id="navQ" placeholder="Bereich suchen …" aria-label="Bereich der Verwaltung suchen" autocomplete="off">':''}${nav().map(([g,its])=>its.length===1?`<div class="ngw one" data-g="${esc(g)}">${navLink(its[0],g)}</div>`
      :`<div class="ngw" data-g="${esc(g)}"><button type="button" class="ng" aria-expanded="false"><span class="ni" aria-hidden="true">${NAV_ICON[g]||'•'}</span><span class="nl">${esc(g)}</span><span class="nc">${its.length}</span><span class="chev" aria-hidden="true">›</span></button><div class="ngi">${its.map(it=>navLink(it)).join('')}</div></div>`).join('')}<div class="mut nq0" hidden>Kein Bereich gefunden.</div></div></nav>
    <main>${navItems().map(([k,id,l])=>`<section id="${id}" hidden><h2>${esc(l)}</h2><div class="mut">Wird geladen …</div></section>`).join('')}</main></div>`;
  userMenuWire();navWire();
  $('#navSel').onchange=e=>{location.hash=e.target.value};showNav()}
/* ---------- Navigation (Issue #32) ---------- */
// Kategorien mit Unterpunkten: [Kategorie, [[Hash, Abschnitt-ID, Bezeichnung, Laden]]]. Neue Einstellungen hier als Unterpunkt aufnehmen.
// Es ist immer nur ein Abschnitt sichtbar (Hash in der Adresse, Neuladen und Zurück funktionieren); er wird bei jedem Öffnen frisch geladen.
const NAV=[
  ['Personen',[['benutzer','sU','Benutzer',loadUsers],['benutzerrollen','sUR','Benutzerrollen',loadURoles],['einsatzgruppen','sG','Einsatzgruppen',loadGroups],['abwesenheiten','sAb','Abwesenheiten',loadAbs]]],
  ['Einsatz',[['einsatztypen','sT','Einsatztypen',loadTypes],['einrueckoptionen','sM','Einrückoptionen',loadModes],['spezialrollen','sR','Spezialrollen',loadRoles],['externe','sX','Externe Einsatzkräfte',loadExt],['symbole','sSy','Einsatzsymbole',loadSym]]],
  ['Übungen',[['uebungen','sEx','Übungen vorbereiten',loadEx]]],
  ['Funktionen',[['funktionen','sFn','Funktionen',loadFeat],['flussdistanz','sF','Flussdistanz',loadRd],['navigation','sNv','Navigation',loadNav],['ai','sAi','AI-Assistent',loadAi]]],
  ['Karte & Daten',[['koordinaten','sC','Koordinaten',loadCoords],['gewaesserdaten','sO','Gewässerdaten',loadOp],['helikopter','sH','Helikopter',loadAir],['pegel','sHy','Pegel & Abfluss',loadHydro],['standorte','sPl','Feste Standorte',loadPlaces]]],
  ['Auswertung',[['einsatzlog','stats','Einsatzstatistik und Einsatzlog',loadStats],['aarcfg','sAarC','After Action Review einrichten',loadAarCfg],['personenstatistik','sPS','Statistik pro Person',loadPS],['einsicht','sMyS','Einsicht für Einsatzkräfte',loadMyS],['anonymisierung','sAnon','Anonymisierung',loadAnon]]],
  ['Rechtliches',[['rechtliches','sLg','Impressum & Datenschutz',loadLegal]]],
  ['Konnektivität',[['emailalarm','sMail','E-Mail-Alarm',loadMail]]],
  ['System',[['applog','sAL','Applikationslog',loadAppLog]]],
];
// Recht je Bereich (Issue #63); sichtbar sind nur Bereiche, für die die Person das Recht hat (bei einer Liste: eines davon)
const NAV_PERM={benutzer:'users',benutzerrollen:'uroles',einsatzgruppen:'groups',abwesenheiten:'avail',einsatztypen:'cfg_inc',einrueckoptionen:'cfg_inc',spezialrollen:'cfg_inc',externe:'cfg_inc',symbole:'cfg_inc',uebungen:'ex_plan',funktionen:'cfg_func',flussdistanz:'cfg_func',navigation:'cfg_func',ai:'cfg_ai',koordinaten:'cfg_map',gewaesserdaten:'cfg_map',helikopter:'cfg_map',pegel:'cfg_map',standorte:'cfg_map',einsatzlog:['stats','aar','aar_rel','aar_arch'],aarcfg:'aar_cfg',personenstatistik:'stats',einsicht:'cfg_my',anonymisierung:'anon',rechtliches:'legal',emailalarm:'cfg_conn',applog:'applog'};
const nav=()=>NAV.map(([g,its])=>[g,its.filter(([k])=>[].concat(NAV_PERM[k]).some(can))]).filter(([,its])=>its.length);
// «Meine Einsätze» (Issue #61) ist getrennt von der Verwaltung (#meine, ohne Navigation): die Ansicht als Einsatzkraft, auch für Administratoren und Übungsleiter
// (API mit my=1, also nur eigene Einsätze, gemäss Einstellung my_runs). Einsatzkräfte ohne Verwaltungsrechte sehen nur sie.
let MY=false;const myMode=()=>me.my_runs!=='off'&&(!nav().length||location.hash==='#meine');const myQ=()=>MY?'&my=1':'';
const navItems=()=>nav().flatMap(([,its])=>its);
// Navigation (Issue #128): Kategorien mit Symbol einklappbar, die aktuelle wird beim Öffnen eines Bereichs aufgeklappt; offene pro Gerät gemerkt (sw_navopen).
// Kategorien mit nur einem Bereich als direkter Link. Die Suche filtert die Bereiche, Enter öffnet den ersten Treffer.
const NAV_ICON={'Personen':'👥','Einsatz':'🚨','Übungen':'🎯','Funktionen':'🧩','Karte & Daten':'🗺️','Auswertung':'📊','Rechtliches':'⚖️','Konnektivität':'🔌','System':'🛠️'};
const navLink=([k,,l],g)=>`<a href="#${k}" data-k="${k}">${g?`<span class="ni" aria-hidden="true">${NAV_ICON[g]||'•'}</span>`:''}${esc(l)}</a>`;
let navO=null;const navOGet=()=>{if(!navO){try{navO=new Set(JSON.parse(localStorage.getItem('sw_navopen')||'[]'))}catch(e){navO=new Set()}}return navO};
function navOpen(w,o,save=true){if(w.classList.contains('one'))return;w.classList.toggle('open',o);w.querySelector('.ng').setAttribute('aria-expanded',o);
  if(save){const s=navOGet();o?s.add(w.dataset.g):s.delete(w.dataset.g);try{localStorage.setItem('sw_navopen',JSON.stringify([...s]))}catch(e){}}}
function navWire(){const n=$('#nav'),s=navOGet();n.querySelectorAll('.ngw:not(.one)').forEach(w=>{navOpen(w,s.has(w.dataset.g),false);w.querySelector('.ng').onclick=()=>navOpen(w,!w.classList.contains('open'))});
  const q=$('#navQ');if(!q)return;
  q.oninput=()=>{const t=q.value.trim().toLowerCase();let any=0;n.querySelectorAll('.ngw').forEach(w=>{let hit=0;const gm=w.dataset.g.toLowerCase().includes(t);
    w.querySelectorAll('a').forEach(a=>{const h=!t||gm||a.textContent.toLowerCase().includes(t);a.hidden=!h;if(h)hit++});w.hidden=!!t&&!hit;w.classList.toggle('q',!!t&&!!hit);any+=hit});n.querySelector('.nq0').hidden=!t||any>0};
  q.onkeydown=e=>{if(e.key==='Enter'){const a=[...n.querySelectorAll('.navl a')].find(a=>!a.hidden&&!a.closest('.ngw').hidden);if(a){location.hash=a.dataset.k;q.value='';q.oninput();q.blur()}}else if(e.key==='Escape'){q.value='';q.oninput()}}}
// Konto-Menü in der Kopfzeile (Issue #128): Name, Passwort ändern, Abmelden, Impressum
const userMenu=()=>`<div class="um"><button id="bUm" aria-expanded="false" aria-haspopup="menu" aria-controls="umL" title="Konto">👤 <span>${esc(me.name)}</span> ▾</button><div id="umL" role="menu" hidden><div class="mut">${esc(me.username)}</div><button id="bPw" role="menuitem">Passwort ändern</button><button id="bOut" role="menuitem">Abmelden</button><a class="mut" href="legal.html" target="_blank" rel="noopener" role="menuitem">Impressum · Datenschutz</a></div></div>`;
let umDoc=false;
function userMenuWire(){const b=$('#bUm'),l=$('#umL'),set=o=>{l.hidden=!o;b.setAttribute('aria-expanded',o)};b.onclick=e=>{e.stopPropagation();set(l.hidden)};
  if(!umDoc){umDoc=true;document.addEventListener('click',e=>{const m=$('#umL');if(m&&!e.target.closest('.um')){m.hidden=true;$('#bUm').setAttribute('aria-expanded',false)}})}
  l.onkeydown=e=>{if(e.key==='Escape'){set(false);b.focus()}};
  $('#bPw').onclick=()=>{set(false);pwDialog(false)};$('#bOut').onclick=()=>{logout();start()}}
function showNav(){if(!$('#nav'))return;const its=navItems(),it=its.find(x=>x[0]===location.hash.slice(1))||its[0],[k,id,l,load]=it;
  its.forEach(([,i])=>{$('#'+i).hidden=i!==id});
  document.querySelectorAll('#nav a').forEach(a=>{if(a.dataset.k===k)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const g=(nav().find(([,its])=>its.some(x=>x[0]===k))||[])[0];document.querySelectorAll('#nav .ngw').forEach(w=>{const c=w.dataset.g===g;w.classList.toggle('cur',c);navOpen(w,c||navOGet().has(w.dataset.g),false)}); // von Hand geöffnete bleiben offen
  $('#navSel').value=k;document.title='Swiftwater Rescue – Verwaltung – '+l;gnLoad().then(load)}
// Farbpunkte der Einsatzgruppen beim Namen (Issue #105): nur aktive Gruppen mit «Farbe beim Namen» (Route groups/names), vor jedem Bereich frisch geladen
let GN={groups:[],members:{}};
const gnLoad=()=>api('groups/names').then(r=>{GN=r}).catch(()=>{});
function gdots(uid){const l=(GN.members[uid]||[]).map(id=>GN.groups.find(g=>g.id===id)).filter(Boolean);
  return l.length?`<span class="gdots" title="${esc(l.map(g=>g.name).join(', '))}" aria-label="Einsatzgruppen: ${esc(l.map(g=>g.name).join(', '))}">${l.map(g=>`<i class="gdot" style="background:${esc(g.color)}"></i>`).join('')}</span>`:''}
const nmG=(name,uid)=>esc(name)+gdots(uid);
window.addEventListener('hashchange',()=>{if(me&&myMode()!==MY)start();else showNav();window.scrollTo(0,0)}); // Wechsel zwischen Verwaltung und Meine Einsätze baut die Seite neu auf
/* ---------- Benutzer ---------- */
// Startpasswort ohne verwechselbare Zeichen (0/O, 1/l/I)
function genPw(){const c='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint32Array(10));return[...r].map(x=>c[x%c.length]).join('')}
async function loadUsers(){const el=$('#sU');let gs;try{[users,uroles,gs]=await Promise.all([api('users'),api('uroles'),api('groups').catch(()=>[])])}catch(e){el.innerHTML='<h2>Benutzer</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  // eine Karte pro Person wie in der Einsatzstatistik: Kopf (Name, Benutzername, Rollen), Kennzahlen, Knöpfe
  const dt=t=>t?new Date(t*1000).toLocaleString('de-CH',{day:'numeric',month:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}):'vor der Erfassung';
  const ugs=u=>(u.groups||[]).map(id=>gs.find(g=>g.id===id)).filter(Boolean);
  // Profilbild (nur Data-URLs von Bildern, sonst Platzhalter)
  const uav=u=>/^data:image\//.test(u.photo||'')?`<img class="uav" src="${esc(u.photo)}" alt="" loading="lazy">`:'<span class="uav" aria-hidden="true">👤</span>';
  const card=u=>{const self=u.id===me.id;
    return`<div class="inc usr${u.active?'':' off'}"><div class="ih uih">${uav(u)}<div class="uim"><b>${nmG(u.name,u.id)}${self?' <span class="mut">(du)</span>':''}</b><span class="mut">${esc(u.username)}</span>${absChip(u.absent)}
      <div class="fl">${u.uroles.length?u.uroles.map(id=>`<span${UR(id).sys==='admin'?' class="adm"':''}>${esc(UR(id).name)}</span>`).join(''):'<span>keine Benutzerrolle</span>'}</div>${gs.length?`<div class="ugr">${ugs(u).map(grpChip).join('')||'<span class="mut">in keiner Einsatzgruppe</span>'}</div>`:''}</div></div>
      <div class="kv"><span><small>Status</small>${u.active?'aktiv':'deaktiviert'}</span><span><small>Letzte Anmeldung</small>${u.last_login==null?'noch nie':dt(u.last_login)}</span><span><small>Passwort</small>${u.must_change?'Wechsel ausstehend':'gesetzt'}</span></div>
      <div class="ia">${can('avail')&&u.active?`<button data-ab="${u.id}">Abwesenheit</button>`:''}${!u.editable?'<span class="mut" title="Hat Rechte, die du selbst nicht hast">nur mit mehr Rechten bearbeitbar</span>':`<button data-e="${u.id}">Bearbeiten</button>${self?'':`<button data-p="${u.id}">Passwort zurücksetzen</button>${u.deletable?`<button class="sec" data-x="${u.id}" title="Hat sich noch nie angemeldet und kommt in keinen Einsatzdaten vor">Löschen</button>`:u.active?`<button class="sec" data-d="${u.id}">Deaktivieren</button>`:`<button data-a="${u.id}">Reaktivieren</button>`}`}`}</div></div>`};
  const ua=users.filter(u=>u.active),ud=users.filter(u=>!u.active),key=u=>[u.name,u.username,...u.uroles.map(id=>UR(id).name),...ugs(u).map(g=>g.name)].join(' ').toLowerCase();
  el.innerHTML=`<h2>Benutzer</h2><div class="lbar"><button class="pri" id="uA">+ Neuer Benutzer</button>${users.length>5?'<input type="search" id="uQ" placeholder="Suchen: Name, Benutzername, Rolle, Gruppe" aria-label="Benutzer suchen">':''}</div>
    <h3 class="lgh">Aktiv <span class="mut">(${ua.length})</span></h3><div class="lgl">${ua.map(card).join('')||'<div class="mut">Niemand.</div>'}</div>
    ${ud.length?`<details class="lgd"><summary>Deaktiviert <span class="mut">(${ud.length})</span></summary><div class="lgl">${ud.map(card).join('')}</div></details>`:''}<div class="mut" id="uQn" hidden>Keine Treffer.</div>
    <div class="mut">Wer sich noch nie angemeldet hat, kann gelöscht werden; alle anderen werden deaktiviert: Sie können sich nicht mehr anmelden, ihre Einsatzdaten bleiben erhalten.</div>`;
  // Startpasswort nach dem Speichern nicht in einer Meldung anzeigen (Issue #59): es steht vorher im Feld und kann dort kopiert werden
  $('#uA').onclick=()=>{const d=dlg('Neuer Benutzer',`<div class="jtwo"><label class="mut">Name<input id="uf" autocomplete="off"></label><label class="mut">Benutzername<input id="un" autocomplete="off" autocapitalize="off" spellcheck="false"></label></div>
      ${pwField('up','Startpasswort')}
      <div class="mut">Die Person muss es bei der ersten Anmeldung ändern. Gib es vor dem Anlegen weiter, danach wird es nicht mehr angezeigt.</div>
      ${roleChecks(null)}<div class="mut">Die Person erhält alle Rechte aller gewählten Rollen. Rollen mit Rechten, die du selbst nicht hast, kannst du nicht vergeben.</div>`,
      async d=>{const nm=$('#uf',d).value.trim()||$('#un',d).value.trim();await api('user/save',{username:$('#un',d).value,name:$('#uf',d).value,password:$('#up',d).value,uroles:roleVal(d)});toast(`Benutzer «${nm}» angelegt.`,'ok');loadUsers()},'Benutzer anlegen');

  saveBlob(new Blob(['﻿'+l.map(x=>x.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'applikationslog.csv')}
function renderAL(keep){const el=$('#sAL'),D=alD;
  if(keep&&$('#alL')){$('#alL').innerHTML=D.rows.map(alRow).join('')||'<div class="mut">Keine Einträge.</div>';alDay();return}
  el.innerHTML=`<h2>Applikationslog</h2><div class="mut">Technisches Protokoll des Servers und der Geräte: Ereignisse (Anmeldungen, Einsätze starten und beenden, geänderte Benutzer und Einstellungen), Warnungen (z. B. Datenquellen ohne Antwort, abgelehnte Push-Nachrichten, fehlgeschlagene Anmeldungen) und Fehler (Serverfehler, Skriptfehler im Browser). Für die Fehlersuche, nicht fürs Einsatzlog; ohne Passwörter, Schlüssel und Einsatzinhalte. Einträge werden nach ${D.days} Tagen gelöscht.</div>
    <div class="row" id="alDay"></div>
    <div class="row alf"><select id="alLv" aria-label="Stufe"><option value="">Alle Stufen</option><option value="warn">Warnungen und Fehler</option><option value="err">Nur Fehler</option><option value="info">Nur Ereignisse</option></select>
      <select id="alCa" aria-label="Bereich"><option value="">Alle Bereiche</option>${Object.entries(D.cats).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}</select>
      <input id="alQ" type="search" placeholder="Suchen (Meldung, Angaben, Route, Person)" value="${esc(alF.q||'')}">
      <label class="alau"><input type="checkbox" id="alAu"${alF.auto?' checked':''}> Automatisch aktualisieren</label><button id="alRe">Aktualisieren</button><button id="alEx" title="Angezeigte Einträge als CSV">CSV</button></div>
    <div id="alL" class="all">${D.rows.map(alRow).join('')||'<div class="mut">Keine Einträge.</div>'}</div>
    <div class="row"${D.more?'':' hidden'} id="alMoW"><button id="alMo">Ältere laden</button></div>
    <h3>Aufbewahrung</h3><div class="row alf"><label>Einträge löschen nach <input id="alDays" type="number" min="1" max="365" value="${D.days}" style="width:5.5rem"> Tagen</label><button id="alDs">Speichern</button></div>`;
  alDay();$('#alLv').value=alF.lvl||'';$('#alCa').value=alF.cat||'';
  const set=(k,v)=>{alF[k]=v;alSave();loadAppLog()};
  $('#alLv').onchange=e=>set('lvl',e.target.value);$('#alCa').onchange=e=>set('cat',e.target.value);
  let qt;$('#alQ').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>set('q',e.target.value.trim()),400)};
  $('#alAu').onchange=e=>{alF.auto=e.target.checked?1:0;alSave();alAuto()};$('#alRe').onclick=loadAppLog;$('#alEx').onclick=alCsv;
  $('#alL').onclick=e=>{const r=e.target.closest('[data-al]');if(!r||getSelection().toString())return;const id=+r.dataset.al,x=D.rows.find(y=>y.id===id);if(!x||x.ctx==null)return;
    alOpen.has(id)?alOpen.delete(id):alOpen.add(id);r.outerHTML=alRow(x)};
  $('#alMo').onclick=async()=>{const b=$('#alMo');b.disabled=true;try{const r=await api('applog',alQ({before:D.rows[D.rows.length-1].id}));D.rows=D.rows.concat(r.rows);D.more=r.more;renderAL(true);$('#alMoW').hidden=!r.more}catch(e){fail(e)}b.disabled=false};
  $('#alDs').onclick=()=>api('settings/save',{applog_days:+$('#alDays').value}).then(()=>{toast('Gespeichert','ok');loadAppLog()}).catch(fail)}
/* ---------- Einsatztypen (Issue #90) ---------- */
// Frei konfigurierbar statt der festen Unterscheidung scharf/Übung: alle Unterschiede sind Einstellungen je Typ. Funktionen, Aufzeichnung, Helikopter und Anonymisierung stehen in ihren eigenen Abschnitten (eigene Rechte).
async function loadTypes(){const el=$('#sT');let D;try{D=await api('kinds')}catch(e){el.innerHTML='<h2>Einsatztypen</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  const ts=D.kinds,gs=D.groups,act=ts.filter(t=>t.active),lv=k=>D.levels.find(l=>l.k===k)||{name:k,hint:''},yn=(v,t)=>v?`<span>${t}</span>`:'',sn=k=>(D.sounds||[]).find(s=>s.k===k)?.name;
  // Ton kritischer Alarme in der nativen App (Issue #171): Vorgabe des Typs, jede Person kann ihn in der App je Backend und Typ übersteuern
  const sndSel=v=>`<select id="tS"><option value="">Ton des Systems</option>${Object.entries(D.snd_groups||{}).map(([g,gn])=>`<optgroup label="${esc(gn)}">${(D.sounds||[]).filter(s=>s.group===g).map(s=>`<option value="${s.k}" ${s.k===v?'selected':''}>${esc(s.name)}</option>`).join('')}</optgroup>`).join('')}</select>`;
  el.innerHTML=`<h2>Einsatztypen</h2><div class="mut">Hier legst du fest, welche Arten von Einsätzen es gibt, z. B. «Einsatz», «Übung» oder «Pikettprobe». Für jeden aktiven Typ gibt es in der Einsatz-App einen eigenen Startknopf. Wer ihn starten darf, steht bei den <a href="#benutzerrollen">Benutzerrollen</a>. Funktionen, Helikopter und Fristen der Anonymisierung stellst du je Typ in den jeweiligen Abschnitten ein.</div>
    <div class="row"><button class="pri" id="tA">+ Neuer Einsatztyp</button></div>
    ${ts.map(t=>{const ai=act.indexOf(t),off=gs.filter(g=>g.active&&!t.grp_off.includes(g.id));return`<div class="inc stc${t.active?'':' off'}" style="--k:${esc(t.color)}"><div class="ih">${kindBadge({kind_name:t.name,kind_color:t.color})}${t.active?'':'<span class="mut">deaktiviert</span>'}${stRows([['Alarmstufe',`<span title="${esc(lv(t.alarm).hint)}">${esc(lv(t.alarm).name)}</span>${yn(t.mode_up&&t.alarm!=='crit','kritisch mit Übungsmodus')}${(t.alarm==='crit'||t.mode_up)&&sn(t.snd)?`<span>Ton: ${esc(sn(t.snd))}</span>`:''}`],['Meldungen',`<span title="${esc(lv(t.msg_lvl).hint)}">Nachrichten ${esc(lv(t.msg_lvl).name)}</span><span title="${esc(lv(t.end_lvl).hint)}">Einsatzende ${esc(lv(t.end_lvl).name)}</span>`],['Regeln',yn(t.persons,'Einzelpersonen aufbietbar')+yn(t.open_all,'für alle zugelassenen Gruppen sichtbar')+yn(t.plans,'vorbereitete Übungen')+yn(t.rec,'Aufzeichnen vorausgewählt')],...(gs.length?[['Aufbietbar',off.map(g=>`<span>${grpChip(g)}</span>`).join('')||'<span>keine</span>'],['Vorausgewählt',gs.filter(g=>t.grp_def.includes(g.id)).map(g=>`<span>${grpChip(g)}</span>`).join('')]]:[])])}</div>
      <div class="kv"><span><small>Einsätze</small>${t.used}</span></div>
      <div class="ia"><button data-te="${t.id}">Bearbeiten</button>${t.active?`<button data-tu="${t.id}" ${ai<1?'disabled':''} aria-label="Nach oben" title="Nach oben">↑</button><button data-td="${t.id}" ${ai>=act.length-1?'disabled':''} aria-label="Nach unten" title="Nach unten">↓</button>`:''}<button class="sec" data-tx="${t.id}">Löschen</button></div></div>`}).join('')}`;
  const lvOpts=v=>D.levels.map(l=>`<option value="${l.k}" ${l.k===(v||'normal')?'selected':''}>${esc(l.name)}</option>`).join('');
  const edit=t=>{const off=t.grp_off||[],def=t.grp_def||[],al=t.alarm||'normal',d=dlg(t.id?'Einsatztyp bearbeiten':'Neuer Einsatztyp',`<div class="jtwo" style="grid-template-columns:minmax(0,1fr) 4.5rem"><label class="mut">Name<input id="tN" maxlength="80" value="${esc(t.name||'')}" placeholder="z. B. Pikettprobe"></label><label class="mut">Farbe<input id="tC" type="color" style="box-sizing:border-box;height:2.75rem;padding:.2rem" value="${esc(t.color||freeColor(ts.map(x=>x.color)))}"></label></div>
      ${t.id?'':`<label class="mut">Einstellungen übernehmen von<select id="tF">${ts.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><div class="mut">Übernimmt Funktionen, Vorauswahl der Helikopter, Fristen der Anonymisierung und das Startrecht der Benutzerrollen. Alles lässt sich danach ändern.</div>`}
      <label class="mut">Alarmstufe<select id="tL">${D.levels.map(l=>`<option value="${l.k}" ${l.k===al?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label><div class="mut" id="tLh">${esc(lv(al).hint)}</div>
      <div class="jtwo"><label class="mut">Nachrichten<select id="tLm">${lvOpts(t.id?t.msg_lvl:ts[0]?.msg_lvl)}</select></label><label class="mut">Einsatzende<select id="tLe">${lvOpts(t.id?t.end_lvl:ts[0]?.end_lvl)}</select></label></div><div class="mut">Stufe der Meldungen zu Nachrichten und zum Einsatzende (Push und Hinweis in der App); «Keine» schaltet sie aus. Der Übungsmodus betrifft nur den Alarm.</div>
      <label class="chk"><input type="checkbox" id="tM" ${t.mode_up?'checked':''}> Personen mit eingeschaltetem Übungsmodus kritisch alarmieren</label>
      ${D.sounds?`<label class="mut">Ton bei kritischem Alarm (native App)${sndSel(t.id?t.snd:ts[0]?.snd)}</label><div class="mut">Vorgabe für alle; jede Person kann in der App im Profil je Backend und Einsatztyp einen anderen Ton wählen. Die Web-App spielt immer ihren eigenen Ton.</div>`:''}
      <label class="chk"><input type="checkbox" id="tO" ${t.open_all?'checked':''}> Nicht Aufgebotene aus den aufbietbaren Einsatzgruppen sehen den Einsatz und können teilnehmen (alle übrigen nur, wenn die Einsatzleitung das erlaubt)</label>
      <label class="chk"><input type="checkbox" id="tE" ${t.persons?'checked':''}> Einzelpersonen aufbieten erlaubt, nicht nur ganze Gruppen</label>
      <label class="chk"><input type="checkbox" id="tV" ${t.plans?'checked':''}> Vorbereitete Übungen erlaubt (Verwaltung → Übungen)</label>
      <label class="chk"><input type="checkbox" id="tR" ${(t.id?t.rec:ts[0]?.rec)?'checked':''}> «Aufzeichnen» beim Start vorausgewählt (Replay in der Verwaltung; wer startet, kann es ändern, die Einsatzleitung die Aufzeichnung auch später starten, pausieren oder beenden)</label>
      ${gs.length?`<div class="tw"><table><thead><tr><th>Einsatzgruppe</th><th>Aufbietbar</th><th>Vorausgewählt</th></tr></thead><tbody>${gs.filter(g=>g.active||def.includes(g.id)).map(g=>`<tr><td>${grpChip(g)}</td><td><input type="checkbox" data-tb="${g.id}" ${off.includes(g.id)?'':'checked'} aria-label="${esc(g.name)} aufbietbar"></td><td><input type="checkbox" data-tg="${g.id}" ${def.includes(g.id)?'checked':''} aria-label="${esc(g.name)} vorausgewählt"></td></tr>`).join('')}</tbody></table></div>`:'<div class="mut">Noch keine Einsatzgruppen.</div>'}
      ${t.id?`<label class="chk"><input type="checkbox" id="tAc" ${t.active?'checked':''}> Aktiv (Startknopf in der Einsatz-App)</label>`:''}`,
    async d=>{const chk=a=>[...d.querySelectorAll(`[data-${a}]`)];await api('kind/save',{id:t.id||0,name:$('#tN',d).value,color:$('#tC',d).value,alarm:$('#tL',d).value,msg_lvl:$('#tLm',d).value,end_lvl:$('#tLe',d).value,mode_up:$('#tM',d).checked?1:0,open_all:$('#tO',d).checked?1:0,persons:$('#tE',d).checked?1:0,plans:$('#tV',d).checked?1:0,rec:$('#tR',d).checked?1:0,...($('#tS',d)?{snd:$('#tS',d).value}:{}),grp_off:chk('tb').filter(c=>!c.checked).map(c=>+c.dataset.tb),grp_def:chk('tg').filter(c=>c.checked).map(c=>+c.dataset.tg),active:$('#tAc',d)?($('#tAc',d).checked?1:0):1,...(t.id?{}:{copy_from:+$('#tF',d).value})});toast('Gespeichert. Die Einsatz-App übernimmt es beim nächsten Laden.');loadTypes()});
    d.firstElementChild.classList.add('mid');if($('#tF',d))$('#tF',d).onchange=e=>{const f=ts.find(x=>x.id==e.target.value);$('#tR',d).checked=!!f?.rec;if($('#tS',d))$('#tS',d).value=f?.snd||'';if(f){$('#tLm',d).value=f.msg_lvl||'normal';$('#tLe',d).value=f.end_lvl||'normal'}};$('#tL',d).onchange=e=>{$('#tLh',d).textContent=lv(e.target.value).hint;e.target.blur()};
    // nicht aufbietbar kann nicht vorausgewählt sein
    d.querySelectorAll('[data-tb]').forEach(b=>{const g=d.querySelector(`[data-tg="${b.dataset.tb}"]`),sync=()=>{g.disabled=!b.checked;if(!b.checked)g.checked=false};b.onchange=sync;sync()})};
  $('#tA').onclick=()=>edit({});
  el.querySelectorAll('[data-te]').forEach(b=>b.onclick=()=>edit(ts.find(t=>t.id==b.dataset.te)));
  el.querySelectorAll('[data-tu],[data-td]').forEach(b=>b.onclick=()=>{const ids=moveIds(act,+(b.dataset.tu||b.dataset.td),b.dataset.tu?-1:1);if(ids)api('kind/order',{ids}).then(loadTypes).catch(fail)});
  el.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>{const t=ts.find(x=>x.id==b.dataset.tx);
    if(confirm(`Einsatztyp «${t.name}» löschen?\n\nBisherige Einsätze behalten Name, Farbe und Fristen der Anonymisierung. Nur zeitweise ausblenden: «Bearbeiten» → «Aktiv» ausschalten.`))api('kind/delete',{id:t.id}).then(()=>{toast('Einsatztyp gelöscht.');loadTypes()}).catch(fail)})}

async function loadModes(){const el=$('#sM');let modes;try{modes=await api('modes')}catch(e){el.innerHTML='<h2>Einrückoptionen</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  el.innerHTML=`<h2>Einrückoptionen</h2><div class="mut">Auswahl beim Annehmen eines Einsatzes. Ohne Standortfreigabe wird der Standort der Person weder geteilt noch auf der Karte angezeigt. Mit «Rechte der Einsatzleitung» darf die Person alles wie die Einsatzleitung, erhält aber keine Spezialrolle (z. B. Koordinator KP Rück).</div>
    <div class="tw"><table><tbody>${modes.map(x=>`<tr class="${x.active?'':'off'}"><td>${esc(x.name)}</td><td>${x.share_location?'Standort wird geteilt':'<b>ohne Standort</b>'}${x.lead_rights?'<br><b>Rechte der Einsatzleitung</b>, keine Spezialrolle':''}${x.counts?'':'<br>zählt nicht bei «Einsatzkräfte»'}</td><td>${x.active?'aktiv':'deaktiviert'}</td><td class="act"><button data-mo="${x.id}">Bearbeiten</button></td></tr>`).join('')}</tbody></table></div>
    <h3>Neue Einrückoption</h3><div class="row"><input id="mn" placeholder="Name, z. B. Anfahrt mit Material" aria-label="Name der Einrückoption"><label class="row" style="align-items:center;flex:0 0 auto;margin:0"><input type="checkbox" id="ms" checked> Standort teilen</label><button id="mA">Option anlegen</button></div>`;
  $('#mA').onclick=()=>api('mode/save',{name:$('#mn').value,share_location:$('#ms').checked?1:0}).then(loadModes).catch(fail);
  el.querySelectorAll('[data-mo]').forEach(b=>b.onclick=()=>{const x=modes.find(y=>y.id==b.dataset.mo);
    dlg('Einrückoption bearbeiten',`<label class="mut">Name<input id="oN" value="${esc(x.name)}"></label><label class="chk"><input type="checkbox" id="oS" ${x.share_location?'checked':''}> Standort teilen</label><label class="chk"><input type="checkbox" id="oL" ${x.lead_rights?'checked':''}> Rechte der Einsatzleitung (ohne Spezialrolle)</label><label class="chk"><input type="checkbox" id="oC" ${x.counts?'checked':''}> Zählt im Zähler am Kartenknopf «Einsatzkräfte»</label><label class="chk"><input type="checkbox" id="oA" ${x.active?'checked':''}> Aktiv (beim Annehmen wählbar)</label><div class="mut">Änderungen gelten für neue Annahmen. Wer bereits mit dieser Option im Einsatz ist, behält sie.</div>`,
      async d=>{await api('mode/save',{id:x.id,name:$('#oN',d).value,share_location:$('#oS',d).checked?1:0,lead_rights:$('#oL',d).checked?1:0,counts:$('#oC',d).checked?1:0,active:$('#oA',d).checked?1:0});loadModes()})})}

async function loadRoles(){const el=$('#sR');try{roles=await api('roles')}catch(e){el.innerHTML='<h2>Spezialrollen</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  el.innerHTML=`<h2>Spezialrollen im Einsatz</h2><div class="tw"><table><tbody>${roles.map(r=>`<tr><td><span style="color:${esc(r.color)}">●</span> ${esc(r.name)}${r.is_lead?' <span class="mut">(Einsatzleitung: darf Einsatz verwalten)</span>':''}${r.is_post?' <span class="mut">(Posten: Suchgebiet endet hier)</span>':''}${r.can_message||r.is_lead?'':' <span class="mut">(darf keine Nachrichten senden)</span>'}</td><td class="act"><button data-r="${r.id}">Bearbeiten</button></td></tr>`).join('')}</tbody></table></div>
    <h3>Nachrichten senden</h3><label class="row" style="align-items:center"><input type="checkbox" id="msgNoRole" disabled> <span>Personen ohne Spezialrolle dürfen Nachrichten senden</span></label>
    <label class="row" style="align-items:center"><input type="checkbox" id="msgReadAll" disabled> <span>Personen, die den Einsatz nicht angenommen haben, dürfen Nachrichten lesen (ohne Benachrichtigung, ohne Senden)</span></label>
    <div class="mut">Pro Spezialrolle unter «Bearbeiten» einstellbar. Einsatzleitung, Personen mit dem Recht «Jeden Einsatz leiten» und wer den Einsatz gestartet hat, dürfen immer senden. Lesen dürfen alle, die den Einsatz angenommen haben, mit der Einstellung oben auch alle übrigen.</div>
    <h3>Neue Rolle</h3><div class="row"><input id="rn" placeholder="Rollenname" aria-label="Rollenname"><input id="rc" type="color" value="#8888ff" aria-label="Farbe" style="flex:0 0 4rem"><button id="rA">Rolle anlegen</button></div>`;
  $('#rA').onclick=()=>api('role/save',{name:$('#rn').value,color:$('#rc').value}).then(loadRoles).catch(fail);
  el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=roles.find(x=>x.id==b.dataset.r);
    dlg('Rolle bearbeiten',`<label class="mut">Name<input id="rN" value="${esc(r.name)}"></label><label class="mut">Farbe<input id="rC" type="color" value="${esc(r.color)}"></label>
      <label class="chk"><input type="checkbox" id="rL" ${r.is_lead?'checked':''}> Einsatzleitung (darf Einsatz verwalten)</label><label class="chk"><input type="checkbox" id="rP" ${r.is_post?'checked':''}> Sicherungs-/Beobachtungsposten (Suchgebiet endet hier)</label><label class="chk"><input type="checkbox" id="rM" ${r.can_message?'checked':''}> Darf Nachrichten senden</label><label class="chk"><input type="checkbox" id="rD"> Rolle deaktivieren</label>`,

  // Einstellung für Personen ohne Spezialrolle, wird sofort gespeichert
  api('settings').then(s=>[['#msgNoRole','msg_no_role'],['#msgReadAll','msg_read_all']].forEach(([id,k])=>{const c=$(id);c.checked=!!s[k];c.disabled=false;
    c.onchange=()=>{c.disabled=true;api('settings/save',{[k]:c.checked?1:0}).catch(e=>{c.checked=!c.checked;fail(e)}).finally(()=>{c.disabled=false})}})).catch(fail)}
/* ---------- Vorlagen für externe Einsatzkräfte (Issue #39) ---------- */
// Die Einsatzleitung erfasst damit Externe ohne App-Konto (z. B. Posten der Feuerwehr) mit wenigen Klicks; ohne Standort wird er beim Erfassen gewählt
async function loadExt(){const el=$('#sX');let xs,rs;try{[xs,rs]=await Promise.all([api('ext_templates'),api('roles')])}catch(e){el.innerHTML='<h2>Externe Einsatzkräfte</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  const cs=me&&(me.coord_sys&&me.coord_sys!=='none'?me.coord_sys:me.coord_default)||'lv95',rn=id=>(rs.find(r=>r.id===id)||{}).name;
  el.innerHTML=`<h2>Externe Einsatzkräfte</h2><div class="mut">Vorlagen für Einsatzkräfte ohne App-Konto mit festem Standort, z. B. Sicherungs- und Beobachtungsposten anderer Organisationen. Die Einsatzleitung erfasst sie im Einsatz über den Kartenknopf «Einsatzkräfte» und wählt dort eine Vorlage. Mit einer Posten-Rolle endet das Suchgebiet am Standort.</div>
    ${xs.length?`<div class="tw"><table><thead><tr><th>Name</th><th>Kürzel / Farbe</th><th>Spezialrolle</th><th>Standort</th><th></th></tr></thead><tbody>${xs.map(x=>`<tr${x.active?'':' class="mut"'}><td>${esc(x.name)}${x.descr?`<div class="mut">${esc(x.descr)}</div>`:''}${x.active?'':' <span class="mut">(deaktiviert)</span>'}</td><td>${x.color?`<span style="display:inline-block;width:.9em;height:.9em;border-radius:3px;vertical-align:-.1em;background:${esc(x.color)}"></span> `:''}${esc(x.abbr||'')}${x.abbr||x.color?'':'–'}</td><td>${esc(rn(x.role_id)||'–')}</td><td>${x.lat!=null?esc(fmtC(x.lat,x.lon,cs)):'<span class="mut">beim Erfassen wählen</span>'}</td><td class="act"><button data-x="${x.id}">Bearbeiten</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="mut">Noch keine Vorlagen.</div>'}

/* ---------- Helikopter (Issue #73): Datenquellen (Reihenfolge, Ein/Aus, Test), Filter, Sichtbarkeit je Ansicht, Relevanzzone, Rettungshelikopter ---------- */

  home_km:['Umkreis ohne Einsatz','km','um die aktiven permanenten festen Standorte (Karte & Daten → Feste Standorte), auch ohne laufenden Einsatz für alle Angemeldeten (ausser «Wer sieht die Helikopter» steht auf «Niemand»); 0 = ohne Einsatz keine Helikopter']};
const AIR_GRP=[['Relevanzzone',['radius_km','max_alt_ft']],['Anzeige',['max_age_s','trail_min']],['Abfrage',['cache_s']],['Ohne Einsatz',['home_km']]];
const airNumX=(k,v)=>k==='max_alt_ft'&&v!==''&&!isNaN(v)?'≈ '+Math.round(v*.3048).toLocaleString('de-CH')+' m':''; // Flughöhe zusätzlich in Metern
function airNumCard(k){const[l,u,h]=airNumL[k],[d,lo,hi]=airS.air_num[k],v=airC[k],x=airNumX(k,v);
  return`<div class="anum${+v!==d?' chg':''}" data-anc="${k}"><label for="an_${k}">${esc(l)}</label><div class="h">${esc(h)}</div>
    <div class="ai"><input type="number" id="an_${k}" data-an="${k}" min="${lo}" max="${hi}" step="1" value="${esc(String(v))}" inputmode="numeric"><span>${esc(u)}</span><span data-anx="${k}">${x}</span></div>

async function loadAir(){const el=$('#sH');try{airS=await api('settings')}catch(e){el.innerHTML='<h2>Helikopter</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  airC=JSON.parse(JSON.stringify(airS.air));airK={};(airS.kinds||[]).forEach(k=>airK[k.id]=k.air);drawAir()}
function drawAir(){const el=$('#sH'),s=airS,c=airC,st=s.air_status||{},dt=t=>t?new Date(t*1000).toLocaleString('de-CH'):'–';
  const srcRow=(k,i)=>{const S=s.air_sources[k],x=st[k],on=c.src.includes(k);

      <button data-au="${i}" ${i?'':'disabled'} aria-label="Nach oben">↑</button><button data-ad="${i}" ${i<c.order.length-1?'':'disabled'} aria-label="Nach unten">↓</button><button data-at="${k}">Testen</button></div>

  const sel=(id,o,v)=>`<select id="${id}">${Object.entries(o).map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  el.innerHTML=`<h2>Helikopter</h2><div class="mut">Zeigt Helikopter (z. B. der Rega) live auf der Karte des Einsatzes, aus offenen ADS-B-Daten (Transpondersignale, gesammelt von Freiwilligen). Der Server fragt die Daten ab und teilt sie mit allen Geräten. Nur was in der Relevanzzone des Einsatzes fliegt, erscheint.</div>
    <div class="mut"><b>Grenzen:</b> Tief fliegende Helikopter in Tälern und über dem Fluss sind für die Empfänger am Boden oft nicht sichtbar und können zeitweise fehlen. Manche Betreiber (z. B. Militär) senden keine oder gesperrte Daten. Die Anzeige ersetzt keine Absprache über Funk.</div>
    <h3>Ein- und ausschalten</h3><label class="chk"><input type="checkbox" id="aOn" ${c.on?'checked':''}> <b>Helikopterdaten verwenden</b></label>

    ${(s.kinds||[]).map(k=>`<label class="chk"><input type="checkbox" data-ak="${k.id}" ${airK[k.id]?'checked':''} ${c.on?'':'disabled'}> ${esc(k.name)}</label>`).join('')}</div>
    <h3>Datenquellen</h3><div class="mut">Der Server fragt die eingeschalteten in dieser Reihenfolge ab, bis eine antwortet. Alle sind gratis und ohne Schlüssel, aber <b>nur für nicht-kommerzielle Nutzung</b> gedacht; die Bedingungen der Betreiber gelten.</div>
    ${c.order.map(srcRow).join('')}

    <label class="chk"><input type="checkbox" id="aP" ${c.public?'checked':''}> In der öffentlichen Ansicht zeigen</label>
    <label class="chk"><input type="checkbox" id="aR" ${c.replay?'checked':''}> Aufzeichnen und im Replay zeigen (nur während der Einsatz aufgezeichnet wird)</label>
    <h3>Relevanzzone und Abfrage</h3><div class="mut">Relevant ist ein Luftfahrzeug, das sich im Umkreis um eine aktive Position des Einsatzes befindet. Um den PLS zählt zusätzlich die Driftdistanz (Fliessgeschwindigkeit × Zeit seit dem PLS, höchstens 30 km), damit das ganze Suchgebiet abgedeckt ist. 15 km entsprechen bei einem Rettungshelikopter etwa 4 Minuten Anflug.</div>
    ${AIR_GRP.map(([g,ks])=>`<div class="mut" style="margin-top:.5rem"><b>${g}</b></div><div class="anums">${ks.map(airNumCard).join('')}</div>`).join('')}
    <h3>Rettungshelikopter</h3><div class="mut">Diese werden hervorgehoben (rot) und mit ihrer Bezeichnung angeschrieben. Kennung: Anfang des Rufzeichens (Rega: RGA), Anfang des Kennzeichens (z. B. HB-Z) oder Transponder-Adresse (6 Zeichen, z. B. 4b330c).</div>

  el.oninput=e=>{const t=e.target;if(t.dataset.an){const k=t.dataset.an,d=s.air_num[k][0],card=t.closest('.anum');c[k]=t.value;card.classList.toggle('chg',+t.value!==d);
    card.querySelector('[data-anx]').textContent=airNumX(k,t.value);const sm=card.querySelector('small');sm.innerHTML=sm.innerHTML.split(' · <b>')[0]+(+t.value!==d?' · <b>geändert</b>':'')}else if(t.dataset.rk)c.rescue[+t.dataset.rk].k=t.value;else if(t.dataset.rn)c.rescue[+t.dataset.rn].n=t.value};
  el.onchange=e=>{const t=e.target;if(t.dataset.as){c.src=c.order.filter(k=>k===t.dataset.as?t.checked:c.src.includes(k))}else if(t.id==='aF')c.filter=t.value;else if(t.id==='aA')c.app=t.value;else if(t.id==='aP')c.public=t.checked?1:0;else if(t.id==='aOn'){c.on=t.checked?1:0;drawAir()}else if(t.dataset.ak)airK[t.dataset.ak]=t.checked?1:0;else if(t.id==='aR')c.replay=t.checked?1:0};
  el.onclick=async e=>{const b=e.target.closest('button');if(!b)return;const mv=(i,d)=>{const o=c.order;[o[i],o[i+d]]=[o[i+d],o[i]];c.src=o.filter(k=>c.src.includes(k));drawAir()};

    else if(b.id==='aDf'){if(confirm('Standardeinstellungen für Helikopter wiederherstellen (noch nicht gespeichert)?')){airC=JSON.parse(JSON.stringify(s.air_default));drawAir()}}
    else if(b.id==='aSv'){if(!c.src.length&&!confirm('Keine Datenquelle eingeschaltet: Es werden keine Helikopter angezeigt. Trotzdem speichern?'))return;
      c.rescue=c.rescue.filter(x=>x.k.trim()||x.n.trim());b.disabled=true;
      api('settings/save',{air:{...c,rescue:c.rescue},air_kinds:airK}).then(()=>{toast('Gespeichert. Gilt ab der nächsten Abfrage.');loadAir()}).catch(x=>{fail(x);b.disabled=false})}}}
/* ---------- Gewässerdaten: Haltedauer des Overpass-Caches und Overpass-Server (Reihenfolge) ---------- */
let opUrls=[],opDef=[],opOff=[];
async function loadOp(){const el=$('#sO');let s,os;try{[s,os]=await Promise.all([api('settings'),api('overpass/stats')])}catch(e){el.innerHTML='<h2>Gewässerdaten</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  opUrls=[...s.overpass_urls];opDef=s.overpass_default;opOff=[...(s.overpass_off||[])];
  wOrd=[...(s.water_order||[])];
  el.innerHTML=`<h2>Gewässerdaten</h2><div class="mut">Das Gewässernetz für Suchgebiet und Flussdistanz (OpenStreetMap) holt der Server und speichert es zwischen. Er fragt die eingerichteten Quellen in der Reihenfolge unten ab, bis eine antwortet: die eigene PostGIS-Datenbank direkt, die PostGIS-API oder die Overpass-Server. Gleiche Abfragen, z. B. das Suchgebiet auf allen Geräten eines Einsatzes, gehen so nur einmal hinaus. Antwortet keine Quelle, verwendet der Server ältere Daten (bis 7 Tage).</div>
    ${s.water_order?'<h3>Reihenfolge der Quellen</h3><div id="wOrd"></div>':''}
    ${pgHtml(s)}${pgaHtml(s)}
    <h3>Overpass</h3>
    <label class="chk"><input type="checkbox" id="opOn" ${s.overpass_on?'checked':''}> Zugriff auf Overpass</label>
    <div class="mut">Ausgeschaltet fragen weder der Server noch die Geräte Overpass ab. Suchgebiet und Flussdistanz erhalten dann nur noch Daten aus dem Zwischenspeicher (auch ältere); ohne solche erscheint das Suchgebiet als Kreis um den PLS, und die Flussdistanz ist nicht verfügbar. Gilt sofort.</div>
    <div class="row" style="align-items:end"><label class="mut">Haltedauer in Minuten (0 = nicht zwischenspeichern)<input id="opT" type="number" min="0" max="10080" step="1" value="${s.overpass_ttl}"></label><button id="opSv">Speichern</button></div>
    <h3>Overpass-Server</h3><div class="mut">Der Server fragt die eingeschalteten in dieser Reihenfolge ab (je 15 s), bis einer antwortet. Antwortet keiner, fragt das Gerät dieselben Server direkt (je 30 s). Ausgeschaltete Server bleiben in der Liste, werden aber nicht abgefragt.</div>
    <div id="opList"></div>
    <div class="row"><input id="opN" placeholder="https://…/api/interpreter" aria-label="Adresse eines Overpass-Servers" inputmode="url"><button id="opA">Hinzufügen</button></div>
    <div class="row"><button id="opUs" class="pri">Server speichern</button><button id="opUd">Standard wiederherstellen</button></div>
    <h3>Verwendung und Verfügbarkeit</h3>${opStats(os,s.overpass_urls)}`;
  $('#opOn').onchange=e=>{const c=e.target;c.disabled=true;api('settings/save',{overpass_on:c.checked?1:0}).catch(x=>{c.checked=!c.checked;fail(x)}).finally(()=>{c.disabled=false})};
  if(s.postgis)pgBind();
  if(s.pgapi)pgaBind();
  if(s.water_order)drawWOrd(s);
  $('#opSr').onclick=()=>{if(confirm('Statistik der Overpass-Server zurücksetzen?'))api('overpass/stats/reset',{}).then(loadOp).catch(fail)};
  $('#opSv').onclick=()=>api('settings/save',{overpass_ttl:$('#opT').value}).then(()=>{toast('Gespeichert.');loadOp()}).catch(fail);
  $('#opA').onclick=()=>{const u=$('#opN').value.trim();if(!/^https:\/\/[^/?#@]+\//i.test(u))return toast('Bitte eine vollständige https-Adresse angeben, z. B. https://overpass-api.de/api/interpreter','err');
    if(!opUrls.includes(u))opUrls.push(u);$('#opN').value='';drawOpList()};
  $('#opN').onkeydown=e=>{if(e.key==='Enter')$('#opA').click()};
  $('#opUs').onclick=()=>{if(!opUrls.length)return toast('Mindestens ein Server ist nötig. «Standard wiederherstellen» setzt die vorgegebene Liste.','err');
    if(opUrls.every(u=>opOff.includes(u))&&!confirm('Alle Server sind ausgeschaltet. Overpass wird dann nicht mehr abgefragt. Trotzdem speichern?'))return;
    api('settings/save',{overpass_urls:opUrls,overpass_off:opOff.filter(u=>opUrls.includes(u))}).then(()=>{toast('Gespeichert. Gilt ab der nächsten Abfrage.');loadOp()}).catch(fail)};
  $('#opUd').onclick=()=>{if(confirm('Vorgegebene Liste wiederherstellen?\n\n'+opDef.join('\n')))api('settings/save',{overpass_urls:[],overpass_off:[]}).then(()=>{toast('Gespeichert.');loadOp()}).catch(fail)};
  drawOpList()}
// Reihenfolge der Quellen fürs Gewässernetz (water_order): ↑/↓, sofort gespeichert; nicht eingerichtete überspringt der Server
let wOrd=[];
function drawWOrd(s){const el=$('#wOrd'),rd=s.water_ready||{},n=wOrd.length,act=wOrd.filter(k=>rd[k]);
  el.innerHTML=`<div class="mut">Der Server fragt die Quellen in dieser Reihenfolge ab und nimmt die erste Antwort. Nicht eingerichtete oder ausgeschaltete Quellen überspringt er. Antwortet keine, fragt das Gerät die Overpass-Server direkt (sofern Overpass eingeschaltet ist).</div>
    <div class="tw"><table><tbody>${wOrd.map((k,i)=>`<tr><td style="width:2rem">${i+1}.</td><td${rd[k]?'':' style="opacity:.55"'}>${esc(s.water_src[k]||k)} ${rd[k]?'<b>✓ aktiv</b>':'<span class="mut">(nicht eingerichtet oder ausgeschaltet)</span>'}</td><td class="act"><button data-wo="${i}" data-d="-1" ${i?'':'disabled'} aria-label="Nach oben" title="Früher abfragen">↑</button><button data-wo="${i}" data-d="1" ${i<n-1?'':'disabled'} aria-label="Nach unten" title="Später abfragen">↓</button></td></tr>`).join('')}</tbody></table></div>
    ${act.length?'':'<div class="mut">⚠ Keine Quelle aktiv: Suchgebiet und Flussdistanz erhalten nur noch Daten aus dem Zwischenspeicher.</div>'}`;
  el.querySelectorAll('[data-wo]').forEach(b=>b.onclick=()=>{const i=+b.dataset.wo,j=i+ +b.dataset.d,o=[...wOrd];[o[i],o[j]]=[o[j],o[i]];
    el.querySelectorAll('button').forEach(x=>x.disabled=true);api('settings/save',{water_order:o}).then(()=>{wOrd=o;toast('Reihenfolge gespeichert. Gilt ab der nächsten Abfrage.','ok');drawWOrd(s)}).catch(x=>{fail(x);drawWOrd(s)})})}
// PostGIS-API (github.com/ELSSwift/PostGISApi): Adresse, Layer, API-Key (nie angezeigt, leer = behalten), Test mit Beispielabfrage um Bern
function pgaHtml(s){const p=s.pgapi;if(!p)return'';
  return`<h3>PostGIS-API</h3><div class="mut">REST-Dienst <a href="https://github.com/ELSSwift/PostGISApi" target="_blank" rel="noopener">PostGISApi</a> vor einer PostGIS-Datenbank, z. B. als Docker-Container auf einem eigenen Server. Für Hostings ohne PostgreSQL-Treiber. Der Layer muss die Eigenschaften <code>waterway</code> und <code>name</code> freigeben (Tabelle wie bei PostGIS) und als ID den OSM-Weg haben. Der API-Key braucht die Rolle <code>read</code>; bei einem öffentlichen Layer geht es ohne.</div>
    ${p.curl?'':'<div class="mut">⚠ Auf diesem Webserver fehlt die PHP-Erweiterung <b>curl</b>. Ohne sie bleibt die PostGIS-API unbenutzt.</div>'}
    <label class="chk"><input type="checkbox" id="paOn" ${p.on?'checked':''}> PostGIS-API verwenden${p.on?(p.ready?' <b>✓ aktiv</b>':' <span class="mut">(nicht aktiv)</span>'):''}</label>
    <div class="pgf"><label class="mut">Adresse<input id="paU" value="${esc(p.url)}" placeholder="z. B. https://gis.example.ch" autocomplete="off" inputmode="url"></label><label class="mut">Layer<input id="paL" value="${esc(p.layer)}" placeholder="${esc(s.pgapi_default.layer)}" autocomplete="off"></label>
    <label class="mut">API-Key (Header X-API-Key)<input id="paK" type="password" autocomplete="new-password" placeholder="${p.key_set?'gespeichert, leer lassen zum Behalten':'kein Key gespeichert'}"></label></div>
    <div class="row"><button id="paSv" class="pri">PostGIS-API speichern</button><button id="paTs">Verbindung testen</button>${p.key_set?'<button id="paKx">API-Key entfernen</button>':''}</div><div class="mut" id="paR"></div>`}
function pgaBind(){const v=()=>({on:$('#paOn').checked?1:0,url:$('#paU').value.trim(),layer:$('#paL').value.trim(),key:$('#paK').value});
  $('#paSv').onclick=()=>api('settings/save',{pgapi:v()}).then(()=>{toast('Gespeichert. Gilt ab der nächsten Abfrage.','ok');loadOp()}).catch(fail);
  $('#paTs').onclick=async e=>{const b=e.target,o=$('#paR');b.disabled=true;o.textContent='Wird getestet …';
    try{const r=await api('pgapi/test',{cfg:v()});o.innerHTML=r.ok?`✓ Erreichbar in ${r.health_ms} ms${r.version?' (Version '+esc(r.version)+')':''}, Layer ${esc(r.geom)} mit SRID ${r.srid}${r.max?', höchstens '+r.max.toLocaleString('de-CH')+' je Antwort':''}. Beispiel 5 km um Bern: ${r.ways} Wege in ${r.query_ms} ms${r.names.length?' ('+esc(r.names.join(', '))+')':''}.${r.warn?' ⚠ '+esc(r.warn)+'.':''} Noch nicht gespeichert, falls geändert.`:'✗ '+esc(r.err||'Fehler')}
    catch(x){o.textContent='✗ '+x.message}b.disabled=false};
  if($('#paKx'))$('#paKx').onclick=()=>{if(confirm('Gespeicherten API-Key der PostGIS-API entfernen?'))api('settings/save',{pgapi:{...v(),key:'',key_clear:1}}).then(loadOp).catch(fail)}}
// PostGIS als Hauptquelle (Issue #131): Verbindung (Passwort nie angezeigt, leer = behalten), Test mit Beispielabfrage um Bern
function pgHtml(s){const p=s.postgis;if(!p)return'';
  return`<h3>PostGIS-Datenbank (direkt)</h3><div class="mut">Eigene PostgreSQL-Datenbank mit PostGIS und dem Gewässernetz aus OpenStreetMap (Auszug der Schweiz von Geofabrik; Einrichtung und wöchentliche Aktualisierung mit den Skripten in <code>scripts/postgis/</code>). Der Webserver verbindet sich direkt mit ihr. Wann sie gefragt wird, bestimmt die Reihenfolge oben.</div>
    ${p.ext?'':'<div class="mut">⚠ Auf diesem Webserver fehlt die PHP-Erweiterung <b>pdo_pgsql</b>. Ohne sie bleibt PostGIS unbenutzt, es gilt Overpass.</div>'}
    <label class="chk"><input type="checkbox" id="pgOn" ${p.on?'checked':''}> PostGIS-Datenbank verwenden${p.on?(p.ready?' <b>✓ aktiv</b>':' <span class="mut">(nicht aktiv)</span>'):''}</label>
    <div class="pgf"><label class="mut">Host<input id="pgH" value="${esc(p.host)}" placeholder="z. B. db.example.ch" autocomplete="off" inputmode="url"></label><label class="mut">Port<input id="pgP" type="number" min="1" max="65535" value="${p.port}"></label>
    <label class="mut">Datenbank<input id="pgD" value="${esc(p.db)}" autocomplete="off"></label><label class="mut">Benutzer (nur Leserechte)<input id="pgU" value="${esc(p.user)}" autocomplete="off"></label>
    <label class="mut">Passwort<input id="pgW" type="password" autocomplete="new-password" placeholder="${p.pass_set?'gespeichert, leer lassen zum Behalten':'kein Passwort gespeichert'}"></label><label class="mut">Tabelle<input id="pgT" value="${esc(p.table)}" placeholder="${esc(s.postgis_default.table)}"></label>
    <label class="mut">Verschlüsselung<select id="pgS">${Object.entries(s.postgis_ssl).map(([k,l])=>`<option value="${k}" ${k===p.ssl?'selected':''}>${esc(l)}</option>`).join('')}</select></label></div>
    <div class="row"><button id="pgSv" class="pri">PostGIS speichern</button><button id="pgTs">Verbindung testen</button>${p.pass_set?'<button id="pgWx">Passwort entfernen</button>':''}</div><div class="mut" id="pgR"></div>`}
function pgBind(){const v=()=>({on:$('#pgOn').checked?1:0,host:$('#pgH').value.trim(),port:+$('#pgP').value||5432,db:$('#pgD').value.trim(),user:$('#pgU').value.trim(),table:$('#pgT').value.trim(),ssl:$('#pgS').value,pass:$('#pgW').value});
  $('#pgSv').onclick=()=>api('settings/save',{postgis:v()}).then(()=>{toast('Gespeichert. Gilt ab der nächsten Abfrage.');loadOp()}).catch(fail);
  $('#pgTs').onclick=async e=>{const b=e.target,o=$('#pgR');b.disabled=true;o.textContent='Wird getestet …';
    try{const r=await api('postgis/test',{cfg:v()});o.innerHTML=r.ok?`✓ Verbunden in ${r.connect_ms} ms (PostGIS ${esc(r.postgis)}), Tabelle mit rund ${r.rows.toLocaleString('de-CH')} Gewässern. Beispiel 5 km um Bern: ${r.ways} Wege in ${r.query_ms} ms${r.names.length?' ('+esc(r.names.join(', '))+')':''}. Noch nicht gespeichert, falls geändert.`:'✗ '+esc(r.err||'Fehler')}
    catch(x){o.textContent='✗ '+x.message}b.disabled=false};
  if($('#pgWx'))$('#pgWx').onclick=()=>{if(confirm('Gespeichertes Passwort für PostGIS entfernen?'))api('settings/save',{postgis:{...v(),pass:'',pass_clear:1}}).then(loadOp).catch(fail)}}
// Statistik je Server (Issue #45): Versuche vom Server (Hosting) und direkt vom Gerät (Rückfall), Abfragen aus dem Zwischenspeicher zählen nicht; PostGIS (Issue #131) als eigene Zeile «postgis»
function opStats(os,urls){const SRC={server:'Server',device:'Gerät'},dt=t=>t?esc(new Date(t*1000).toLocaleString('de-CH')):'–',SP={postgis:'<b>PostGIS</b> (eigene Datenbank)',pgapi:'<b>PostGIS-API</b>'},
    us=[...Object.keys(SP).filter(k=>os.rows.some(r=>r.url===k)),...urls,...[...new Set(os.rows.map(r=>r.url))].filter(u=>!SP[u]&&!urls.includes(u))];
  const rows=us.flatMap(u=>{const rs=os.rows.filter(r=>r.url===u);return(rs.length?rs:[{url:u,src:'',uses:0,ok:0,fails:0}]).map((r,k)=>`<tr>${k?'':`<td rowspan="${rs.length||1}" style="overflow-wrap:anywhere">${SP[u]||esc(u)+(urls.includes(u)?'':' <span class="mut">(nicht mehr hinterlegt)</span>')}</td>`}
    <td>${SRC[r.src]||'–'}</td><td>${r.uses}</td><td>${r.ok}</td><td>${r.fails}</td><td>${r.uses?Math.round(r.ok/r.uses*100)+' %':'–'}</td><td>${r.ok?(r.ok_ms/r.ok/1000).toFixed(1)+' s':'–'}</td>
    <td>${dt(r.last_ok)}</td><td>${dt(r.last_fail)}${r.last_err?`<br><span class="mut">${esc(r.last_err)}</span>`:''}</td></tr>`)}).join('');
  return `<div class="mut">Jeder Versuch zählt: «Server» = Abfrage vom Hosting, «Gerät» = direkte Abfrage eines Geräts, wenn der Server keine Antwort erhielt. Der nächste Server wird nur gefragt, wenn der vorherige nicht antwortet. Abfragen aus dem Zwischenspeicher zählen nicht.${os.since?' Erfasst seit '+dt(os.since)+'.':''}</div>
    <div class="tw"><table><thead><tr><th>Server</th><th>Quelle</th><th>Versuche</th><th>Erfolgreich</th><th>Fehlgeschlagen</th><th>Quote</th><th>Ø Antwortzeit</th><th>Zuletzt erfolgreich</th><th>Zuletzt fehlgeschlagen</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="row"><button id="opSr">Statistik zurücksetzen</button></div>`}
function drawOpList(){const n=opUrls.length,el=$('#opList');
  el.innerHTML=`<div class="tw"><table><tbody>${opUrls.map((u,k)=>`<tr><td style="width:2rem">${k+1}.</td><td style="width:2rem"><input type="checkbox" data-opk="${k}" ${opOff.includes(u)?'':'checked'} aria-label="Server abfragen" title="Eingeschaltet: wird abgefragt"></td><td style="overflow-wrap:anywhere${opOff.includes(u)?';opacity:.55':''}">${esc(u)}${opOff.includes(u)?' <span class="mut">(ausgeschaltet)</span>':''}</td><td class="act"><button data-op="up" data-k="${k}" ${k?'':'disabled'} aria-label="Nach oben" title="Früher abfragen">↑</button><button data-op="dn" data-k="${k}" ${k<n-1?'':'disabled'} aria-label="Nach unten" title="Später abfragen">↓</button><button data-op="rm" data-k="${k}" ${n>1?'':'disabled'} aria-label="Entfernen" title="Entfernen">✕</button></td></tr>`).join('')}</tbody></table></div>${JSON.stringify(opUrls)!==JSON.stringify(opDef)||opOff.length?'':'<div class="mut">Vorgegebene Liste.</div>'}<div class="mut">Änderungen gelten erst nach «Server speichern».</div>`;
  el.querySelectorAll('[data-opk]').forEach(c=>c.onchange=()=>{const u=opUrls[+c.dataset.opk];opOff=opOff.filter(x=>x!==u);if(!c.checked)opOff.push(u);drawOpList()});
  el.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,o=b.dataset.op;
    if(o==='rm')opUrls.splice(k,1);else{const j=o==='up'?k-1:k+1;[opUrls[k],opUrls[j]]=[opUrls[j],opUrls[k]]}drawOpList()})}
/* ---------- Pegel & Abfluss (Issue #125): Stationen im Einsatz (Umkreis, Anzahl, Seen) und Stand des Datenabrufs beim BAFU ---------- */
async function loadHydro(){const el=$('#sHy');let s,h;try{[s,h]=await Promise.all([api('settings'),api('hydro/status',{})])}catch(e){el.innerHTML='<h2>Pegel &amp; Abfluss</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  const c=s.hydro,N=s.hydro_num,dt=t=>t?esc(new Date(t*1000).toLocaleString('de-CH')):'–',on=Object.values(s.feat_on||{}).some(f=>f.hydro);
  const st=x=>`${x.stations} Messstationen (${x.rivers} an Fliessgewässern), aktuelle Werte für ${x.values}${x.at?`, Stand ${dt(x.at)}`:''}${x.fail_at?` · ⚠ letzter Fehlschlag ${dt(x.fail_at)}`:''}. Die Werte werden 5 Minuten zwischengespeichert (das BAFU misst alle 10 Minuten).`;
  // Datenquellen (Feedback zu #125): Schnittstelle mit Vorrang, Webseite ergänzt und springt ein; je ein-/ausschaltbar mit Lizenz, Hinweis, Stand und «Testen»
  const SS=s.hydro_sources,ks=Object.keys(SS),srcSt=k=>{const x=(h.status||{})[k];return x?`Letzte Abfrage ${dt(x.at)}: ${x.ok?`✓ ${x.ms} ms, ${x.stations} Stationen, Werte für ${x.values}`:`✗ ${esc(x.err||'Fehler')}`}${!x.ok&&x.ok_at?` · letzter Erfolg ${dt(x.ok_at)}`:''}`:'Noch nicht abgefragt'};
  const srcRow=(k,i)=>{const S=SS[k];return`<div class="inc" style="display:block;padding:.5rem .7rem"><div class="row" style="align-items:center;margin:0"><label class="chk" style="flex:1"><input type="checkbox" data-hs="${k}" ${c.src[k]?'checked':''}> <b>${i+1}. ${esc(S.name)}</b> <a href="${esc(S.site)}" target="_blank" rel="noopener" class="mut">${esc(S.site.replace(/^https:\/\//,''))}</a></label><button data-ht="${k}">Testen</button></div>
      <div class="mut">Lizenz: ${esc(S.lic)}</div><div class="mut">⚠ ${esc(S.note)}</div><div class="mut">${srcSt(k)}</div><div class="mut" id="ht_${k}"></div></div>`};
  el.innerHTML=`<h2>Pegel &amp; Abfluss</h2><div class="mut">Abfluss, Pegel und Wassertemperatur der Messstationen des BAFU (offene Daten, Werte ungeprüft; Quellen unten), mit Gefahrenstufe gemäss den Schwellen des BAFU, soweit die Webseite eingeschaltet ist. Im Einsatz hält die App zu Beginn, sobald ein PLS bekannt ist, und am Einsatzende die Werte der nächsten Stationen um jeden PLS fest: im Einsatzlog und im Menü der Einsatz-App. Jede Person kann im Profil eigene Messstationen wählen, die sie im Menü und auf der Karte sieht.</div>
    ${on?'':'<div class="mut">⚠ Die Funktion «Pegel & Abfluss (BAFU)» ist bei keinem Einsatztyp eingeschaltet (Funktionen → Funktionen).</div>'}
    <h3>Datenquellen</h3><div class="mut">Zuerst fragt der Server die Schnittstelle, die Werte daraus gehen vor. Die Webseite ergänzt, was der Schnittstelle fehlt (Gefahrenstufe, Einordnung, weitere Stationen), und springt ganz ein, wenn sie nicht antwortet. Sind beide aus, gibt es keine Messwerte.</div>${ks.map(srcRow).join('')}
    <h3>Stationen im Einsatz</h3><div class="pgf"><label class="mut">Umkreis um jeden PLS in km (${N.radius_km[1]}–${N.radius_km[2]}, Standard ${N.radius_km[0]})<input id="hyR" type="number" min="${N.radius_km[1]}" max="${N.radius_km[2]}" step="1" value="${c.radius_km}"></label>
      <label class="mut">Stationen je PLS (${N.n[1]}–${N.n[2]}, Standard ${N.n[0]})<input id="hyN" type="number" min="${N.n[1]}" max="${N.n[2]}" step="1" value="${c.n}"></label></div>
    <label class="chk"><input type="checkbox" id="hyL" ${c.lakes?'checked':''}> Auch Messstationen an Seen (meist nur Pegel)</label>
    <div class="row"><button id="hySv" class="pri">Speichern</button></div>
    <h3>Datenabruf</h3><div class="mut" id="hySt">${st(h)}</div><div class="row"><button id="hyRf">Jetzt abrufen</button></div>`;
  $('#hySv').onclick=()=>api('settings/save',{hydro:{radius_km:$('#hyR').value,n:$('#hyN').value,lakes:$('#hyL').checked?1:0,src:Object.fromEntries(ks.map(k=>[k,el.querySelector(`[data-hs="${k}"]`).checked?1:0]))}}).then(()=>{toast(ks.some(k=>el.querySelector(`[data-hs="${k}"]`).checked)?'Gespeichert. Gilt für die nächsten Erfassungen.':'Gespeichert. Ohne Datenquelle gibt es keine Messwerte.',ks.some(k=>el.querySelector(`[data-hs="${k}"]`).checked)?'ok':'info');loadHydro()}).catch(fail);

  aarSave(blob,aarName(x,fmt))}
/* Vor dem Anonymisieren gesichertes Review (Recht aar_arch): Der Server hält den Inhalt fest, dieser Browser erzeugt daraus einmalig das PDF und lädt es in Stücken hoch. Danach unveränderlich. */
const AAR_CHUNK=1200000; // durch 3 teilbar: jedes Stück ist für sich gültiges Base64
const aarHex=async buf=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',buf))].map(b=>b.toString(16).padStart(2,'0')).join('');
const aarB64=u=>{let s='';for(let i=0;i<u.length;i+=32766)s+=String.fromCharCode.apply(null,u.subarray(i,i+32766));return btoa(s)};
// Immer vollständig: alle Abschnitte und das Einsatzlog, auch wenn sie in der Einrichtung ausgeschaltet sind; sonst mit der Einrichtung vom Zeitpunkt der Sicherung
async function aarArchBuild(id){const r=await api('aar/arch/snap&id='+id),x=r.doc;
  for(const m of x.imgs||[])m.src=(await api(`aar/arch/img&id=${id}&img=${m.id}`)).src;
  const keep=aarC;let B,lg;aarC={cfg:{...x.cfg,auto:{...x.cfg.auto,inc:1,people:1,res:1,ext:1,log:1}},logo:x.logo};try{B=aarModel(x,{log:true,arch:r.created});lg=aarLogo()}finally{aarC=keep}
  const buf=await(await aarPdf(B,await lg,x.cfg.title)).arrayBuffer(),u=new Uint8Array(buf),parts=Math.max(1,Math.ceil(u.length/AAR_CHUNK));
  for(let n=0;n<parts;n++)await api('aar/arch/put',{id,n,data:aarB64(u.subarray(n*AAR_CHUNK,(n+1)*AAR_CHUNK))});
  await api('aar/arch/done',{id,parts,sha:await aarHex(buf),name:aarName(x,'pdf')})}
// Noch fehlende PDFs erzeugen; schlägt es fehl, bleibt der festgehaltene Inhalt und es läuft beim nächsten Öffnen erneut
let aarArchRun=null;
function aarArchSync(){if(!can('aar_arch'))return Promise.resolve();return aarArchRun=aarArchRun||(async()=>{try{const{ids}=await api('aar/arch/pending');
    for(const id of ids)try{await aarArchBuild(id)}catch(e){console.warn('AAR sichern',id,e)}
    }catch(e){console.warn(e)}finally{aarArchRun=null}})()}
async function aarArchGet(id){try{await aarArchSync();const f=await api(`aar/arch/part&id=${id}&n=0`);if(f.pending)throw new Error('Das PDF konnte noch nicht erzeugt werden. Bitte später nochmals versuchen.');
    const P=[f];for(let n=1;n<f.parts;n++)P.push(await api(`aar/arch/part&id=${id}&n=${n}`));
    const blob=new Blob(P.map(p=>Uint8Array.from(atob(p.data),c=>c.charCodeAt(0))),{type:'application/pdf'});
    if(await aarHex(await blob.arrayBuffer())!==f.sha)throw new Error('Das PDF ist beschädigt (Prüfsumme stimmt nicht).');
    aarSave(blob,f.name)}catch(e){fail(e)}}

// PDF: A4, Helvetica (Zeichen ausserhalb von Windows-1252 werden zu «?»), Tabellen mit AutoTable, Fusszeile mit Seitenzahl
async function aarPdf(B,logo,title){await loadJs(AAR_LIB.pdf);await loadJs(AAR_LIB.at);
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),M=18,W=210-2*M,PH=297,T=s=>String(s??'').replace(/[^\n\x20-\x7e\xa0-\xff–—‘’‚“”„•…€]/g,'?');

  if(logo){const h=Math.min(22,logo.h*50/logo.w),w=h*logo.w/logo.h;doc.addImage(logo.src,logo.fmt,210-M-w,M,w,h);tw=W-w-6;lb=M+h+2}
  const brk=h=>{if(y+h>PH-M-6){doc.addPage();y=M;tw=W}};
  const txt=(s,size,style,col,lh,gap)=>{doc.setFont('helvetica',style);doc.setFontSize(size);doc.setTextColor(...col);for(const l of doc.splitTextToSize(T(s),tw)){brk(lh);doc.text(l,M,y+lh*.75);y+=lh}y+=gap};
  for(const b of B){
    if(b.t==='title')txt(b.x,20,'bold',[31,78,121],8.5,1);
    else if(b.t==='sub'){txt(b.x,11,'normal',[89,89,89],5,2);y=Math.max(y,lb);tw=W}
    else if(b.t==='status')txt(b.x,10.5,'bold',AAR_STC[b.k].match(/../g).map(c=>parseInt(c,16)),5,2);
    else if(b.t==='h'){y+=3;brk(16);txt(b.x,13,'bold',[31,78,121],6,0);doc.setDrawColor(31,78,121);doc.setLineWidth(.3);doc.line(M,y,M+W,y);y+=3}
    else if(b.t==='q'){y+=1;brk(14);txt(b.x,10.5,'bold',[0,0,0],5,.5)}
    else if(b.t==='p')txt(b.x,10.5,'normal',[0,0,0],4.8,2);
    else if(b.t==='img'){const w=Math.min(W,110*b.w/b.h,b.w*.2646),h=w*b.h/b.w;brk(h+(b.cap?6:2));doc.addImage(b.src,b.fmt,M+(W-w)/2,y,w,h);y+=h+1.5;
      if(b.cap){doc.setFont('helvetica','italic');doc.setFontSize(8.5);doc.setTextColor(90,90,90);for(const l of doc.splitTextToSize(T(b.cap),W)){brk(4);doc.text(l,105,y+3,{align:'center'});y+=4}}y+=2.5}
    else if(b.t==='note'){y+=4;txt(b.x,8.5,'italic',[110,110,110],4,0)}
    else{const kv=b.t==='kv';doc.autoTable({startY:y,margin:{left:M,right:M,top:M,bottom:M+6},theme:'grid',head:kv?undefined:[b.head.map(T)],body:b.rows.map(r=>r.map(T)),
      styles:{font:'helvetica',fontSize:9,cellPadding:1.5,lineColor:[191,191,191],lineWidth:.2,textColor:[0,0,0],overflow:'linebreak',valign:'top'},
      headStyles:{fillColor:[217,226,243],textColor:[0,0,0],fontStyle:'bold'},
      columnStyles:kv?{0:{cellWidth:W*.32,fontStyle:'bold',fillColor:[242,242,242]}}:Object.fromEntries(b.w.map((w,n)=>[n,{cellWidth:W*w/5000}]))});
      y=doc.lastAutoTable.finalY+4;tw=W}}
  const n=doc.getNumberOfPages();
  for(let k=1;k<=n;k++){doc.setPage(k);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(127,127,127);doc.text(T(`${title} · Seite ${k} von ${n}`),105,PH-10,{align:'center'})}
  return doc.output('blob')}
