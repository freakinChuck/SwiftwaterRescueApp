// Personenauswahl (Übungsleitung, Aufgebotene, Mitglieder von Einsatzgruppen): Suchfeld mit Trefferliste statt Häkchen pro Person, damit es auch mit vielen Benutzern übersichtlich bleibt
// us = Benutzerliste, x = Präfix der Element-IDs (#<x>s Auswahl, #<x>q Suchfeld, #<x>r Treffer), sel = Auswahl, skip = zusätzlich nicht wählbar; liefert die aktuelle Auswahl
function pickPpl(us,d,x,sel,skip,empty){const un=id=>(us.find(u=>u.id===id)||{}).name||'?',k=x.toLowerCase(),act=us.filter(u=>u.active),q=$('#'+x+'q',d);sel=sel.filter(id=>act.some(u=>u.id===id));

    const draw=()=>{$('#'+x+'s',d).innerHTML=sel.map(id=>`<span class="lchip">${nmG(un(id),id)}<button data-${k}x="${id}" aria-label="${esc(un(id))} entfernen" title="Entfernen">✕</button></span>`).join('')||`<span class="mut">${empty}</span>`;
      // Leere Suche zeigt alle wählbaren Personen (scrollbare Liste), Eingabe filtert (Issue #90)
      const s=q.value.trim().toLowerCase(),m=act.filter(u=>!sel.includes(u.id)&&!skip().includes(u.id)&&(!s||(u.name+' '+u.username).toLowerCase().includes(s))).sort((a,b)=>a.name.localeCompare(b.name,'de'));
      $('#'+x+'r',d).innerHTML=m.map(u=>`<button data-${k}a="${u.id}">${nmG(u.name,u.id)} <span class="mut">${esc(u.username)}</span></button>`).join('')+(!m.length?`<div class="mut">${s?'Keine passende Person':'Alle Personen ausgewählt'}</div>`:'')};
    q.oninput=draw;q.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const b=$(`#${x}r [data-${k}a]`,d);b&&b.click()}}; // Enter übernimmt den ersten Treffer
    d.addEventListener('click',e=>{const a=e.target.closest(`[data-${k}a]`),r=e.target.closest(`[data-${k}x]`);
      if(a){sel.push(+a.dataset[k+'a']);const t=q.value;q.value='';draw();if(t)q.focus()}else if(r){sel=sel.filter(i=>i!==+r.dataset[k+'x']);draw()}});draw();return{get:()=>sel,draw}}

const dsT=ts=>ts?new Date(ts*1000).toLocaleString(LOC,{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'–';
const dsD=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};

async function dsUser(id,fmt){const b=$(fmt==='zip'?'#dsZ':'#dsF');b.disabled=true;

    if(fmt!=='zip'){aarSave(pdf,base+'.pdf');return}
    await loadJs(AAR_LIB.zip);const z=new JSZip(),{photo:_,...data}=d;
    z.file(base+'.pdf',pdf);z.file('daten.json',JSON.stringify({meta:{...x.meta,logo:undefined},data},null,1));

    z.file('LIESMICH.txt',`Datenschutzauszug ${d.user.name} (${d.user.username})\r\nErstellt am ${dsT(x.meta.at)} von ${x.meta.by}\r\n\r\n${base}.pdf  lesbare Fassung\r\ndaten.json  alle Daten (Zeiten als Unix-Zeit in Sekunden, Koordinaten WGS84)\r\ncsv/  je Abschnitt eine Tabelle (Semikolon, UTF-8)\r\nstandortverlauf.geojson  aufgezeichnete Standorte\r\nprofilbild  Profilbild\r\ndurchsagen/  eigene Sprachaufnahmen (Einsatz_Aufnahme)${miss?`\r\n\r\n${miss} Aufnahme(n) konnten nicht geladen werden.`:''}\r\n`);

  catch(e){fail(e)}finally{b.disabled=false;dsSay('');loadDsarHist()}}

async function loadHydro(){const el=$('#sHy');let s,h;try{[s,h]=await Promise.all([api('settings'),api('hydro/status',{})])}catch(e){return secErr(el,'Pegel & Abfluss',e)}
  const c=s.hydro,N=s.hydro_num,dt=t=>t?esc(new Date(t*1000).toLocaleString(LOC)):'–',on=Object.values(s.feat_on||{}).some(f=>f.hydro);
  const st=x=>`${x.stations} Messstationen (${x.rivers} an Fliessgewässern), aktuelle Werte für ${x.values}${x.at?`, Stand ${dt(x.at)}`:''}${x.fail_at?` · ⚠ letzter Fehlschlag ${dt(x.fail_at)}`:''}. Die Werte werden 5 Minuten zwischengespeichert (das BAFU misst alle 10 Minuten).`;

  const SS=s.hydro_sources,ks=Object.keys(SS),srcSt=k=>{const x=(h.status||{})[k];return x?`Letzte Abfrage ${dt(x.at)}: ${x.ok?`✓ ${x.ms} ms, ${x.stations} Stationen, Werte für ${x.values}`:`✗ ${esc(x.err||'Fehler')}`}${!x.ok&&x.ok_at?` · letzter Erfolg ${dt(x.ok_at)}`:''}`:'Noch nicht abgefragt'};
  const srcRow=(k,i)=>{const S=SS[k];return`<div class="inc" style="display:block;padding:.5rem .7rem"><div class="row" style="align-items:center;margin:0"><label class="chk" style="flex:1 1 12rem;min-width:0;flex-wrap:wrap;overflow-wrap:anywhere"><input type="checkbox" data-hs="${k}" ${c.src[k]?'checked':''}> <b>${i+1}. ${esc(S.name)}</b> <a href="${esc(S.site)}" target="_blank" rel="noopener" class="mut">${esc(S.site.replace(/^https:\/\//,''))}</a></label><button data-ht="${k}">Testen</button></div>
      <div class="mut">Lizenz: ${esc(S.lic)}</div><div class="mut">⚠ ${esc(S.note)}</div><div class="mut">${srcSt(k)}</div><div class="mut" id="ht_${k}"></div></div>`};
  el.innerHTML=`<h2>Pegel &amp; Abfluss</h2><div class="mut">Abfluss, Pegel und Wassertemperatur der Messstationen des BAFU (offene Daten, Werte ungeprüft; Quellen unten), mit Gefahrenstufe gemäss den Schwellen des BAFU, soweit die Webseite eingeschaltet ist. Im Einsatz hält die App zu Beginn, sobald ein PLS bekannt ist, und am Einsatzende die Werte der nächsten Stationen um jeden PLS fest: im Einsatzlog und im Menü der Einsatz-App. Jede Person kann im Profil eigene Messstationen wählen, die sie im Menü und auf der Karte sieht.</div>
    ${on?'':'<div class="mut">⚠ Die Funktion «Pegel & Abfluss (BAFU)» ist bei keinem Einsatztyp eingeschaltet (Funktionen → Funktionen).</div>'}
    <h3>Datenquellen</h3><div class="mut">Zuerst fragt der Server die Schnittstelle, die Werte daraus gehen vor. Die Webseite ergänzt, was der Schnittstelle fehlt (Gefahrenstufe, Einordnung, weitere Stationen), und springt ganz ein, wenn sie nicht antwortet. Sind beide aus, gibt es keine Messwerte.</div>${ks.map(srcRow).join('')}
    <h3>Stationen im Einsatz</h3><div class="anums">${numCard('hyR','Umkreis um jeden PLS',c.radius_km,'km',N.radius_km[1],N.radius_km[2],1,N.radius_km[0])}${numCard('hyN','Stationen je PLS',c.n,'Stationen',N.n[1],N.n[2],1,N.n[0])}</div>
    <label class="chk"><input type="checkbox" id="hyL" ${c.lakes?'checked':''}> Auch Messstationen an Seen (meist nur Pegel)</label>
    ${sbar('hySv')}

  $('#hySv').onclick=()=>api('settings/save',{hydro:{radius_km:$('#hyR').value,n:$('#hyN').value,lakes:$('#hyL').checked?1:0,src:Object.fromEntries(ks.map(k=>[k,el.querySelector(`[data-hs="${k}"]`).checked?1:0]))}}).then(()=>{toast(ks.some(k=>el.querySelector(`[data-hs="${k}"]`).checked)?'Gespeichert. Gilt für die nächsten Erfassungen.':'Gespeichert. Ohne Datenquelle gibt es keine Messwerte.',ks.some(k=>el.querySelector(`[data-hs="${k}"]`).checked)?'ok':'info');loadHydro()}).catch(fail);
  el.querySelectorAll('[data-ht]').forEach(b=>b.onclick=async()=>{const k=b.dataset.ht,o=$('#ht_'+k);b.disabled=true;o.textContent='Wird abgefragt …';

    const id={};A.forEach(e=>{if(e.done)id[e.key]=e.done});const rf=v=>/^E\d+$/.test(v||'')?+v.slice(1):id[v];let n=0;

        if(e.kind==='seen'){b.ref_id=e.of==='new'||e.of==='unk'?e.of:rf(e.of);if(!b.ref_id)throw new Error('der gesichtete Rettling ist nicht erstellt')}

// AI-Assistent (Issue #111) im AAR-Formular: ✨ je Textfeld (überarbeitet vorhandenen Text) und «Entwurf für leere Felder»;
// begleitend wird der Entwurf für die leeren Felder beim Öffnen vorbereitet. Übernehmen füllt nur das Formular, gespeichert wird wie immer.
function aiAar(d,x,id,F){const m=aiMi('aar',x),ch=aiMi('chat',x)!=='off';if(m==='off')return;const T=F.filter(f=>f.type==='text'||f.type==='area'),L=k=>(F.find(f=>f.id===k)||{}).label||k;if(!T.length)return;
  const el=k=>$(`[data-af="${k}"]`,d),show=r=>Object.entries(r.fields||{}).map(([k,v])=>`<div class="aif"><b>${esc(L(k))}</b><div class="aitx">${aiFmt(v)}</div></div>`).join('')||'<div class="mut">Kein Vorschlag.</div>';
  const put=(r,over)=>{let n=0,skip=0;for(const[k,v]of Object.entries(r.fields||{})){const e=el(k);if(!e)continue;if(!over&&e.value.trim()){skip++;continue}e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}));n++}

  const card=d.firstElementChild;card.insertBefore(bar,card.children[2]||null);let pre=null;const ba=$('[data-aia]',bar);

  for(const f of T){const e=el(f.id);if(!e)continue;const b=document.createElement('button');b.type='button';b.className='aib ico';b.textContent='✨';b.title='Vorschlag des AI-Assistenten für «'+f.label+'»'+(f.type==='area'?' (vorhandener Text wird überarbeitet)':'');

const aarIC={};
const aarImgs=(x,my)=>Promise.all((x.imgs||[]).map(async m=>{m.src=await(aarIC[m.id]=aarIC[m.id]||api('aar/img&id='+m.id+(my?'&my=1':'')).then(r=>r.src).catch(e=>{delete aarIC[m.id];throw e}))}));

// Marke [Bild <id>] an der Cursorstelle auf eine eigene Zeile setzen (ohne Cursor bisher: ans Ende); die Marke zeigt im Dokument das Bild an dieser Stelle
function aarIns(ta,s){const v=ta.value,a=ta.dataset.t?ta.selectionEnd:v.length,pre=v.slice(0,a),post=v.slice(a),t=(pre&&!pre.endsWith('\n')?'\n':'')+s+(post&&!post.startsWith('\n')?'\n':'');
  ta.value=pre+t+post;ta.dataset.t='1';ta.setSelectionRange(pre.length+t.length,pre.length+t.length)}
// ta = Textfeld (Feldart area): Bilder stehen dort im Text; ohne ta Feldart img
function aarImgEdit(d,x,id,fid,changed,ta){const el=$(`[data-aimg="${fid}"]`,d);
  if(ta){ta.addEventListener('focus',()=>ta.dataset.t='1',{once:true});
    ta.addEventListener('paste',e=>{const fs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));if(fs.length){e.preventDefault();add(fs)}})}
  const add=async fs=>{const b=$('[data-aia]',el);b.disabled=true;
    try{for(const [n,f] of fs.entries()){b.textContent=`Lädt hoch … ${n+1}/${fs.length}`;const src=await aarPhoto(f),r=await api('aar/img/add',{id,field:fid,src});aarIC[r.id]=Promise.resolve(src);x.imgs.push({id:r.id,field:fid,caption:'',w:r.w,h:r.h,src});if(ta)aarIns(ta,`[Bild ${r.id}]`);changed()}}

      +`<div class="row"><button class="${ta?'sec':''}" data-aia ${ta?'title="Bild an der Cursorstelle einfügen (auch aus der Zwischenablage)"':''}>${ta?'+ Bild einfügen':'+ Bilder hinzufügen'}</button><input type="file" accept="image/*" multiple hidden></div>${ta?(L.length?'<small>Im Dokument steht das Bild dort, wo im Text seine Marke steht (verschieben durch Ausschneiden und Einfügen). Ohne Marke kommt es ans Ende des Textes. Bilder werden sofort gespeichert.</small>':''):'<small>Bilder werden sofort gespeichert und auf höchstens 1600 Pixel verkleinert.</small>'}`;
    el.querySelectorAll('[data-ain]').forEach(b=>b.onclick=()=>aarIns(ta,`[Bild ${b.dataset.ain}]`));
    el.querySelectorAll('[data-aic]').forEach(c=>c.onchange=()=>{const m=x.imgs.find(m=>m.id==c.dataset.aic);api('aar/img/save',{img:m.id,caption:c.value}).then(()=>{m.caption=c.value;changed()}).catch(fail)});

    B.push({t:'h',x:'Einsatzdaten'},{t:'kv',rows:[['Einsatztyp',kindOf(i).name],...(i.plan?[['Vorbereitete Übung',i.plan]]:[]),['Alarmmeldung',i.message],
      ['Alarmeingang',aarDt(i.alarm_at)],['Einsatzende',aarDt(i.ended_at)],['Dauer',aarMin(i.ended_at-i.alarm_at)],['Ausgelöst von',i.creator||'–'],['Einsatzkräfte mit App',String(x.people.length)],

  im.onload=()=>{const w0=im.naturalWidth||800,h0=im.naturalHeight||800,k=Math.min(1,800/Math.max(w0,h0)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w0*k));c.height=Math.max(1,Math.round(h0*k));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let s=c.toDataURL('image/png');if(s.length>1900000){const j=document.createElement('canvas');j.width=c.width;j.height=c.height;const g=j.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,j.width,j.height);g.drawImage(c,0,0);s=j.toDataURL('image/jpeg',.9)}ok(s)};
  im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Das Bild konnte nicht gelesen werden'))};im.src=u});

  el.innerHTML=`<h2>After Action Review einrichten</h2><div class="mut">Gilt für alle Reviews. Das Dokument beginnt mit den Einsatzdaten, dann folgen die Felder in dieser Reihenfolge und danach die Listen.</div>

    <h3>Logo</h3><div class="mut">Das Logo der Organisation steht auch in der App: Anmeldung, Menü der Einsatz-App, Kopfzeile der Verwaltung, öffentliche Ansicht, Impressum und Kontenliste der App (Issue #123).</div><div class="row aarrow" style="align-items:center">${aarC.logo?`<img src="${aarC.logo}" alt="Logo" class="aarlogo">`:'<span class="mut">Kein Logo</span>'}<button id="acL">${aarC.logo?'Anderes Bild wählen':'Bild wählen'}</button>${aarC.logo?'<button class="sec" id="acLx">Entfernen</button>':''}<input type="file" id="acLf" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden></div>
    <div class="mut">Optional, erscheint oben rechts im Dokument. PNG, JPEG, WebP oder SVG; es wird auf höchstens 800 Pixel verkleinert.</div>

    <div class="mut">Gilt für die Ansicht, Word und PDF; beim Herunterladen wird nicht mehr danach gefragt. Die Listen erscheinen nur, wenn es im Einsatz solche gibt.</div>

    <h3>Felder (${L})</h3>${newBar('acA','Neues Feld')}
    ${L?C.fields.map((f,n)=>fCard(f,n,L,T,'f')).join(''):empty('Noch keine Felder. Beispiel: «Was ist gut gelaufen?» als Text mehrzeilig.')}
    <div class="mut">Entfernte Felder verschwinden aus Formular und Dokument; bereits erfasste Angaben bleiben gespeichert. Kurze Angaben (Text einzeilig, Datum, Uhrzeit, Zahl, Auswahl, Ja/Nein) stehen im Dokument in einer Tabelle, mehrzeilige als Frage mit Antwort.</div>
    <h3 id="acFb">Einsatzfeedback</h3><div class="mut">Fragen an die Einsatzkräfte nach dem Einsatz (Issue #103). Wer Reviews erstellt, fordert das Feedback im AAR-Arbeitsplatz an (Knopf «Erfassen»/«Bearbeiten» in der Einsatzstatistik). Gefragt sind alle, die teilgenommen haben; sie erhalten eine Benachrichtigung und antworten unter «Meine Einsätze» bzw. über den Hinweis in der Einsatz-App. Die Antworten stehen im Arbeitsplatz und, wenn oben «Feedback der Einsatzkräfte» angehakt ist, im Dokument. Nach der Freigabe des Reviews sind keine Antworten mehr möglich.</div>
    <div class="scard"><label class="chk"><input type="checkbox" id="fbOn" ${FB.on?'checked':''}> Einsatzfeedback anfordern können</label>
    <label class="chk"><input type="checkbox" id="fbAn" ${FB.anon?'checked':''}> Antworten ohne Namen zeigen («Rückmeldung 1», «Rückmeldung 2» …), auch im Dokument</label>
    <div class="jtwo"><label class="mut">Frist zum Antworten (Tage, 1–90)<input type="number" id="fbD" min="1" max="90" value="${FB.days}"></label><span></span></div>

    <div class="mut">Beim Einsatzende automatisch anfordern bei:</div><div class="row">${(me.kinds||[]).map(k=>`<label class="chk"><input type="checkbox" data-fbk="${k.id}" ${FB.kinds.includes(k.id)?'checked':''}> ${kindBadge({kind_name:k.name,kind_color:k.color})}</label>`).join('')||'<span class="mut">Keine Einsatztypen</span>'}</div>
    ${sbar('fbS')}</div>
    <h4>Fragen (${FB.fields.length})</h4>${newBar('fbA','Neue Frage')}
    ${FB.fields.length?FB.fields.map((f,n)=>fCard(f,n,FB.fields.length,aarC.fbtypes,'q')).join(''):empty('Noch keine Fragen. Beispiel: «Was würdest du beim nächsten Mal anders machen?»')}
    <div class="mut">Entfernte Fragen verschwinden aus Formular, Arbeitsplatz und Dokument; bereits abgegebene Antworten bleiben gespeichert.</div>`;
  const cur=()=>({title:C.title,org:C.org,auto:{...C.auto},dl:JSON.parse(JSON.stringify(C.dl)),fields:C.fields.map(f=>({...f}))});

  $('#fbS').onclick=()=>fbSave(fbCur()).catch(fail);
  const qmv=(n,k)=>{const x=fbCur();[x.fields[n],x.fields[n+k]]=[x.fields[n+k],x.fields[n]];fbSave(x).catch(fail)};
  el.querySelectorAll('[data-qm]').forEach(b=>b.onclick=()=>qmv(+b.dataset.qm,+b.dataset.d));

  el.querySelectorAll('[data-qx]').forEach(b=>b.onclick=async()=>{const n=+b.dataset.qx;if(await ask(`Frage «${FB.fields[n].label}» entfernen?\n\nBereits abgegebene Antworten bleiben gespeichert, erscheinen aber nicht mehr.`)){const x=fbCur();x.fields.splice(n,1);fbSave(x).catch(fail)}});
  $('#fbA').onclick=()=>aarField(null,f=>{const x=fbCur();x.fields.push(f);return fbSave(x)},aarC.fbtypes);

  el.querySelectorAll('[data-aa]').forEach(c=>c.onchange=()=>{const x=cur();x.auto[c.dataset.aa]=c.checked?1:0;save(x).catch(fail)});

  const mv=(n,k)=>{const x=cur();[x.fields[n],x.fields[n+k]]=[x.fields[n+k],x.fields[n]];save(x).catch(fail)};
  el.querySelectorAll('[data-fm]').forEach(b=>b.onclick=()=>mv(+b.dataset.fm,+b.dataset.d));
  el.querySelectorAll('[data-fe]').forEach(b=>b.onclick=()=>{const n=+b.dataset.fe;aarField(C.fields[n],f=>{const x=cur();x.fields[n]=f;return save(x)})});
  el.querySelectorAll('[data-fx]').forEach(b=>b.onclick=async()=>{const n=+b.dataset.fx,f=C.fields[n];
    if(await ask(`Feld «${f.label}» entfernen?\n\nEs verschwindet aus Formular und Dokument. Bereits erfasste Angaben bleiben gespeichert, erscheinen aber nicht mehr.`)){const x=cur();x.fields.splice(n,1);save(x).catch(fail)}});

  if($('#acLx'))$('#acLx').onclick=async()=>{if(await ask('Logo entfernen?'))api('aar/logo',{logo:null}).then(loadAarCfg).catch(fail)}}
function aarField(f,done,T=aarC.types){const neu=!f;f=f||{type:'area',label:'',hint:''};
  const d=dlg(neu?'Neues Feld':'Feld bearbeiten',`<label class="mut">Bezeichnung<input id="afL" value="${esc(f.label)}" maxlength="150"></label>
    <label class="mut">Art<select id="afT">${Object.entries(T).map(([k,l])=>`<option value="${k}" ${k===f.type?'selected':''}>${esc(l)}</option>`).join('')}</select></label>
    <div class="mut" id="afN"></div>
    <label class="mut" id="afHw">Hinweis (im Formular unter dem Feld, nicht im Dokument)<input id="afH" value="${esc(f.hint||'')}" maxlength="300"></label>
    <label class="mut" id="afOw">Auswahlwerte (einer pro Zeile, höchstens 30)<textarea id="afO" rows="5">${esc((f.opts||[]).join('\n'))}</textarea></label>`,
    async d=>{const t=$('#afT',d).value;await done({id:f.id,type:t,label:$('#afL',d).value,hint:t==='head'?'':$('#afH',d).value,...(t==='select'?{opts:$('#afO',d).value.split('\n')}:{})})},neu?'Hinzufügen':'Speichern');
  const sync=()=>{const t=$('#afT',d).value;$('#afOw',d).hidden=t!=='select';$('#afHw',d).hidden=t==='head';
    $('#afN',d).textContent=t==='head'?'Gliedert Formular und Dokument (Abschnittstitel), hat keinen Wert.':t==='img'?'Beliebig viele Bilder mit Beschriftung (höchstens 50 je Review); im Dokument unter der Bezeichnung.':t==='area'?'Im Dokument als Frage mit der Antwort darunter. Im Formular lassen sich Bilder an beliebiger Stelle im Text einfügen.':'Im Dokument in einer Tabelle mit den übrigen kurzen Angaben.'};
  $('#afT',d).onchange=sync;sync()}

// AI-Assistent (Issue #111): Zusammenfassung des Logs; begleitend schon beim Öffnen vorbereitet (Knopf leuchtet), Namen wie die Ansicht (Server)

/* ---------- Meine Einsätze (Issue #61): Log und Replay der beendeten Einsätze, an denen man teilgenommen hat ---------- */
// my_runs (Einstellung der Verwaltung): anon = alle anderen anonym, die eigene Person mit Namen (forced, ohne Umschalter); full = alle Daten.
// Endgültig Anonymisiertes (rp_anon, log_anon) bleibt in jedem Fall ganz anonym.
// Meine Statistik (Issue #87): die eigenen Teilnahmen (my/stats) mit Art und Zeitraum, Filter pro Gerät gemerkt (sw_mysf)
let myPs=null,myF=(()=>{try{return Object.assign({art:'all',per:'all',from:'',to:''},JSON.parse(localStorage.getItem('sw_mysf')||'{}'))}catch(e){return{art:'all',per:'all',from:'',to:''}}})();
function renderMyPs(){const el=$('#myStat');if(!el||!myPs)return;const f=myF,[a,b]=psRange(f),save=()=>{try{localStorage.setItem('sw_mysf',JSON.stringify(myF))}catch(_){}};
  const years=[...new Set(myPs.map(x=>new Date(x.alarm_at*1000).getFullYear()))].sort((x,y)=>y-x);
  const rows=myPs.filter(x=>isArt(x,f.art)&&x.alarm_at>=a&&x.alarm_at<b),acc=rows.filter(r=>!r.declined),sum=k=>acc.reduce((s,r)=>s+(r[k]||0),0),re=acc.map(r=>r.react).filter(x=>x!=null);
  const modes={};acc.forEach(r=>{if(r.mode_name)modes[r.mode_name]=(modes[r.mode_name]||0)+1});
  el.innerHTML=`<h3>Meine Statistik</h3>
    <div class="row psf"><label class="mut">Art<select id="myArt">${artOpts(myPs,f.art)}</select></label>
      <label class="mut">Zeitraum<select id="myPer"><option value="all">Gesamte Zeit</option>${years.map(y=>`<option value="${y}" ${String(y)===f.per?'selected':''}>${y}</option>`).join('')}<option value="custom" ${f.per==='custom'?'selected':''}>Von – bis …</option></select></label>
      ${f.per==='custom'?`<label class="mut">Von<input type="date" id="myFrom" value="${esc(f.from)}"></label><label class="mut">Bis<input type="date" id="myTo" value="${esc(f.to)}"></label>`:''}</div>
    <div class="ssum"><div style="--k:var(--ex)"><div class="kv">${kindCounts(acc,acc)}
      <span><small>Einsatzzeit</small>${psHrs(sum('dur'))}</span><span><small>Ø Reaktionszeit</small>${psHrs(re.length?re.reduce((s,x)=>s+x,0)/re.length:null)}</span><span><small>Suchgebiet erreicht</small>${acc.filter(r=>r.area!=null).length}</span>
      <span><small>Fahrten</small>${sum('trips')?sum('trips')+' · '+psKm(sum('km')):'–'}</span><span><small>Weg (Aufzeichnung)</small>${sum('track_km')?psKm(sum('track_km')):'–'}</span>${rows.length>acc.length?`<span><small>Abgelehnt</small>${rows.length-acc.length}</span>`:''}</div>
      ${Object.keys(modes).length?`<div class="fl" style="margin-top:.3rem">${Object.entries(modes).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<span>${esc(k)} ${v}×</span>`).join('')}</div>`:''}</div></div>
    ${psMonths(acc)||'<div class="mut">Keine Teilnahmen im gewählten Zeitraum.</div>'}
    <div class="mut" style="font-size:.8rem">Einsatzzeit: ab Annahme bis Verlassen bzw. Einsatzende. Reaktionszeit: Alarm bis Annahme. Fahrten: erkannte Fahrten mit Fahrzeug (Luftlinie). Weg: nur bei Einsätzen mit Aufzeichnung. Zählt auch laufende und endgültig anonymisierte Einsätze.</div>`;
  const set=(k,v)=>{myF[k]=v;save();renderMyPs()};
  $('#myArt').onchange=e=>set('art',e.target.value);$('#myPer').onchange=e=>set('per',e.target.value);
  if($('#myFrom')){$('#myFrom').onchange=e=>set('from',e.target.value);$('#myTo').onchange=e=>set('to',e.target.value)}
  psTips(el)}
// Offene Feedback-Anfragen an mich (Issue #103): zuoberst in «Meine Einsätze», auch wenn die Einsicht ausgeschaltet ist; Antwort änderbar bis zur Frist
function myFb(box,F){if(!box)return;if(!F||!F.items.length){box.innerHTML='';return}const Q=F.fields;
  const inp=(f,v,n)=>{const a=`data-fq="${f.id}" id="fq${n}_${f.id}"`;v=v??'';switch(f.type){case'area':return`<textarea ${a} rows="3">${esc(v)}</textarea>`;
    case'date':return`<input type="date" ${a} value="${esc(v)}">`;case'time':return`<input type="time" ${a} value="${esc(v)}">`;case'number':return`<input type="number" step="any" ${a} value="${esc(v)}">`;
    case'select':return`<select ${a}><option value="">–</option>${f.opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    case'check':return`<select ${a}><option value="">–</option><option value="1" ${v==='1'?'selected':''}>Ja</option><option value="0" ${v==='0'?'selected':''}>Nein</option></select>`;
    default:return`<input ${a} value="${esc(v)}" maxlength="2000">`}};
  box.innerHTML=`<h3>Feedback zu deinen Einsätzen</h3>${F.items.map(x=>`<details class="inc fbmy" ${kindCss(x)} ${x.answered?'':'open'} data-fbi="${x.id}"><summary>${kindBadge(x)} <b>${esc(x.message)}</b> <span class="mut">${aarDt(x.alarm_at)} · ${x.answered?'beantwortet am '+aarDt(x.answered)+', änderbar':'offen'} bis ${aarDt(x.until_at)}</span></summary>
    ${F.intro?`<div class="mut">${esc(F.intro)}</div>`:''}${x.note?`<div><b>Mitteilung:</b> ${esc(x.note)}</div>`:''}${F.anon?'<div class="mut">Deine Antworten erscheinen im Review ohne deinen Namen.</div>':''}
    ${Q.map(f=>f.type==='head'?`<h4>${esc(f.label)}</h4>`:`<label class="mut" for="fq${x.id}_${f.id}">${esc(f.label)}${inp(f,x.data[f.id],x.id)}${f.hint?`<small>${esc(f.hint)}</small>`:''}</label>`).join('')}
    <div class="row"><button class="pri" data-fbs="${x.id}">${x.answered?'Antwort ändern':'Feedback senden'}</button></div></details>`).join('')}`;
  box.querySelectorAll('[data-fbs]').forEach(b=>b.onclick=async()=>{if(b.disabled)return;const c=b.closest('[data-fbi]'),data={};c.querySelectorAll('[data-fq]').forEach(e=>data[e.dataset.fq]=e.value);b.disabled=true;
    try{await api('my/fb/save',{id:+b.dataset.fbs,data});toast('Danke für dein Feedback.','ok');myFb(box,await api('my/fb'))}catch(e){fail(e);b.disabled=false}})}

    ov.querySelector('[data-x]').onclick=()=>ov.remove();dkView(ov.querySelector('.dkbody'),{...d,file:{...f}},()=>dkBlob(o.id,'&ver='+v))});
  box.querySelectorAll('[data-vr]').forEach(b=>b.onclick=async()=>{if(!await ask('Diese Version wiederherstellen?\n\nSie wird als neue Version gespeichert.',{ok:'Wiederherstellen'}))return;try{await api('doc/ver/restore',{id:+b.dataset.vr});dkVerList(box,o);loadDocs()}catch(e){fail(e)}});
  box.querySelectorAll('[data-vx]').forEach(b=>b.onclick=async()=>{if(!await ask('Diese frühere Version entfernen?'))return;try{await api('doc/ver/remove',{id:+b.dataset.vx});dkVerList(box,o)}catch(e){fail(e)}});

function dkVerDlg(o,done){const cfg=me.docs_cfg;const d=dlg('Neue Version – '+o.title,`<label class="mut">Datei<input type="file" id="vF"></label><div class="mut" id="vP">Erlaubt: ${esc(cfg.types.flatMap(t=>t.ext).concat(cfg.free).map(x=>'.'+x).join(', '))}, höchstens ${cfg.max_mb} MB.</div>

// Lesebestätigung: wer (alle Lesenden, Liste, über Fähigkeit), Frist, Neue, nur bei wesentlichen Änderungen, Fähigkeit eintragen; Stand mit Erinnern
async function dkAckDlg(id,done){let o,A;try{[o,A]=await Promise.all([api('doc&id='+id),api('doc/acks&id='+id)])}catch(e){return fail(e)}const c=o.ackcfg,M=DKA;

    <label class="mut">Wer muss bestätigen?<select id="aBy"><option value="read">Alle, die den Eintrag sehen</option><option value="list" ${c.ack_by==='list'?'selected':''}>Nur bestimmte Einsatzgruppen oder Benutzerrollen</option><option value="skill" ${c.ack_by==='skill'?'selected':''}>Wer eine Fähigkeit der Ausbildung als Pflicht hat</option></select></label>

    <label class="mut" id="aSk">Fähigkeit (Ausbildung)<select id="aS"><option value="">(keine)</option>${M.skills.map(k=>`<option value="${k.id}" ${c.ack_skill===k.id?'selected':''}>${esc(k.name)}${k.req?' ★':''}</option>`).join('')}</select><small class="mut" id="aSh"></small></label>
    <div class="jtwo"><label class="mut">Frist (Tage nach der Freigabe bzw. nach dem Hinzukommen, leer = ohne)<input type="number" id="aD" min="1" max="3650" value="${c.ack_days??''}"></label>
      <div><label class="chk"><input type="checkbox" id="aN" ${c.ack_new!==0?'checked':''}> Auch Personen, die später hinzukommen (neu in der Gruppe oder Organisation)</label>
      <label class="chk"><input type="checkbox" id="aM" ${c.ack_major?'checked':''}> Erneut nur bei wesentlichen Änderungen</label></div></div>
    <div class="mut" id="aCnt"></div></div>
    ${c.ack?`<h3>Stand (Version ${A.ack_ver}${A.ack_at?', verlangt seit '+dkDate(A.ack_at):''})</h3><div class="fl"><span class="skchip sk-ok">${A.list.filter(x=>x.st==='ok').length} bestätigt</span> <span class="skchip sk-warn">${A.list.filter(x=>x.st==='open').length} offen</span> <span class="skchip sk-exp">${A.list.filter(x=>x.st==='over').length} überfällig</span> <span class="mut">${A.readers} sehen den Eintrag</span></div>
      <div class="dkacks">${A.list.map(x=>`<div class="dkackr st-${x.st}"><span>${nmG(x.name,x.user_id)}</span><span class="mut">${stTxt[x.st]}${x.st==='ok'&&x.at?' '+dkDate(x.at):x.due?' · Frist '+dkDate(x.due):''}</span></div>`).join('')||'<div class="mut">Niemand muss bestätigen.</div>'}</div>
      ${A.free.length?`<details><summary class="mut">Freiwillig bestätigt (${A.free.length})</summary>${A.free.map(x=>`<div class="dkackr"><span>${nmG(x.name,x.user_id)}</span><span class="mut">${dkDate(x.at)}</span></div>`).join('')}</details>`:''}
      <div class="row"><button type="button" id="aRm">Offene erinnern</button><button type="button" id="aRn">Jetzt von allen erneut verlangen</button><button type="button" id="aCsv">CSV</button></div>`:''}`,async d=>{await api('doc/ack/cfg',val(d));toast('Gespeichert.','ok');done?done():loadDocs()});d.firstElementChild.classList.add('mid');
  const val=(d,x={})=>{const[g,r]=dkPickVal(d,'al');return{id,ack:$('#aOn',d).checked?1:0,ack_by:$('#aBy',d).value,ack_grp:g,ack_role:r,ack_days:+$('#aD',d).value||null,ack_new:$('#aN',d).checked?1:0,ack_major:$('#aM',d).checked?1:0,ack_skill:+$('#aS',d).value||null,...x}};
  let t=0;const sync=()=>{const by=$('#aBy',d).value;$('#aW',d).hidden=!$('#aOn',d).checked;$('#aL',d).hidden=by!=='list';$('#aSh',d).textContent=by==='skill'?'Pflicht: wer die Fähigkeit als Pflicht hat. Die Bestätigung wird als Eintrag dieser Fähigkeit erfasst.':'Optional: die Bestätigung wird zusätzlich als Eintrag dieser Fähigkeit erfasst.';
    clearTimeout(t);if($('#aOn',d).checked)t=setTimeout(async()=>{try{const n=await api('doc/ack/cfg',val(d,{dry:1}));$('#aCnt',d).textContent=`Betrifft ${n.n} von ${n.readers} Personen, die den Eintrag sehen.`}catch(e){$('#aCnt',d).textContent=e.message}},200)};
  ['#aOn','#aBy','#aS','#aD'].forEach(s=>$(s,d).addEventListener('change',sync));dkPickWire(d,'al',sync);sync();
  const rm=$('#aRm',d);if(rm)rm.onclick=async()=>{try{const r=await api('doc/remind',{id});toast(r.n?r.n+' Personen erinnert.':'Niemand ist offen.','ok')}catch(e){fail(e)}};
  const rn=$('#aRn',d);if(rn)rn.onclick=async()=>{if(!await ask('Von allen erneut verlangen?\n\nAuch wer schon bestätigt hat, muss die aktuelle Version erneut bestätigen.',{ok:'Erneut verlangen'}))return;try{await api('doc/ack/cfg',val(d,{renew:1}));d.remove();toast('Erneut verlangt.','ok');done?done():loadDocs()}catch(e){fail(e)}};
  const cv=$('#aCsv',d);if(cv)cv.onclick=()=>{const rows=[['Person','Stand','Bestätigt','Frist'],...A.list.map(x=>[x.name,stTxt[x.st],x.at?dkDate(x.at):'',x.due?dkDate(x.due):'']),...A.free.map(x=>[x.name,'freiwillig',dkDate(x.at),''])];
    saveBlob(new Blob(['﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'lesebestaetigung.csv')}}
// Eingang: Vorschläge an die Redaktion (offen zuerst), übernehmen, erledigt, ablehnen mit Begründung
async function loadDocIn(){const el=$('#sDkI');let L;try{L=(await api('doc/sugs')).list}catch(e){return secErr(el,'Eingang',e)}
  const K={new:'Neuer Eintrag',ver:'Neue Version',note:'Hinweis'},S={open:'offen',taken:'übernommen',done:'erledigt',rejected:'abgelehnt'};
  const card=x=>ent({ic:x.kind==='note'?'💬':x.kind==='ver'?'📎':'➕',t:x.title||x.doc_title||(x.file&&x.file.name)||K[x.kind],off:x.state!=='open',
    ch:chip(K[x.kind])+chip(x.folder)+(x.state!=='open'?chip(S[x.state]):''),dh:x.note?`<div class="dknote">${esc(x.note)}</div>`:'',
    rows:[['Von',x.user?nmG(x.user,x.user_id):'(gelöscht)'],['Eingegangen',esc(new Date(x.at*1000).toLocaleString(LOC))],x.doc_title?['Zu',esc(x.doc_title)]:null,x.file?['Datei',esc(x.file.name+' ('+dkSize(x.file.bytes)+')')]:null,x.reason?['Begründung',esc(x.reason)]:null].filter(Boolean),
    btns:x.state==='open'?`${x.file?`<button data-sf="${x.id}">Datei ansehen</button>`:''}${x.doc_id?`<button data-sd="${x.doc_id}">Eintrag ansehen</button>`:''}${x.kind!=='note'?`<button class="pri" data-st="${x.id}">Übernehmen</button>`:''}<button data-sk="${x.id}">Erledigt</button><button class="sec" data-sr="${x.id}">Ablehnen</button>`:x.result_id?`<button data-sd="${x.result_id}">Ergebnis ansehen</button>`:'',q:(x.title||'')+' '+(x.note||'')+' '+(x.user||'')});
  const op=L.filter(x=>x.state==='open'),dn=L.filter(x=>x.state!=='open');
  el.innerHTML=`<h2>Eingang</h2><div class="mut">Vorschläge der Einsatzkräfte für die Ordner, in denen du Redaktion bist: neue Einträge, neue Versionen und Hinweise. Wer vorgeschlagen hat, wird über das Ergebnis benachrichtigt. Abgelehnte werden nach 30 Tagen gelöscht.</div>
    ${newBar('','',qIn('siQ','Vorschläge suchen'))}${grpH('Offen',op.length)}${op.map(card).join('')||empty('Keine offenen Vorschläge.')}${offGrp(dn.map(card),'Erledigt')}`;qWire(el,'siQ');
  const f=id=>L.find(x=>x.id===id);
  el.querySelectorAll('[data-sf]').forEach(b=>b.onclick=()=>{const x=f(+b.dataset.sf),ov=document.createElement('div');ov.className='dkov';ov.innerHTML=`<div class="dkhd"><button data-x aria-label="Schliessen">✕</button><div class="dkt"><b>${esc(x.file.name)}</b><div class="mut">Vorschlag von ${esc(x.user||'?')}</div></div></div><div class="dkbody"></div>`;document.body.appendChild(ov);ov.querySelector('[data-x]').onclick=()=>ov.remove();
    dkView(ov.querySelector('.dkbody'),{kind:'file',title:x.file.name,file:x.file},async dl=>{const r=await fetch('api/index.php?r=doc/get&sug='+x.id+(dl?'&dl=1':''),{headers:{'X-Token':token}});if(!r.ok)throw new Error('Datei nicht verfügbar');return r.blob()})});
  el.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>dkOpen(+b.dataset.sd,{noFav:1}));
  el.querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{const x=f(+b.dataset.st);let maj=1;if(x.kind==='ver'){const a=await ask(`Datei als neue Version von «${x.doc_title}» übernehmen?\n\nWesentliche Änderung: Lesebestätigung erneut verlangen (sofern so eingestellt)?`,{ok:'Übernehmen, wesentlich',x:'Abbrechen'});if(!a)return}
    else if(!await ask(`Als neuen Eintrag im Ordner «${x.folder}» übernehmen?\n\nDer Eintrag wird deaktiviert angelegt; prüfe und aktiviere ihn danach in der Ablage.`,{ok:'Übernehmen'}))return;
    try{const r=await api('doc/sug/take',{id:x.id,major:maj});toast('Übernommen.','ok');if(x.kind==='new'&&r.doc_id){DKF=x.folder_id;location.hash='dokumente'}else loadDocIn()}catch(e){fail(e)}});
  el.querySelectorAll('[data-sk]').forEach(b=>b.onclick=async()=>{try{await api('doc/sug/done',{id:+b.dataset.sk});toast('Als erledigt markiert.','ok');loadDocIn()}catch(e){fail(e)}});
  el.querySelectorAll('[data-sr]').forEach(b=>b.onclick=()=>dlg('Vorschlag ablehnen','<label class="mut">Begründung (geht an die Person, die vorgeschlagen hat)<textarea id="rW" rows="3" maxlength="1000"></textarea></label>',async d=>{await api('doc/sug/reject',{id:+b.dataset.sr,reason:$('#rW',d).value});toast('Abgelehnt.','ok');loadDocIn()},'Ablehnen'))}
// Anzeige: Abschnitte des Fensters «Dokumente» je Einsatztyp (0 = ohne Einsatz), ein/aus und Reihenfolge; persönliche Reihenfolge, Anzahl
async function loadDocView(){const el=$('#sDkV');let C;try{C=await api('docs/cfg')}catch(e){return secErr(el,'Anzeige',e)}const v=JSON.parse(JSON.stringify(C.cfg.view));
  const tabs=[{id:0,name:'Ohne Einsatz'},...C.kinds];let cur=String(+(localStorage.getItem('sw_dkvk')||0));if(!tabs.some(t=>String(t.id)===cur))cur='0';
  const draw=()=>{const l=v[cur]||(v[cur]=JSON.parse(JSON.stringify(v['0']))),own=cur!=='0'&&C.cfg.view[cur];
    $('#dvL').innerHTML=`${cur!=='0'?`<label class="chk"><input type="checkbox" id="dvOwn" ${v[cur]._own!==0&&(own||v[cur]._own)?'checked':''}> Eigene Reihenfolge für diesen Einsatztyp (sonst wie «Ohne Einsatz»)</label>`:''}
      <div id="dvR">${l.map((s,i)=>`<div class="dkvr"><label class="chk"><input type="checkbox" data-dvo="${i}" ${s.on?'checked':''}> ${esc(C.secs[s.k].label)}</label><span class="bg"><button type="button" data-dvm="${i}:-1" ${i?'':'disabled'} aria-label="Nach oben">↑</button><button type="button" data-dvm="${i}:1" ${i<l.length-1?'':'disabled'} aria-label="Nach unten">↓</button></span></div>`).join('')}</div>`;
    const ow=$('#dvOwn');if(ow){$('#dvR').hidden=!ow.checked;ow.onchange=()=>{v[cur]._own=ow.checked?1:0;markDirty($('#dvS').closest('.sbar'));draw()}}
    $('#dvL').querySelectorAll('[data-dvo]').forEach(i=>i.onchange=()=>{l[+i.dataset.dvo].on=i.checked?1:0});
    $('#dvL').querySelectorAll('[data-dvm]').forEach(b=>b.onclick=()=>{const[i,dir]=b.dataset.dvm.split(':').map(Number);[l[i],l[i+dir]]=[l[i+dir],l[i]];markDirty($('#dvS').closest('.sbar'));draw()})};
  if(cur!=='0'&&C.cfg.view[cur])v[cur]._own=1;
  el.innerHTML=`<h2>Anzeige</h2><div class="mut">Welche Abschnitte das Fenster «Dokumente» der Einsatz-App zeigt und in welcher Reihenfolge, je Einsatztyp und ohne Einsatz. «Ordner» zeigt die ganze Ablage.</div>
    <div class="scard"><h3>Abschnitte</h3><div class="row"><select id="dvK" aria-label="Einsatztyp" data-nodirty>${tabs.map(t=>`<option value="${t.id}" ${String(t.id)===cur?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div id="dvL"></div>
      <h3>Weitere</h3><label class="chk"><input type="checkbox" id="dvP" ${C.cfg.own?'checked':''}> Einsatzkräfte dürfen die Reihenfolge für sich ändern</label>
      <div class="anums">${numCard('dvN','Einträge je Abschnitt',C.cfg.n,'Einträge',1,50,1,5,'«Zuletzt geöffnet» und «Neu und geändert»')}${numCard('dvM','Im Menü',C.cfg.menu_n,'Einträge',0,20,1,5,'Karte «Unterlagen» im Menü der Einsatz-App')}</div>
      ${sbar('dvS')}</div>`;
  $('#dvK').onchange=e=>{cur=e.target.value;try{localStorage.setItem('sw_dkvk',cur)}catch(x){}if(cur!=='0'&&C.cfg.view[cur]&&v[cur]._own==null)v[cur]._own=1;draw()};draw();
  $('#dvS').onclick=async()=>{const out={'0':v['0'].map(({k,on})=>({k,on}))};for(const t of C.kinds){const x=v[t.id];if(x&&x._own)out[t.id]=x.map(({k,on})=>({k,on}))}
    try{await api('docs/cfg/save',{cfg:{view:out,own:$('#dvP').checked?1:0,n:+$('#dvN').value,menu_n:+$('#dvM').value}});toast('Gespeichert.','ok');loadDocView()}catch(e){fail(e)}}}
// Einstellungen: Dateitypen (Katalog und freie Endungen), Grenzen, Versionen, Offline, Externe, Speicher
async function loadDocCfg(){const el=$('#sDkC');let C;try{C=await api('docs/cfg')}catch(e){return secErr(el,'Einstellungen',e)}const c=C.cfg,mb=b=>(b/1048576).toFixed(1).replace('.',',');
  el.innerHTML=`<h2>Einstellungen der Dokumente</h2>
    <div class="scard"><h3>Dateitypen</h3><div class="mut">Welche Dateien hochgeladen werden dürfen. Der Server prüft Endung und Inhalt (Signatur); Office-Dateien mit Makros, Programme und Webseiten sind nie erlaubt.</div>
      <div class="dktypes">${Object.entries(C.types).map(([k,t])=>`<label class="chk"><input type="checkbox" data-dty="${k}" ${c.types[k]?'checked':''}> <b>${esc(t.label)}</b> <span class="mut">${t.ext.map(x=>'.'+x).join(' ')}${t.show==='dl'?' · nur herunterladen':' · Anzeige in der App'}</span></label>`).join('')}</div>
      <label class="mut">Weitere Endungen (durch Komma getrennt, nur herunterladen; Endungen der Dateitypen oben zählen dort)<input id="dtF" value="${esc(c.free)}" placeholder="z. B. dwg, ics"></label><div class="mut">Nie erlaubt: ${esc(C.never.map(x=>'.'+x).join(' '))}</div>${sbar('dtS')}</div>
    <div class="scard"><h3>Grenzen und Versionen</h3><div class="anums">${numCard('dcM','Grösse je Datei',c.max_mb,'MB',1,500,1,25)}${numCard('dcQ','Speicher insgesamt',c.quota_mb,'MB',10,1000000,10,5120,'Alle Dateien und Vorschläge zusammen')}${numCard('dcK','Frühere Versionen behalten',c.keep,'Versionen',0,50,1,5,'Ältere werden beim Hochladen entfernt')}${numCard('dcO','Offline je Gerät',c.off_mb,'MB',0,5000,10,300,'0 = nichts offline speichern')}</div>
      <div class="mut">Belegt: ${mb(C.usage)} MB von ${c.quota_mb.toLocaleString(LOC)} MB in ${C.n_docs} Einträgen.</div>${sbar('dcS')}</div>
    <div class="scard"><h3>Externe</h3><div class="mut">Die Einsatzleitung kann im laufenden Einsatz einzelne Einträge für Externe freigeben: auf der Funk-Gastseite und als eigener Link. Beides endet mit dem Einsatz.</div>
      <label class="chk"><input type="checkbox" id="deOn" ${c.ext.on?'checked':''}> Freigabe für Externe erlauben</label><div id="deW" style="margin-left:1.4rem">
      <label class="chk"><input type="checkbox" id="deF" ${c.ext.folder_only?'checked':''}> Nur Einträge aus Ordnern, die das erlauben</label>
      <label class="chk"><input type="checkbox" id="deG" ${c.ext.guest?'checked':''}> Auf der Funk-Gastseite</label>
      <label class="chk"><input type="checkbox" id="deL" ${c.ext.link?'checked':''}> Als eigener Link je Eintrag</label>
      <label class="chk"><input type="checkbox" id="deD" ${c.ext.dl?'checked':''}> Herunterladen erlauben (sonst nur ansehen)</label>
      <div class="anums">${numCard('deH','Abrufe je Stunde',c.ext.hits_h,'je Link',1,10000,1,60,'Schutz vor Missbrauch')}</div></div>${sbar('deS')}</div>`;
  const ew=()=>$('#deW').hidden=!$('#deOn').checked;$('#deOn').onchange=ew;ew();
  const sv=async(cfg,b)=>{try{await api('docs/cfg/save',{cfg});toast('Gespeichert.','ok');me.docs_cfg=(await api('me')).me.docs_cfg;loadDocCfg()}catch(e){fail(e)}};
  $('#dtS').onclick=()=>sv({types:Object.fromEntries([...el.querySelectorAll('[data-dty]')].map(i=>[i.dataset.dty,i.checked?1:0])),free:$('#dtF').value});
  $('#dcS').onclick=()=>sv({max_mb:+$('#dcM').value,quota_mb:+$('#dcQ').value,keep:+$('#dcK').value,off_mb:+$('#dcO').value});
  $('#deS').onclick=()=>sv({ext:{on:$('#deOn').checked?1:0,folder_only:$('#deF').checked?1:0,guest:$('#deG').checked?1:0,link:$('#deL').checked?1:0,dl:$('#deD').checked?1:0,hits_h:+$('#deH').value}})}
</script></body></html>
