<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Swiftwater Rescue – Verwaltung</title>
<link rel="stylesheet" href="common.css">
<style>
body{min-height:100dvh}
header{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.7rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}header h1{font-size:1.15rem;margin:0;flex:1 1 12rem}
main{max-width:1100px;margin:0 auto;padding:1rem;display:grid;gap:1.2rem}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1rem}
h2{margin:0 0 .6rem;font-size:1.1rem}h3{margin:1rem 0 .3rem;font-size:1rem}
.tw{overflow-x:auto}th{text-align:left;padding:.3rem;color:var(--mut);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
tr.off td{opacity:.55}td.act{white-space:nowrap;text-align:right}td.act button{padding:.35rem .6rem;margin:.1rem}
</style></head><body>
<div id="app"></div>
<script src="common.js"></script>
<script>
/* Verwaltung: nur für die Benutzerrolle Administrator. Die API prüft die Berechtigung bei jedem Aufruf. */
let me=null,users=[],roles=[];
onUnauth=()=>start();
const ROLE_LABEL=u=>u.is_admin?'Administrator':'Einsatzkraft';
async function start(){const a=$('#app');if(!token)return loginView(a,'Swiftwater Rescue – Verwaltung',start);
  try{me=(await api('me')).me}catch(e){if(token)a.innerHTML=`<div class="card"><p>${esc(e.message)}</p></div>`;return}
  if(me.must_change){a.innerHTML='';return pwDialog(true,start)}
  if(!me.is_admin){a.innerHTML=`<div class="card"><h1>Kein Zugriff</h1><p>Die Verwaltung ist nur für Administratoren zugänglich.</p><div class="row"><a class="btn" href="./">Zur Einsatz-App</a><button id="bOut">Abmelden</button></div></div>`;$('#bOut').onclick=()=>{logout();start()};return}
  a.innerHTML=`<header><h1>Swiftwater Rescue – Verwaltung</h1><span class="mut">${esc(me.name)}</span><a class="btn" href="./">Zur Einsatz-App</a><button id="bPw">Passwort ändern</button><button id="bOut">Abmelden</button></header>
    <main><section id="sU"><h2>Benutzer</h2><div class="mut">Wird geladen …</div></section><section id="sR"><h2>Spezialrollen</h2><div class="mut">Wird geladen …</div></section><section id="stats"><h2>Einsatzstatistik</h2><div class="mut">Wird geladen …</div></section></main>`;
  $('#bPw').onclick=()=>pwDialog(false);$('#bOut').onclick=()=>{logout();start()};
  loadUsers();loadRoles();loadStats()}
/* ---------- Benutzer ---------- */
// Startpasswort ohne verwechselbare Zeichen (0/O, 1/l/I)
function genPw(){const c='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint32Array(10));return[...r].map(x=>c[x%c.length]).join('')}
async function loadUsers(){const el=$('#sU');try{users=await api('users')}catch(e){el.innerHTML='<h2>Benutzer</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  el.innerHTML=`<h2>Benutzer (${users.filter(u=>u.active).length} aktiv)</h2><div class="tw"><table><thead><tr><th>Name</th><th>Benutzername</th><th>Benutzerrolle</th><th>Status</th><th></th></tr></thead><tbody>${users.map(u=>{const self=u.id===me.id;
    return`<tr class="${u.active?'':'off'}"><td>${esc(u.name)}${self?' <span class="mut">(du)</span>':''}</td><td>${esc(u.username)}</td><td>${ROLE_LABEL(u)}</td><td>${u.active?'aktiv':'deaktiviert'}${u.must_change?'<br><span class="mut">Passwortwechsel ausstehend</span>':''}${u.exercise_mode?'<br><span class="mut">Übungsmodus an</span>':''}</td>
      <td class="act"><button data-e="${u.id}">Bearbeiten</button>${self?'':`<button data-p="${u.id}">Passwort zurücksetzen</button>${u.active?`<button data-d="${u.id}">Deaktivieren</button>`:`<button data-a="${u.id}">Reaktivieren</button>`}`}</td></tr>`}).join('')}</tbody></table></div>
    <h3>Neuer Benutzer</h3><div class="row"><input id="un" placeholder="Benutzername" autocomplete="off" aria-label="Benutzername"><input id="uf" placeholder="Name" aria-label="Name"><input id="up" placeholder="Startpasswort (mind. 8 Zeichen)" autocomplete="off" aria-label="Startpasswort" value="${genPw()}"><select id="ur" aria-label="Benutzerrolle"><option value="0">Einsatzkraft</option><option value="1">Administrator</option></select><button class="pri" id="uA">Benutzer anlegen</button></div>
    <div class="mut">Neue Benutzer müssen das Startpasswort bei der ersten Anmeldung ändern. Deaktivierte Benutzer können sich nicht mehr anmelden, ihre Einsatzdaten bleiben erhalten.</div>`;
  $('#uA').onclick=()=>{const pw=$('#up').value;api('user/save',{username:$('#un').value,name:$('#uf').value,password:pw,is_admin:+$('#ur').value}).then(()=>{alert('Benutzer angelegt. Startpasswort: '+pw);loadUsers()}).catch(fail)};
  const U=id=>users.find(x=>x.id==id);
  el.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const u=U(b.dataset.e),self=u.id===me.id;
    dlg('Benutzer bearbeiten',`<label class="mut">Name<input id="eN" value="${esc(u.name)}"></label><label class="mut">Benutzerrolle<select id="eR" ${self?'disabled':''}><option value="0">Einsatzkraft</option><option value="1" ${u.is_admin?'selected':''}>Administrator</option></select></label>${self?'<div class="mut">Die eigene Benutzerrolle kann nicht geändert werden.</div>':''}<div class="mut">Administratoren haben Zugriff auf diese Verwaltung und dürfen jeden Einsatz verwalten.</div>`,
      async d=>{await api('user/save',{id:u.id,name:$('#eN',d).value,is_admin:+$('#eR',d).value});loadUsers()})});
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const u=U(b.dataset.p);
    dlg('Passwort zurücksetzen – '+u.name,`<div class="mut">${esc(u.name)} wird abgemeldet und muss bei der nächsten Anmeldung ein eigenes Passwort setzen.</div><label class="mut">Neues Startpasswort (mind. 8 Zeichen)<input id="eP" autocomplete="off" value="${genPw()}"></label>`,
      async d=>{const pw=$('#eP',d).value;await api('user/password',{id:u.id,password:pw});alert('Passwort zurückgesetzt. Bitte das Startpasswort «'+pw+'» an '+u.name+' weitergeben.');loadUsers()},'Zurücksetzen')});
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const u=U(b.dataset.d);
    if(confirm(u.name+' deaktivieren?\n\nDie Person wird abgemeldet, aus einem laufenden Einsatz ausgetragen und kann sich nicht mehr anmelden. Einsatzdaten bleiben erhalten.'))api('user/active',{id:u.id,active:0}).then(loadUsers).catch(fail)});
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>api('user/active',{id:+b.dataset.a,active:1}).then(loadUsers).catch(fail))}
/* ---------- Spezialrollen ---------- */
async function loadRoles(){const el=$('#sR');try{roles=await api('roles')}catch(e){el.innerHTML='<h2>Spezialrollen</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  el.innerHTML=`<h2>Spezialrollen im Einsatz</h2><div class="tw"><table><tbody>${roles.map(r=>`<tr><td><span style="color:${esc(r.color)}">●</span> ${esc(r.name)}${r.is_lead?' <span class="mut">(Einsatzleitung: darf Einsatz verwalten)</span>':''}${r.is_post?' <span class="mut">(Posten: Suchgebiet endet hier)</span>':''}</td><td class="act"><button data-r="${r.id}">Bearbeiten</button></td></tr>`).join('')}</tbody></table></div>
    <h3>Neue Rolle</h3><div class="row"><input id="rn" placeholder="Rollenname" aria-label="Rollenname"><input id="rc" type="color" value="#8888ff" aria-label="Farbe" style="flex:0 0 4rem"><button id="rA">Rolle anlegen</button></div>`;
  $('#rA').onclick=()=>api('role/save',{name:$('#rn').value,color:$('#rc').value}).then(loadRoles).catch(fail);
  el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=roles.find(x=>x.id==b.dataset.r);
    dlg('Rolle bearbeiten',`<label class="mut">Name<input id="rN" value="${esc(r.name)}"></label><label class="mut">Farbe<input id="rC" type="color" value="${esc(r.color)}"></label>
      <label class="chk"><input type="checkbox" id="rL" ${r.is_lead?'checked':''}> Einsatzleitung (darf Einsatz verwalten)</label><label class="chk"><input type="checkbox" id="rP" ${r.is_post?'checked':''}> Sicherungs-/Beobachtungsposten (Suchgebiet endet hier)</label><label class="chk"><input type="checkbox" id="rD"> Rolle deaktivieren</label>`,
      async d=>{const n=$('#rN',d).value.trim();if(!n)throw new Error('Name fehlt');await api('role/save',{id:r.id,name:n,color:$('#rC',d).value,is_lead:$('#rL',d).checked?1:0,is_post:$('#rP',d).checked?1:0,active:$('#rD',d).checked?0:1});loadRoles()})})}
/* ---------- Einsatzstatistik ---------- */
async function loadStats(){const el=$('#stats');try{const r=await api('stats'),t=r.totals,min=x=>x==null?'–':Math.round(x/60)+' min';
  el.innerHTML=`<h2>Einsatzstatistik</h2><div class="mut">Einsätze: ${t.count} (davon Übungen: ${t.exercises}, beendet: ${t.ended}) · Ø Dauer ${min(t.avg_duration)} · Ø Teilnehmende ${t.avg_accepted??'–'} · Ø bis erste Annahme ${min(t.avg_first_accept)} · Ø bis Suchgebiet erreicht ${min(t.avg_first_area)}</div>
    <div class="tw"><table><thead><tr><th>Alarm</th><th>Art</th><th>Meldung</th><th>Dauer</th><th>Angen.</th><th>Abgel.</th><th>1. Annahme</th><th>1. im Gebiet</th><th></th></tr></thead><tbody>${r.incidents.map(x=>`<tr><td>${new Date(x.alarm_at*1000).toLocaleString('de-CH')}</td><td>${x.is_exercise?'<span class="badge">Übung</span>':'Scharf'}</td><td>${esc(x.message)}</td><td>${x.ended_at?min(x.ended_at-x.alarm_at):'läuft'}</td><td>${x.accepted}</td><td>${x.declined}</td><td>${min(x.first_accept==null?null:x.first_accept-x.alarm_at)}</td><td>${min(x.first_area==null?null:x.first_area-x.alarm_at)}</td><td class="act"><button data-l="${x.id}">Log</button></td></tr>`).join('')}</tbody></table></div>`;
  el.querySelectorAll('[data-l]').forEach(b=>b.onclick=async()=>{try{const x=r.incidents.find(x=>x.id==b.dataset.l),l=await api('incident/log&id='+x.id);openBigLog('Einsatzlog – '+x.message,()=>l,false)}catch(e){fail(e)}})}
  catch(e){el.innerHTML='<h2>Einsatzstatistik</h2><div class="mut">Statistik nicht verfügbar: '+esc(e.message)+'</div>'}}
start();
</script></body></html>
