<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Swiftwater Rescue – Verwaltung</title>
<link rel="stylesheet" href="common.css?v=0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
body{min-height:100dvh}
header{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.7rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}header h1{font-size:1.15rem;margin:0;flex:1 1 12rem}
main{max-width:1100px;margin:0 auto;padding:1rem;display:grid;grid-template-columns:minmax(0,1fr);gap:1.2rem} /* minmax: breite Tabellen scrollen in .tw statt die Seite zu verbreitern */
main>section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1rem} /* nur die Abschnitte: Leaflet baut die Kartenauswahl ebenfalls als section (Issue #26) */
h2{margin:0 0 .6rem;font-size:1.1rem}h3{margin:1rem 0 .3rem;font-size:1rem}
.tw{overflow-x:auto}th{text-align:left;padding:.3rem;color:var(--mut);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
tr.off td{opacity:.55}td.act{white-space:nowrap;text-align:right}td.act button{padding:.35rem .6rem;margin:.1rem}
/* Einsatzlog: scharfe Einsätze rot, Übungen blau */
.badge.real{background:var(--alarm)}tr.art-ex td:first-child{border-left:4px solid var(--ex)}tr.art-real td:first-child{border-left:4px solid var(--alarm)}
/* Replay */
#replay{position:fixed;inset:0;z-index:5000;background:var(--bg);display:flex;flex-direction:column}
#rpHead{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.6rem 1rem;border-bottom:1px solid var(--line)}#rpHead h2{margin:0;font-size:1.15rem;flex:1 1 16rem}
#rpBody{flex:1;display:flex;min-height:0;position:relative}#rpMap{flex:1;min-width:0;background:#0c1c25}
#rpSide{width:24rem;overflow:auto;border-left:1px solid var(--line);padding:.6rem}
#rpFoot{display:flex;gap:.8rem;align-items:center;padding:.6rem 1rem;border-top:1px solid var(--line)}#rpTl{flex:1;display:grid;gap:3px}#rpRange{width:100%;padding:0}
#rpSeg{position:relative;height:5px;background:var(--line);border-radius:3px}#rpSeg span{position:absolute;top:0;bottom:0;background:#e05cb0;border-radius:3px} /* aufgezeichnete Zeiträume, Lücken = Pause/aus */
#rpTime{font-variant-numeric:tabular-nums;white-space:nowrap}
.rpl{display:block;width:100%;text-align:left;border:0;border-left:4px solid;border-radius:0;background:none;padding:.35rem .5rem;font-size:.9rem}.rpl:hover{background:var(--panel)}.rpl .t{color:var(--mut);margin-right:.4rem}
.rpp{display:flex;gap:.4rem;align-items:center;font-size:.9rem;padding:.25rem 0;border-bottom:1px solid var(--line)}.rpp i{width:.8rem;height:.8rem;border-radius:50%;flex:0 0 auto}.rpp .nm{flex:1;min-width:0;overflow-wrap:anywhere}.rpp .nm small{display:block;color:var(--mut)}.rpp button{padding:.25rem .45rem;font-size:.8rem}.rpp button[aria-pressed=true]{background:var(--ex);border-color:var(--ex)}
.rpg{font-size:.8rem;font-weight:700;color:var(--mut);margin-top:.5rem}
/* Replay: Anzeige beim Folgen (oben links auf der Karte) */
#rpFollow{position:absolute;top:.6rem;left:3.4rem;z-index:1000;background:var(--ex);color:#fff;border-radius:6px;padding:.2rem .3rem .2rem .7rem;font-size:.9rem;display:flex;gap:.4rem;align-items:center;box-shadow:0 1px 4px #0008;max-width:calc(100% - 4rem)}#rpFollow[hidden]{display:none}#rpFollow button{background:transparent;border:0;color:#fff;padding:.15rem .4rem}
.leaflet-tooltip.rplbl{background:#0f2430e6;color:#fff;border:0;box-shadow:none;font-weight:600;padding:1px 5px}.leaflet-tooltip.rplbl::before{display:none}
@media(max-width:760px){#rpBody{flex-direction:column}#rpSide{width:auto;height:40%;border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<div id="app"></div>
<script src="common.js?v=0"></script>
<script>
/* Verwaltung: nur für die Benutzerrolle Administrator. Die API prüft die Berechtigung bei jedem Aufruf. */
let me=null,users=[],roles=[];
onUnauth=()=>start();
const ROLE_LABEL=u=>u.is_admin?'Administrator':'Einsatzkraft';
async function start(){const a=$('#app');if(!token)return loginView(a,'Swiftwater Rescue – Verwaltung',start);
  try{me=(await api('me')).me}catch(e){if(token)a.innerHTML=`<div class="card"><p>${esc(e.message)}</p></div>`;return}
  if(me.must_change){a.innerHTML='';return pwDialog(true,start)}
  if(!me.is_admin){a.innerHTML=`<div class="card"><h1>Kein Zugriff</h1><p>Die Verwaltung ist nur für Administratoren zugänglich.</p><div class="row"><a class="btn" href="./">Zur Einsatz-App</a><button id="bOut">Abmelden</button></div></div>`;$('#bOut').onclick=()=>{logout();start()};return}
  a.innerHTML=`<header><h1>Swiftwater Rescue – Verwaltung</h1><span class="mut">${esc(me.name)}</span><a class="btn" href="./">Zur Einsatz-App</a><button id="bPw">Passwort ändern</button><button id="bOut">Abmelden</button></header>
    <main><section id="sU"><h2>Benutzer</h2><div class="mut">Wird geladen …</div></section><section id="sM"><h2>Einrückoptionen</h2><div class="mut">Wird geladen …</div></section><section id="sFn"><h2>Funktionen</h2><div class="mut">Wird geladen …</div></section><section id="sR"><h2>Spezialrollen</h2><div class="mut">Wird geladen …</div></section><section id="sX"><h2>Externe Einsatzkräfte</h2><div class="mut">Wird geladen …</div></section><section id="sC"><h2>Koordinaten</h2><div class="mut">Wird geladen …</div></section><section id="sA"><h2>Aufzeichnung</h2><div class="mut">Wird geladen …</div></section><section id="sF"><h2>Flussdistanz</h2><div class="mut">Wird geladen …</div></section><section id="sO"><h2>Gewässerdaten</h2><div class="mut">Wird geladen …</div></section><section id="stats"><h2>Einsatzstatistik und Einsatzlog</h2><div class="mut">Wird geladen …</div></section></main>`;
  $('#bPw').onclick=()=>pwDialog(false);$('#bOut').onclick=()=>{logout();start()};
  loadUsers();loadModes();loadFeat();loadRoles();loadExt();loadCoords();loadRec();loadRd();loadOp();loadStats()}
/* ---------- Benutzer ---------- */
// Startpasswort ohne verwechselbare Zeichen (0/O, 1/l/I)
function genPw(){const c='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint32Array(10));return[...r].map(x=>c[x%c.length]).join('')}
async function loadUsers(){const el=$('#sU');try{users=await api('users')}catch(e){el.innerHTML='<h2>Benutzer</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  el.innerHTML=`<h2>Benutzer (${users.filter(u=>u.active).length} aktiv)</h2><div class="tw"><table><thead><tr><th>Name</th><th>Benutzername</th><th>Benutzerrolle</th><th>Status</th><th></th></tr></thead><tbody>${users.map(u=>{const self=u.id===me.id;
    return`<tr class="${u.active?'':'off'}"><td>${esc(u.name)}${self?' <span class="mut">(du)</span>':''}</td><td>${esc(u.username)}</td><td>${ROLE_LABEL(u)}</td><td>${u.active?'aktiv':'deaktiviert'}${u.must_change?'<br><span class="mut">Passwortwechsel ausstehend</span>':''}${u.exercise_mode?'<br><span class="mut">Übungsmodus an</span>':''}</td>
      <td class="act"><button data-e="${u.id}">Bearbeiten</button>${self?'':`<button data-p="${u.id}">Passwort zurücksetzen</button>${u.active?`<button data-d="${u.id}">Deaktivieren</button>`:`<button data-a="${u.id}">Reaktivieren</button>`}`}</td></tr>`}).join('')}</tbody></table></div>
    <h3>Neuer Benutzer</h3><div class="row"><input id="un" placeholder="Benutzername" autocomplete="off" aria-label="Benutzername"><input id="uf" placeholder="Name" aria-label="Name"><input id="up" placeholder="Startpasswort" autocomplete="off" aria-label="Startpasswort" value="${genPw()}"><select id="ur" aria-label="Benutzerrolle"><option value="0">Einsatzkraft</option><option value="1">Administrator</option></select><button class="pri" id="uA">Benutzer anlegen</button></div>
    <div class="mut">Neue Benutzer müssen das Startpasswort bei der ersten Anmeldung ändern. Deaktivierte Benutzer können sich nicht mehr anmelden, ihre Einsatzdaten bleiben erhalten.</div>`;
  $('#uA').onclick=()=>{const pw=$('#up').value;api('user/save',{username:$('#un').value,name:$('#uf').value,password:pw,is_admin:+$('#ur').value}).then(()=>{alert('Benutzer angelegt. Startpasswort: '+pw);loadUsers()}).catch(fail)};
  const U=id=>users.find(x=>x.id==id);
  el.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const u=U(b.dataset.e),self=u.id===me.id;
    dlg('Benutzer bearbeiten',`<label class="mut">Name<input id="eN" value="${esc(u.name)}"></label><label class="mut">Benutzerrolle<select id="eR" ${self?'disabled':''}><option value="0">Einsatzkraft</option><option value="1" ${u.is_admin?'selected':''}>Administrator</option></select></label>${self?'<div class="mut">Die eigene Benutzerrolle kann nicht geändert werden.</div>':''}<div class="mut">Administratoren haben Zugriff auf diese Verwaltung und dürfen jeden Einsatz verwalten.</div>`,
      async d=>{await api('user/save',{id:u.id,name:$('#eN',d).value,is_admin:+$('#eR',d).value});loadUsers()})});
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const u=U(b.dataset.p);
    dlg('Passwort zurücksetzen – '+u.name,`<div class="mut">${esc(u.name)} wird abgemeldet und muss bei der nächsten Anmeldung ein eigenes Passwort setzen.</div><label class="mut">Neues Startpasswort<input id="eP" autocomplete="off" value="${genPw()}"></label>`,
      async d=>{const pw=$('#eP',d).value;await api('user/password',{id:u.id,password:pw});alert('Passwort zurückgesetzt. Bitte das Startpasswort «'+pw+'» an '+u.name+' weitergeben.');loadUsers()},'Zurücksetzen')});
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const u=U(b.dataset.d);
    if(confirm(u.name+' deaktivieren?\n\nDie Person wird abgemeldet, aus einem laufenden Einsatz ausgetragen und kann sich nicht mehr anmelden. Einsatzdaten bleiben erhalten.'))api('user/active',{id:u.id,active:0}).then(loadUsers).catch(fail)});
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>api('user/active',{id:+b.dataset.a,active:1}).then(loadUsers).catch(fail))}
/* ---------- Einrückoptionen (Auswahl beim Annehmen eines Einsatzes) ---------- */
async function loadModes(){const el=$('#sM');let modes;try{modes=await api('modes')}catch(e){el.innerHTML='<h2>Einrückoptionen</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  el.innerHTML=`<h2>Einrückoptionen</h2><div class="mut">Auswahl beim Annehmen eines Einsatzes. Ohne Standortfreigabe wird der Standort der Person weder geteilt noch auf der Karte angezeigt. Mit «Rechte der Einsatzleitung» darf die Person alles wie die Einsatzleitung, erhält aber keine Spezialrolle (z. B. Koordinator KP Rück).</div>
    <div class="tw"><table><tbody>${modes.map(x=>`<tr class="${x.active?'':'off'}"><td>${esc(x.name)}</td><td>${x.share_location?'Standort wird geteilt':'<b>ohne Standort</b>'}${x.lead_rights?'<br><b>Rechte der Einsatzleitung</b>, keine Spezialrolle':''}${x.counts?'':'<br>zählt nicht bei «Einsatzkräfte»'}</td><td>${x.active?'aktiv':'deaktiviert'}</td><td class="act"><button data-mo="${x.id}">Bearbeiten</button></td></tr>`).join('')}</tbody></table></div>
    <h3>Neue Einrückoption</h3><div class="row"><input id="mn" placeholder="Name, z. B. Anfahrt mit Material" aria-label="Name der Einrückoption"><label class="row" style="align-items:center;flex:0 0 auto;margin:0"><input type="checkbox" id="ms" checked> Standort teilen</label><button id="mA">Option anlegen</button></div>`;
  $('#mA').onclick=()=>api('mode/save',{name:$('#mn').value,share_location:$('#ms').checked?1:0}).then(loadModes).catch(fail);
  el.querySelectorAll('[data-mo]').forEach(b=>b.onclick=()=>{const x=modes.find(y=>y.id==b.dataset.mo);
    dlg('Einrückoption bearbeiten',`<label class="mut">Name<input id="oN" value="${esc(x.name)}"></label><label class="chk"><input type="checkbox" id="oS" ${x.share_location?'checked':''}> Standort teilen</label><label class="chk"><input type="checkbox" id="oL" ${x.lead_rights?'checked':''}> Rechte der Einsatzleitung (ohne Spezialrolle)</label><label class="chk"><input type="checkbox" id="oC" ${x.counts?'checked':''}> Zählt im Zähler am Kartenknopf «Einsatzkräfte»</label><label class="chk"><input type="checkbox" id="oA" ${x.active?'checked':''}> Aktiv (beim Annehmen wählbar)</label><div class="mut">Änderungen gelten für neue Annahmen. Wer bereits mit dieser Option im Einsatz ist, behält sie.</div>`,
      async d=>{await api('mode/save',{id:x.id,name:$('#oN',d).value,share_location:$('#oS',d).checked?1:0,lead_rights:$('#oL',d).checked?1:0,counts:$('#oC',d).checked?1:0,active:$('#oA',d).checked?1:0});loadModes()})})}
/* ---------- Spezialrollen ---------- */
async function loadRoles(){const el=$('#sR');try{roles=await api('roles')}catch(e){el.innerHTML='<h2>Spezialrollen</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  el.innerHTML=`<h2>Spezialrollen im Einsatz</h2><div class="tw"><table><tbody>${roles.map(r=>`<tr><td><span style="color:${esc(r.color)}">●</span> ${esc(r.name)}${r.is_lead?' <span class="mut">(Einsatzleitung: darf Einsatz verwalten)</span>':''}${r.is_post?' <span class="mut">(Posten: Suchgebiet endet hier)</span>':''}${r.can_message||r.is_lead?'':' <span class="mut">(darf keine Nachrichten senden)</span>'}</td><td class="act"><button data-r="${r.id}">Bearbeiten</button></td></tr>`).join('')}</tbody></table></div>
    <h3>Nachrichten senden</h3><label class="row" style="align-items:center"><input type="checkbox" id="msgNoRole" disabled> <span>Personen ohne Spezialrolle dürfen Nachrichten senden</span></label>
    <label class="row" style="align-items:center"><input type="checkbox" id="msgReadAll" disabled> <span>Personen, die den Einsatz nicht angenommen haben, dürfen Nachrichten lesen (ohne Benachrichtigung, ohne Senden)</span></label>
    <div class="mut">Pro Spezialrolle unter «Bearbeiten» einstellbar. Einsatzleitung, Administratoren und wer den Einsatz gestartet hat, dürfen immer senden. Lesen dürfen alle, die den Einsatz angenommen haben, mit der Einstellung oben auch alle übrigen.</div>
    <h3>Neue Rolle</h3><div class="row"><input id="rn" placeholder="Rollenname" aria-label="Rollenname"><input id="rc" type="color" value="#8888ff" aria-label="Farbe" style="flex:0 0 4rem"><button id="rA">Rolle anlegen</button></div>`;
  $('#rA').onclick=()=>api('role/save',{name:$('#rn').value,color:$('#rc').value}).then(loadRoles).catch(fail);
  el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=roles.find(x=>x.id==b.dataset.r);
    dlg('Rolle bearbeiten',`<label class="mut">Name<input id="rN" value="${esc(r.name)}"></label><label class="mut">Farbe<input id="rC" type="color" value="${esc(r.color)}"></label>
      <label class="chk"><input type="checkbox" id="rL" ${r.is_lead?'checked':''}> Einsatzleitung (darf Einsatz verwalten)</label><label class="chk"><input type="checkbox" id="rP" ${r.is_post?'checked':''}> Sicherungs-/Beobachtungsposten (Suchgebiet endet hier)</label><label class="chk"><input type="checkbox" id="rM" ${r.can_message?'checked':''}> Darf Nachrichten senden</label><label class="chk"><input type="checkbox" id="rD"> Rolle deaktivieren</label>`,
      async d=>{const n=$('#rN',d).value.trim();if(!n)throw new Error('Name fehlt');await api('role/save',{id:r.id,name:n,color:$('#rC',d).value,is_lead:$('#rL',d).checked?1:0,is_post:$('#rP',d).checked?1:0,can_message:$('#rM',d).checked?1:0,active:$('#rD',d).checked?0:1});loadRoles()})});
  // Einstellung für Personen ohne Spezialrolle, wird sofort gespeichert
  api('settings').then(s=>[['#msgNoRole','msg_no_role'],['#msgReadAll','msg_read_all']].forEach(([id,k])=>{const c=$(id);c.checked=!!s[k];c.disabled=false;
    c.onchange=()=>{c.disabled=true;api('settings/save',{[k]:c.checked?1:0}).catch(e=>{c.checked=!c.checked;fail(e)}).finally(()=>{c.disabled=false})}})).catch(fail)}
/* ---------- Vorlagen für externe Einsatzkräfte (Issue #39) ---------- */
// Die Einsatzleitung erfasst damit Externe ohne App-Konto (z. B. Posten der Feuerwehr) mit wenigen Klicks; ohne Standort wird er beim Erfassen gewählt
async function loadExt(){const el=$('#sX');let xs,rs;try{[xs,rs]=await Promise.all([api('ext_templates'),api('roles')])}catch(e){el.innerHTML='<h2>Externe Einsatzkräfte</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  const cs=me&&(me.coord_sys&&me.coord_sys!=='none'?me.coord_sys:me.coord_default)||'lv95',rn=id=>(rs.find(r=>r.id===id)||{}).name;
  el.innerHTML=`<h2>Externe Einsatzkräfte</h2><div class="mut">Vorlagen für Einsatzkräfte ohne App-Konto mit festem Standort, z. B. Sicherungs- und Beobachtungsposten anderer Organisationen. Die Einsatzleitung erfasst sie im Einsatz über den Kartenknopf «Einsatzkräfte» und wählt dort eine Vorlage. Mit einer Posten-Rolle endet das Suchgebiet am Standort.</div>
    ${xs.length?`<div class="tw"><table><thead><tr><th>Name</th><th>Kürzel / Farbe</th><th>Spezialrolle</th><th>Standort</th><th></th></tr></thead><tbody>${xs.map(x=>`<tr${x.active?'':' class="mut"'}><td>${esc(x.name)}${x.descr?`<div class="mut">${esc(x.descr)}</div>`:''}${x.active?'':' <span class="mut">(deaktiviert)</span>'}</td><td>${x.color?`<span style="display:inline-block;width:.9em;height:.9em;border-radius:3px;vertical-align:-.1em;background:${esc(x.color)}"></span> `:''}${esc(x.abbr||'')}${x.abbr||x.color?'':'–'}</td><td>${esc(rn(x.role_id)||'–')}</td><td>${x.lat!=null?esc(fmtC(x.lat,x.lon,cs)):'<span class="mut">beim Erfassen wählen</span>'}</td><td class="act"><button data-x="${x.id}">Bearbeiten</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="mut">Noch keine Vorlagen.</div>'}
    <div class="row"><button id="xA">Vorlage anlegen</button></div>`;
  const edit=x=>dlg(x.id?'Vorlage bearbeiten':'Neue Vorlage',`<label class="mut">Name<input id="xN" maxlength="80" placeholder="z. B. Feuerwehr Bremgarten, Posten Brücke" value="${esc(x.name||'')}"></label><label class="mut">Beschreibung (Organisation, Funkkanal, Telefon …)<textarea id="xD" rows="3" maxlength="500">${esc(x.descr||'')}</textarea></label>
      <label class="mut">Spezialrolle<select id="xR"><option value="">Keine Spezialrolle</option>${rs.map(r=>`<option value="${r.id}" ${r.id===x.role_id?'selected':''}>${esc(r.name)}${r.is_post?' (Posten)':''}</option>`).join('')}</select></label>${extStyleFields(x)}
      <label class="mut">Standort (optional)<input id="xL" placeholder="LV95 2'660'000 / 1'250'000 oder WGS84 47.38, 8.05" value="${x.lat!=null?esc(fmtC(x.lat,x.lon,'wgs84')):''}"></label><div class="mut" id="xLi">LV95, LV03 oder WGS84 dezimal. Leer = Standort beim Erfassen auf der Karte wählen.</div>
      ${x.id?`<label class="chk"><input type="checkbox" id="xAc" ${x.active?'checked':''}> Aktiv (im Einsatz wählbar)</label>`:''}`,
    async d=>{const v=$('#xL',d).value.trim(),p=v?parseC(v):null;if(v&&!p)throw new Error('Standort nicht erkannt. Beispiele: 2660000 / 1250000 (LV95) oder 47.38, 8.05 (WGS84).');
      await api('ext_template/save',{id:x.id,name:$('#xN',d).value,descr:$('#xD',d).value,role_id:+$('#xR',d).value||null,...extStyleVal(d),lat:p?+p.lat.toFixed(7):'',lon:p?+p.lon.toFixed(7):'',active:$('#xAc',d)?($('#xAc',d).checked?1:0):1});loadExt()});
  // Vorschau der erkannten Koordinaten während der Eingabe
  const prev=d=>{const i=$('#xL',d);i.oninput=()=>{const p=parseC(i.value);$('#xLi',d).textContent=!i.value.trim()?'LV95, LV03 oder WGS84 dezimal. Leer = Standort beim Erfassen auf der Karte wählen.':p?'Erkannt: '+fmtC(p.lat,p.lon,'lv95')+' (LV95) · '+fmtC(p.lat,p.lon,'wgs84')+' (WGS84)':'Nicht erkannt'}};
  $('#xA').onclick=()=>prev(extStyleBind(edit({})));el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>prev(extStyleBind(edit(xs.find(x=>x.id==b.dataset.x)))))}
/* ---------- Koordinatensystem (Standard für alle, pro Person in der Einsatz-App unter «Konto» übersteuerbar) ---------- */
async function loadCoords(){const el=$('#sC');let s;try{s=await api('settings')}catch(e){el.innerHTML='<h2>Koordinaten</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  el.innerHTML=`<h2>Koordinaten</h2><label class="mut">Standard-Koordinatensystem für die Anzeige<select id="cS">${Object.entries(COORD_SYS).map(([k,v])=>`<option value="${k}" ${k===s.coord_sys?'selected':''}>${esc(v)}</option>`).join('')}</select></label>
    <div class="mut">Gilt für alle, die in der Einsatz-App unter «Konto» nichts anderes gewählt haben. Beispiel Brugg AG: ${esc(fmtC(47.4815,8.208,s.coord_sys))}</div>`;
  $('#cS').onchange=e=>{const v=e.target.value;e.target.disabled=true;api('settings/save',{coord_sys:v}).then(loadCoords).catch(x=>{fail(x);loadCoords()})}}
/* ---------- Aufzeichnung: Vorauswahl beim Einsatzstart je Art, wird sofort gespeichert ---------- */
async function loadRec(){const el=$('#sA');let s;try{s=await api('settings')}catch(e){el.innerHTML='<h2>Aufzeichnung</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  el.innerHTML=`<h2>Aufzeichnung</h2><div class="mut">Beim Starten eines Einsatzes ist «Aufzeichnen» (Replay in der Verwaltung) vorausgewählt für:</div>
    <label class="row" style="align-items:center"><input type="checkbox" id="recR"> <span>Scharfe Einsätze</span></label><label class="row" style="align-items:center"><input type="checkbox" id="recE"> <span>Übungen</span></label>
    <div class="mut">Wer den Einsatz startet, kann die Vorauswahl ändern. Die Einsatzleitung kann die Aufzeichnung auch später starten, pausieren oder beenden. Die Einsatz-App übernimmt die Einstellung beim nächsten Laden.</div>`;
  [['#recR','rec_real'],['#recE','rec_ex']].forEach(([id,k])=>{const c=$(id);c.checked=!!s[k];
    c.onchange=()=>{c.disabled=true;api('settings/save',{[k]:c.checked?1:0}).catch(e=>{c.checked=!c.checked;fail(e)}).finally(()=>{c.disabled=false})}})}
/* ---------- Funktionen (Issue #35): je für scharfe Einsätze und Übungen ein- oder ausschalten ---------- */
// Liste und Bezeichnungen kommen vom Server (FEATURES in api/index.php); gespeichert werden die ausgeschalteten je Art
async function loadFeat(){const el=$('#sFn');let s;try{s=await api('settings')}catch(e){el.innerHTML='<h2>Funktionen</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}

  el.innerHTML=`<h2>Funktionen</h2><div class="mut">Ausgeschaltete Funktionen erscheinen in der Einsatz-App nicht (Kartenknopf, Fenster, Kartenebene, Menü), und der Server lehnt sie ab. Die Einstellung gilt sofort, auch im laufenden Einsatz. Bereits erfasste Daten bleiben erhalten (Einsatzlog, Replay). Beim Ausschalten endet eine laufende Aufzeichnung, und der Link der öffentlichen Ansicht wird ungültig.</div>
    <div class="tw"><table><thead><tr><th>Funktion</th><th>Scharfe Einsätze</th><th>Übungen</th></tr></thead><tbody>${fs.map(f=>`<tr><td>${esc(f.name)}</td>${['real','ex'].map(t=>`<td><input type="checkbox" data-fk="${esc(f.k)}" data-ft="${t}" ${f[t]?'checked':''} aria-label="${esc(f.name)}: ${t==='ex'?'Übungen':'Scharfe Einsätze'}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  el.onchange=e=>{const c=e.target;if(!c.dataset.fk)return;const all=[...el.querySelectorAll('[data-fk]')],off={real:[],ex:[]};
    all.forEach(x=>{if(!x.checked)off[x.dataset.ft].push(x.dataset.fk)});all.forEach(x=>x.disabled=true);

/* ---------- Werkzeug Flussdistanz: angezeigte Vergleichsgeschwindigkeiten ---------- */

    <div class="row" style="align-items:end"><label class="mut">Geschwindigkeiten in km/h, durch Komma getrennt (1 bis 6 Werte)<input id="rdS" value="${esc(s.rd_speeds.join(', '))}" inputmode="decimal"></label><button id="rdSv">Speichern</button></div>`;

/* ---------- Gewässerdaten: Haltedauer des Overpass-Caches und Overpass-Server (Reihenfolge) ---------- */
let opUrls=[],opDef=[];
async function loadOp(){const el=$('#sO');let s;try{s=await api('settings')}catch(e){el.innerHTML='<h2>Gewässerdaten</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  opUrls=[...s.overpass_urls];opDef=s.overpass_default;
  el.innerHTML=`<h2>Gewässerdaten</h2><div class="mut">Das Gewässernetz für Suchgebiet und Flussdistanz (OpenStreetMap via Overpass) holt der Server und speichert es zwischen. Gleiche Abfragen, z. B. das Suchgebiet auf allen Geräten eines Einsatzes, gehen so nur einmal zu Overpass. Ist Overpass nicht erreichbar, verwendet der Server ältere Daten (bis 7 Tage).</div>
    <div class="row" style="align-items:end"><label class="mut">Haltedauer in Minuten (0 = nicht zwischenspeichern)<input id="opT" type="number" min="0" max="10080" step="1" value="${s.overpass_ttl}"></label><button id="opSv">Speichern</button></div>
    <h3>Overpass-Server</h3><div class="mut">Der Server fragt sie in dieser Reihenfolge ab (je 15 s), bis einer antwortet. Antwortet keiner, fragt das Gerät dieselben Server direkt (je 30 s).</div>
    <div id="opList"></div>
    <div class="row"><input id="opN" placeholder="https://…/api/interpreter" aria-label="Adresse eines Overpass-Servers" inputmode="url"><button id="opA">Hinzufügen</button></div>
    <div class="row"><button id="opUs" class="pri">Server speichern</button><button id="opUd">Standard wiederherstellen</button></div>`;
  $('#opSv').onclick=()=>api('settings/save',{overpass_ttl:$('#opT').value}).then(()=>{alert('Gespeichert.');loadOp()}).catch(fail);
  $('#opA').onclick=()=>{const u=$('#opN').value.trim();if(!/^https:\/\/[^/?#@]+\//i.test(u))return alert('Bitte eine vollständige https-Adresse angeben, z. B. https://overpass-api.de/api/interpreter');
    if(!opUrls.includes(u))opUrls.push(u);$('#opN').value='';drawOpList()};
  $('#opN').onkeydown=e=>{if(e.key==='Enter')$('#opA').click()};
  $('#opUs').onclick=()=>{if(!opUrls.length)return alert('Mindestens ein Server ist nötig. «Standard wiederherstellen» setzt die vorgegebene Liste.');
    api('settings/save',{overpass_urls:opUrls}).then(()=>{alert('Gespeichert. Gilt ab der nächsten Abfrage.');loadOp()}).catch(fail)};
  $('#opUd').onclick=()=>{if(confirm('Vorgegebene Liste wiederherstellen?\n\n'+opDef.join('\n')))api('settings/save',{overpass_urls:[]}).then(()=>{alert('Gespeichert.');loadOp()}).catch(fail)};
  drawOpList()}
function drawOpList(){const n=opUrls.length,el=$('#opList');
  el.innerHTML=`<div class="tw"><table><tbody>${opUrls.map((u,k)=>`<tr><td style="width:2rem">${k+1}.</td><td style="overflow-wrap:anywhere">${esc(u)}</td><td class="act"><button data-op="up" data-k="${k}" ${k?'':'disabled'} aria-label="Nach oben" title="Früher abfragen">↑</button><button data-op="dn" data-k="${k}" ${k<n-1?'':'disabled'} aria-label="Nach unten" title="Später abfragen">↓</button><button data-op="rm" data-k="${k}" ${n>1?'':'disabled'} aria-label="Entfernen" title="Entfernen">✕</button></td></tr>`).join('')}</tbody></table></div>${JSON.stringify(opUrls)!==JSON.stringify(opDef)?'':'<div class="mut">Vorgegebene Liste.</div>'}`;
  el.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,o=b.dataset.op;
    if(o==='rm')opUrls.splice(k,1);else{const j=o==='up'?k-1:k+1;[opUrls[k],opUrls[j]]=[opUrls[j],opUrls[k]]}drawOpList()})}
/* ---------- Einsatzstatistik und Einsatzlog (getrennt nach scharfen Einsätzen und Übungen) ---------- */
const ARTS={all:'Alle',real:'Scharfe Einsätze',ex:'Übungen'};
let statsData=null,statsF=(()=>{try{return localStorage.getItem('sw_statsf')||'all'}catch(e){return'all'}})(); // Filter pro Gerät gemerkt
const isArt=(x,f)=>f==='all'||(f==='ex')===!!x.is_exercise;
async function loadStats(){const el=$('#stats');try{statsData=await api('stats')}catch(e){el.innerHTML='<h2>Einsatzstatistik</h2><div class="mut">Statistik nicht verfügbar: '+esc(e.message)+'</div>';return}renderStats()}
function renderStats(){const el=$('#stats'),all=statsData.incidents,rows=all.filter(x=>isArt(x,statsF)),min=x=>x==null?'–':Math.round(x/60)+' min';
  const av=a=>{a=a.filter(x=>x!=null);return a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length*10)/10:null};

  el.innerHTML=`<h2>Einsatzstatistik und Einsatzlog</h2><div class="row" style="align-items:center"><label class="mut" style="flex:0 0 auto">Anzeigen <select id="stF">${Object.entries(ARTS).map(([k,v])=>`<option value="${k}" ${k===statsF?'selected':''}>${v}</option>`).join('')}</select></label></div>
    ${statsF!=='ex'?sum('real','Scharfe Einsätze'):''}${statsF!=='real'?sum('ex','Übungen'):''}
    <div class="tw"><table><thead><tr><th>Alarm</th><th>Art</th><th>Meldung</th><th>Dauer</th><th>Angen.</th><th>Abgel.</th><th>1. Annahme</th><th>1. im Gebiet</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr class="art-${x.is_exercise?'ex':'real'}"><td>${new Date(x.alarm_at*1000).toLocaleString('de-CH')}</td><td>${x.is_exercise?'<span class="badge">Übung</span>':'<span class="badge real">Einsatz</span>'}${x.record===1?'<br><span class="mut">● Aufzeichnung läuft</span>':x.record===2?'<br><span class="mut">❚❚ Aufzeichnung pausiert</span>':x.recorded?'<br><span class="mut">● aufgezeichnet</span>':''}</td><td>${esc(x.message)}</td><td>${x.ended_at?min(x.ended_at-x.alarm_at):'läuft'}</td><td>${x.accepted}</td><td>${x.declined}</td><td>${min(x.first_accept==null?null:x.first_accept-x.alarm_at)}</td><td>${min(x.first_area==null?null:x.first_area-x.alarm_at)}</td><td class="act"><button data-l="${x.id}">Log</button>${x.recorded?`<button data-rp="${x.id}">Replay</button><button data-rpd="${x.id}" title="Aufzeichnung dieses Einsatzes löschen">Aufzeichnung löschen</button>`:''}</td></tr>`).join('')||`<tr><td colspan="9" class="mut">Keine ${statsF==='ex'?'Übungen':statsF==='real'?'scharfen Einsätze':'Einsätze'}</td></tr>`}</tbody></table></div>`;
  $('#stF').onchange=e=>{statsF=e.target.value;try{localStorage.setItem('sw_statsf',statsF)}catch(_){}renderStats()};
  const X=id=>all.find(x=>x.id==id);
  el.querySelectorAll('[data-l]').forEach(b=>b.onclick=async()=>{try{const x=X(b.dataset.l),l=await api('incident/log&id='+x.id);openBigLog((x.is_exercise?'Übungslog – ':'Einsatzlog – ')+x.message,()=>l,false)}catch(e){fail(e)}});
  el.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>openReplay(+b.dataset.rp));
  el.querySelectorAll('[data-rpd]').forEach(b=>b.onclick=()=>{const x=X(b.dataset.rpd);
    if(confirm(`Aufzeichnung von «${x.message}» löschen?\n\nDie Standortverläufe werden endgültig gelöscht, das Replay ist danach nicht mehr möglich. Einsatzlog, Nachrichten, Positionen und Rettlinge bleiben erhalten.${x.ended_at?'':'\n\nDer Einsatz läuft noch: die Aufzeichnung wird damit beendet.'}`))
      api('incident/replay/delete',{id:x.id}).then(loadStats).catch(fail)})}
/* ---------- Replay eines aufgezeichneten Einsatzes ---------- */
// Zeitachse aus den gespeicherten Daten: Standortverläufe (track), Rettlinge (rtrack, created/removed/rescued_at), Positionen & Bereiche (created/removed), Nachrichten-Markierungen (created/unmarked), Log
let rp=null;
const TRAILS=[[-1,'Spur: ganzer Verlauf'],[3600,'Spur: letzte 60 min'],[1800,'Spur: letzte 30 min'],[900,'Spur: letzte 15 min'],[600,'Spur: letzte 10 min'],[300,'Spur: letzte 5 min'],[120,'Spur: letzte 2 min'],[0,'Keine Spur']];
const trailWin=()=>{let v=null;try{v=localStorage.getItem('sw_rptrail')}catch(e){}return TRAILS.some(x=>String(x[0])===v)?+v:-1}; // pro Gerät gemerkt
const GAP_S=120; // längere Lücken zwischen zwei Standortmeldungen nicht interpolieren, Person gilt dann als «letzter Standort»
const durT=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const lastIdx=(a,t)=>{let lo=0,hi=a.length-1,r=-1;while(lo<=hi){const m=(lo+hi)>>1;if(a[m][1]<=t){r=m;lo=m+1}else hi=m-1}return r}; // letzter Eintrag mit ts ≤ t
async function openReplay(id){let d;try{d=await api('incident/replay&id='+id)}catch(e){return fail(e)}
  closeReplay();const i=d.incident,o=document.createElement('div');o.id='replay';o.setAttribute('role','dialog');o.setAttribute('aria-label','Replay');
  o.innerHTML=`<div id="rpHead"><h2>${i.is_exercise?'<span class="badge">Übung</span>':'<span class="badge real">Einsatz</span>'} Replay – ${esc(i.message)}</h2><button id="rpPlay" class="pri">▶ Abspielen</button><select id="rpSpd" aria-label="Geschwindigkeit">${[1,5,10,30,60,120].map(v=>`<option value="${v}" ${v===30?'selected':''}>${v}× schneller</option>`).join('')}</select><select id="rpTrail" aria-label="Spurlänge">${TRAILS.map(([v,l])=>`<option value="${v}" ${v===trailWin()?'selected':''}>${l}</option>`).join('')}</select><button id="rpX">Schliessen</button></div>
    <div id="rpBody"><div id="rpMap"></div><div id="rpFollow" hidden><span></span><button id="rpUnf" aria-label="Folgen beenden" title="Folgen beenden">✕</button></div><aside id="rpSide"><div id="rpInfo"></div><h3 id="rpPH"></h3><div id="rpPeople"></div><h3>Einsatzlog bis zu diesem Zeitpunkt</h3><div id="rpLog"></div></aside></div>
    <div id="rpFoot"><span id="rpTime"></span><div id="rpTl"><input type="range" id="rpRange" aria-label="Zeitpunkt im Einsatz"><div id="rpSeg" title="Aufgezeichnete Zeiträume (Lücken: pausiert oder beendet)"></div></div><span id="rpEnd" class="mut"></span></div>`;
  document.body.appendChild(o);
  // Zeitraum: Alarmeingang bis Einsatzende (läuft der Einsatz noch: bis jetzt)
  const tr=d.track,t0=tr.length?Math.min(i.alarm_at,tr[0][1]):i.alarm_at,t1=Math.max(i.ended_at||d.now,tr.length?tr[tr.length-1][1]:0,t0+1); // track ist nach Zeit sortiert
  // PLS des Einsatzes und eigene PLS der Rettlinge (Issue #24, Stand Einsatzende)
  const pls=[...(i.lat!=null?[[i.lat,i.lon,'PLS']]:[]),...d.rescuees.filter(r=>r.pls_lat!=null&&!r.removed).map(r=>[r.pls_lat,r.pls_lon,'PLS '+r.name])];
  const map=L.map('rpMap',{zoomControl:true}).setView(pls.length?pls[0]:[46.8,8.2],pls.length?14:8),bases={};
  Object.values(MAP_PROVIDERS).forEach(P=>bases[P.label]=L.tileLayer(P.url,{attribution:P.attr,maxZoom:P.maxZoom}));
  let sv=null;try{sv=localStorage.getItem('sw_base')}catch(e){}bases[(MAP_PROVIDERS[sv]||MAP_PROVIDERS[DEFAULT_BASE]).label].addTo(map);L.control.layers(bases,null,{position:'topright'}).addTo(map);
  pls.forEach(([la,lo,t])=>L.circleMarker([la,lo],{radius:9,color:'#fff',weight:2,fillColor:'#ff4d2e',fillOpacity:1}).bindTooltip(esc(t),{permanent:true,direction:'right',className:'rplbl'}).addTo(map));
  // Personen: Verlauf je Person, Farbe der Spezialrolle (Stand Einsatzende)
  // Aufgezeichnete Zeiträume [start, stop]; ausserhalb (Pause/aus) keine Standorte, Spuren und Interpolation enden dort
  const per=d.periods.map(p=>[p.start,p.stop??t1]),perIdx=ts=>per.length?per.findIndex(p=>p[0]<=ts&&ts<=p[1]):0;
  const people=d.participants.map(p=>{const pts=d.track.filter(q=>q[0]===p.user_id);return{...p,col:p.color||'#cfd8dc',pts,per:pts.map(q=>perIdx(q[1]))}});
  const trailL=L.layerGroup().addTo(map),dynL=L.layerGroup().addTo(map),poiL=L.layerGroup().addTo(map);
  people.forEach(p=>{p.line=L.polyline([],{color:p.col,weight:3,opacity:.75}).addTo(trailL);
    p.mk=L.circleMarker([0,0],{radius:8,color:'#0f2430',weight:2,fillColor:p.col,fillOpacity:1}).bindTooltip(esc(p.name),{permanent:true,direction:'right',offset:[8,0],className:'rplbl'})});
  const rtr={};d.rtrack.forEach(q=>(rtr[q[0]]=rtr[q[0]]||[]).push(q));
  const all=[...pls.map(p=>[p[0],p[1]]),...d.track.map(q=>[q[2],q[3]]),...d.rtrack.map(q=>[q[2],q[3]]),...d.pois.flatMap(p=>p.pts),...(d.externals||[]).map(e=>[e.lat,e.lon])];

  rp={d,map,t:t0,t0,t1,play:false,timer:null,last:0,poiKey:null,logN:-1,people,rtr,dynL,poiL,trailL,perIdx,follow:null,pKey:null};

  map.on('dragstart',()=>{if(rp&&rp.follow!=null)rpFollow(null)});$('#rpUnf').onclick=()=>rpFollow(null);
  $('#rpPeople').onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=rp.people.find(x=>x.user_id===+(b.dataset.c||b.dataset.f));if(!p)return;
    if(b.dataset.c){rpFollow(null);if(p.ll)map.panTo(p.ll)}else rpFollow(rp.follow===p.user_id?null:p.user_id)};
  const R=$('#rpRange');R.min=t0;R.max=t1;R.step=1;R.value=t0;R.oninput=()=>seek(+R.value);
  $('#rpSeg').innerHTML=per.map(([a,b])=>`<span style="left:${(a-t0)/(t1-t0)*100}%;width:${Math.max(.3,(b-a)/(t1-t0)*100)}%"></span>`).join('');
  $('#rpEnd').textContent=durT(t1-i.alarm_at)+(i.ended_at?'':' (läuft)');
  $('#rpPlay').onclick=()=>playReplay(!rp.play);$('#rpX').onclick=closeReplay;
  $('#rpTrail').onchange=e=>{try{localStorage.setItem('sw_rptrail',e.target.value)}catch(_){}drawReplay()};
  $('#rpLog').onclick=e=>{const b=e.target.closest('[data-ts]');if(b)seek(+b.dataset.ts)};
  if(!d.track.length)$('#rpInfo').insertAdjacentHTML('afterend','<div class="mut">Keine Standortmeldungen aufgezeichnet.</div>');
  drawReplay()}
function closeReplay(){if(!rp)return;clearInterval(rp.timer);rp.map.remove();rp=null;const o=$('#replay');if(o)o.remove()}
function playReplay(on){if(!rp)return;if(on&&rp.t>=rp.t1)rp.t=rp.t0;rp.play=on;$('#rpPlay').textContent=on?'❚❚ Pause':'▶ Abspielen';clearInterval(rp.timer);
  if(on){rp.last=performance.now();rp.timer=setInterval(()=>{const n=performance.now(),dt=(n-rp.last)/1000;rp.last=n;rp.t=Math.min(rp.t1,rp.t+dt*+$('#rpSpd').value);if(rp.t>=rp.t1)playReplay(false);drawReplay()},200)}}
function rpFollow(id){rp.follow=id;rp.pKey=null;drawReplay()}
function seek(t){if(!rp)return;rp.t=Math.max(rp.t0,Math.min(rp.t1,t));drawReplay()}
// Escape schliesst, Leertaste spielt ab/pausiert (nicht auf Knöpfen/Reglern, die werten sie selbst aus)
document.addEventListener('keydown',e=>{if(!rp)return;if(e.key==='Escape')return closeReplay();
  if(e.key===' '&&!e.target.closest('input,textarea,select,button')){e.preventDefault();playReplay(!rp.play)}});
function drawReplay(){const{d,t}=rp,i=d.incident,on=(a,b)=>a!=null&&a<=t&&(b==null||t<b);
  $('#rpRange').value=Math.floor(t);$('#rpTime').textContent=new Date(t*1000).toLocaleString('de-CH')+' · T+'+durT(t-i.alarm_at);
  // Personen: Position zum Zeitpunkt t (zwischen zwei Meldungen interpoliert), Spur bis t
  const info=[];
  const pi=rp.perIdx(t),rec=pi>=0; // zum Zeitpunkt t aufgezeichnet?
  // Spur bis Punkt k, je aufgezeichnetem Zeitraum ein eigenes Teilstück (keine Linie über Pausen)
  // Spurlänge: -1 = ganze Spur, 0 = keine, sonst nur Meldungen der letzten n Sekunden vor t
  const win=+$('#rpTrail').value,from=win<0?-Infinity:t-win;
  const trail=(p,k,ll)=>{const s=[];if(!win)return s;let j0=0;while(j0<=k&&p.pts[j0][1]<from)j0++;
    for(let j=j0;j<=k;j++){if(j===j0||p.per[j]!==p.per[j-1])s.push([]);s[s.length-1].push([p.pts[j][2],p.pts[j][3]])}if(ll&&s.length)s[s.length-1].push(ll);return s};
  rp.people.forEach(p=>{const k=lastIdx(p.pts,t),here=rec&&k>=0&&p.per[k]===pi&&(p.left_at==null||t<p.left_at);p.ll=null;
    if(!here){rp.dynL.removeLayer(p.mk);p.line.setLatLngs(trail(p,k));if(on(p.joined,p.left_at))info.push([p,rec?'kein Standort':'nicht aufgezeichnet']);return}
    const a=p.pts[k],b=p.pts[k+1];let ll=[a[2],a[3]],age=t-a[1];
    if(b&&p.per[k+1]===pi&&b[1]-a[1]<=GAP_S){const f=(t-a[1])/(b[1]-a[1]);ll=[a[2]+(b[2]-a[2])*f,a[3]+(b[3]-a[3])*f];age=0}
    p.ll=ll;p.mk.setLatLng(ll).setStyle({fillOpacity:age>GAP_S?.45:1});rp.dynL.addLayer(p.mk);
    p.line.setLatLngs(trail(p,k,ll));info.push([p,age>GAP_S?'letzte Meldung vor '+durT(age):'Standort aktuell'])});
  // Positionen & Bereiche, Rettlinge und Nachrichten-Markierungen: nur neu zeichnen, wenn sich der sichtbare Bestand ändert
  const pois=d.pois.filter(p=>on(p.created,p.removed)),marks=d.marks.filter(m=>m.created<=t&&(m.mark||(m.unmarked!=null&&t<m.unmarked)));
  const res=d.rescuees.filter(r=>on(r.created,r.removed)).map(r=>{const tr=rp.rtr[r.id]||[],k=lastIdx(tr,t),pos=k>=0?[tr[k][2],tr[k][3]]:!tr.length&&on(r.loc_at)?[r.lat,r.lon]:null;return{...r,pos,ok:on(r.rescued_at)}});
  // externe Einsatzkräfte (Issue #39): Standort und Spezialrolle mit Stand Einsatzende, sichtbar vom Erfassen bis zum Entfernen
  const ext=(d.externals||[]).filter(e=>on(e.created,e.removed));
  const key=JSON.stringify([pois.map(p=>p.id),marks.map(m=>m.id),res.map(r=>[r.id,r.pos,r.ok]),ext.map(e=>e.id)]);
  if(key!==rp.poiKey){rp.poiKey=key;rp.poiL.clearLayers();
    pois.forEach(p=>{const l=p.kind==='area'?L.polygon(p.pts,{color:p.color,weight:2,fillOpacity:.15}):L.circleMarker(p.pts[0],{radius:7,color:'#fff',weight:2,fillColor:p.color,fillOpacity:1});l.bindTooltip(esc(p.name),{permanent:true,direction:p.kind==='area'?'center':'right',className:'rplbl'}).addTo(rp.poiL)});
    marks.forEach(m=>L.circleMarker([m.mark_lat,m.mark_lon],{radius:6,color:'#0f2430',weight:2,fillColor:'#2ee6d6',fillOpacity:1}).bindTooltip(esc((m.name||'')+': '+m.text.slice(0,60))).addTo(rp.poiL));
    ext.forEach(e=>{const rc=(roles.find(r=>r.id===e.role_id)||{}).color;return L.circleMarker([e.lat,e.lon],{radius:8,color:e.color&&rc?rc:'#fff',weight:e.color&&rc?3:2,dashArray:'3',fillColor:e.color||rc||'#cfd8dc',fillOpacity:1}).bindTooltip(esc(e.name)+' (extern)',{permanent:true,direction:'right',offset:[8,0],className:'rplbl'}).addTo(rp.poiL)});
    res.filter(r=>r.pos).forEach(r=>L.circleMarker(r.pos,{radius:9,color:'#fff',weight:2,fillColor:r.ok?'#35c27a':'#ff9f1c',fillOpacity:1}).bindTooltip((r.ok?'✓ ':'R ')+esc(r.name),{permanent:true,direction:'right',offset:[8,0],className:'rplbl'}).addTo(rp.poiL))}
  const fl=d.flow.filter(f=>f.ts<=t).pop();
  $('#rpInfo').innerHTML=`<h3 style="margin-top:0">Lage</h3>${rec?'':'<div><b>Aufzeichnung zu diesem Zeitpunkt pausiert oder aus</b> – keine Standorte der Einsatzkräfte</div>'}<div class="mut">${fl?esc(fl.text.replace(/^setzt die /,'')):'Fliessgeschwindigkeit nicht gesetzt'}</div>
    ${ext.length?`<div class="mut">Externe Einsatzkräfte: ${ext.map(e=>esc(e.name)).join(', ')}</div>`:''}<div class="mut">Rettlinge: ${res.length?res.map(r=>esc(r.name)+' – '+(r.ok?'gerettet':r.pos?'Standort bekannt':'vermisst')).join(', '):'keine erfasst'}</div>
`;
  rpPeople(info);
  // Log: nur Einträge bis t, neueste zuerst; Klick springt zum Zeitpunkt
  const lg=d.log.filter(x=>x.ts<=t);if(lg.length!==rp.logN){rp.logN=lg.length;
    $('#rpLog').innerHTML=lg.reverse().map(x=>`<button class="rpl" data-ts="${x.ts}" style="border-left-color:${KIND_COL[x.kind]||'#888'}"><span class="t">${fmtT(x.ts)}</span><b>${esc(x.name||'System')}</b> ${esc(x.text)}</button>`).join('')||'<div class="mut">Noch keine Einträge</div>'}}
// Einsatzkräfte im Replay: nach Spezialrolle gruppiert (Reihenfolge wie in der Verwaltung, ohne Rolle zuletzt), mit «Zentrieren» und «Folgen».
// Die Liste wird nur neu aufgebaut, wenn sich Personen, Standort ja/nein oder das Folgen ändern; Status und Koordinaten werden direkt ersetzt (sonst gehen Klicks beim Abspielen verloren).
function rpPeople(info){const cs=me&&(me.coord_sys||me.coord_default)||'lv95',f=rp.follow!=null&&rp.people.find(p=>p.user_id===rp.follow);
  const grp=[...roles.map(r=>({n:r.name,c:r.color,items:info.filter(([p])=>p.role_id==r.id)})),{n:'Ohne Spezialrolle',items:info.filter(([p])=>!roles.some(r=>r.id==p.role_id))}].filter(g=>g.items.length);
  const key=JSON.stringify([grp.map(g=>g.items.map(([p])=>[p.user_id,!!p.ll])),rp.follow]);
  if(key!==rp.pKey){rp.pKey=key;$('#rpPH').textContent=`Einsatzkräfte (${info.length})`;
    $('#rpPeople').innerHTML=grp.map(g=>`<div class="rpg">${g.c?`<span style="color:${esc(g.c)}">●</span> `:''}${esc(g.n)} (${g.items.length})</div>`+g.items.map(([p])=>{const fo=rp.follow===p.user_id;
      return `<div class="rpp"><i style="background:${esc(p.col)}"></i><span class="nm"><b>${esc(p.name)}</b>${p.mode_name?' <span class="mut">· '+esc(p.mode_name)+'</span>':''}<small data-st="${p.user_id}"></small></span>${p.ll?`<button data-c="${p.user_id}" title="Auf der Karte zentrieren">Zentrieren</button>`:''}${p.ll||fo?`<button data-f="${p.user_id}" aria-pressed="${fo}" title="Karte folgt dieser Person">${fo?'Folgt':'Folgen'}</button>`:''}</div>`}).join('')).join('')||'<div class="mut">Noch niemand im Einsatz</div>'}
  info.forEach(([p,s])=>{const e=$(`#rpPeople [data-st="${p.user_id}"]`),c=p.ll&&fmtC(p.ll[0],p.ll[1],cs);if(e)e.textContent=s+(c?' · '+c:'')});
  // Folgen: Karte bei jedem Bild auf die Person schieben (Zoom bleibt); ohne Standort (Pause, ausgetreten) bleibt die Karte stehen
  const fc=$('#rpFollow');fc.hidden=!f;if(f){fc.firstChild.textContent='Folgt: '+f.name+(f.ll?'':' (kein Standort)');if(f.ll)rp.map.panTo(f.ll,{animate:false})}}
start();
</script></body></html>
