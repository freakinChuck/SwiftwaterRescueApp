<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Swiftwater Rescue – Verwaltung</title>
<link rel="stylesheet" href="common.css?v=0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
body{min-height:100dvh}
header{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.7rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}header h1{font-size:1.15rem;margin:0;flex:1 1 12rem}
#wrap.my{grid-template-columns:minmax(0,1fr);max-width:900px} /* Meine Einsätze: ohne Navigation */
#wrap{max-width:1300px;margin:0 auto;padding:1rem;display:grid;grid-template-columns:13rem minmax(0,1fr);gap:1.2rem;align-items:start} /* minmax: breite Tabellen scrollen in .tw statt die Seite zu verbreitern */
main{display:grid;grid-template-columns:minmax(0,1fr);gap:1.2rem}main>section[hidden]{display:none}
/* Navigation nach Kategorien (Issue #32); am Handy als Auswahlliste */
#nav{position:sticky;top:4.2rem}#navSel{display:none;width:100%}
.ng{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:.9rem 0 .25rem .6rem}.ng:first-child{margin-top:0}
#nav a{display:block;padding:.4rem .6rem;border-radius:6px;color:inherit;text-decoration:none;border-left:3px solid transparent}#nav a:hover{background:var(--panel)}#nav a[aria-current=page]{background:var(--panel);border-left-color:var(--ex);font-weight:600}
@media(max-width:760px){#wrap{grid-template-columns:minmax(0,1fr)}#nav{position:static}#navSel{display:block}.navl{display:none}}
main>section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1rem} /* nur die Abschnitte: Leaflet baut die Kartenauswahl ebenfalls als section (Issue #26) */
h2{margin:0 0 .6rem;font-size:1.1rem}h3{margin:1rem 0 .3rem;font-size:1rem}
.tw{overflow-x:auto}th{text-align:left;padding:.3rem;color:var(--mut);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
tr.off td{opacity:.55}tr.new td{padding:.3rem}tr.new input,tr.new select{width:100%;min-width:8rem;margin:0}tr.new select{min-width:10rem}tfoot th{padding-top:1rem}td.act{white-space:nowrap;text-align:right}td.act button{padding:.35rem .6rem;margin:.1rem}
/* Einsatzlog: scharfe Einsätze rot, Übungen blau */
.badge.real{background:var(--alarm)}
/* Einsatzstatistik als Karten statt Tabelle: bricht um, kein seitliches Scrollen (auch am Handy) */
.ssum{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:.6rem;margin:.6rem 0 .8rem}.ssum>div{border:1px solid var(--line);border-left:4px solid var(--alarm);border-radius:8px;padding:.5rem .7rem}.ssum>div.ex{border-left-color:var(--ex)}.ssum h3{margin:0 0 .35rem;font-size:.95rem}
.kv{display:flex;flex-wrap:wrap;gap:.3rem 1.1rem}.kv span{display:flex;flex-direction:column;font-variant-numeric:tabular-nums}.kv small{color:var(--mut);font-size:.72rem;white-space:nowrap}
.inc{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.2rem;border:1px solid var(--line);border-left:4px solid var(--alarm);border-radius:8px;padding:.6rem .8rem;margin:.5rem 0}.inc.ex{border-left-color:var(--ex)}
.inc .ih{flex:1 1 15rem;min-width:0}.inc .ih b{display:block;overflow-wrap:anywhere;margin:.15rem 0}.inc .ih .mut{font-size:.85rem}
.inc .fl{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.3rem}.inc .fl span{font-size:.75rem;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:0 .45rem}.inc .fl .on{color:#e05cb0;border-color:#e05cb0}
.inc.usr{border-left-color:var(--ok)}.inc.usr.off{border-left-color:var(--line);opacity:.6}.inc.usr .ih b{display:inline;margin-right:.4rem}.inc .fl .adm{color:#f0b429;border-color:#f0b429}.inc.url{border-left-color:var(--ex)}.inc.url.adm{border-left-color:#f0b429}.inc.url .ih b{display:inline;margin-right:.4rem}
.inc .ia{display:flex;flex-wrap:wrap;gap:.5rem;margin-left:auto}.inc .bg{display:inline-flex}.inc .bg>*{border-radius:0;margin:0}.inc .bg>*+*{margin-left:-1px}.inc .bg>:first-child{border-radius:6px 0 0 6px}.inc .bg>:last-child{border-radius:0 6px 6px 0}.inc .bg>:only-child{border-radius:6px}.inc .bg .bl{display:flex;align-items:center;padding:0 .5rem;font-size:.75rem;font-weight:600;color:var(--mut);border:1px solid var(--line)}.inc .ia button{padding:.35rem .6rem}.inc .ia .sec{background:none;color:var(--mut)}
@media(max-width:760px){.inc .ia{margin-left:0;width:100%}.inc .bg{flex:1 1 auto}.inc .ia button{flex:1 1 auto}}
@media(min-width:900px){.inc{display:grid;grid-template-columns:minmax(0,1fr) 24rem;grid-template-areas:"ih kv" "ia ia"}.inc .ih{grid-area:ih}.inc .kv{grid-area:kv;display:grid;grid-template-columns:repeat(4,1fr)}.inc .ia{grid-area:ia;justify-content:flex-end}.inc.url .kv{grid-template-columns:repeat(3,1fr)}} /* Kennzahlen in fester Spalte, bündig untereinander; Knöpfe darunter rechts */
/* Replay */
#replay{position:fixed;inset:0;z-index:5000;background:var(--bg);display:flex;flex-direction:column}
#rpHead{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.6rem 1rem;border-bottom:1px solid var(--line)}#rpHead h2{margin:0;font-size:1.15rem;flex:1 1 16rem}
#rpBody{flex:1;display:flex;min-height:0;position:relative}#rpMap{flex:1;min-width:0;background:#0c1c25}
#rpSide{width:24rem;overflow:auto;border-left:1px solid var(--line);padding:.6rem}
#rpFoot{display:flex;gap:.8rem;align-items:center;padding:.6rem 1rem;border-top:1px solid var(--line)}#rpTl{flex:1;display:grid;gap:3px}#rpRange{width:100%;padding:0}
#rpSeg{position:relative;height:5px;background:var(--line);border-radius:3px}#rpSeg span{position:absolute;top:0;bottom:0;background:#e05cb0;border-radius:3px} /* aufgezeichnete Zeiträume, Lücken = Pause/aus */
#rpTime{font-variant-numeric:tabular-nums;white-space:nowrap}
/* Replay: Fenster «Ansicht» und Auto-Übersicht (Issue #53), wie in der öffentlichen Ansicht */
#rpView{position:absolute;z-index:1000;top:.6rem;right:.6rem;width:46px;height:46px;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px #0008}#rpView[aria-expanded=true],#rpAuto[aria-pressed=true],#rpAnon[aria-pressed=true]{background:var(--ex);border-color:var(--ex);color:#fff}
#replay #viewBox{position:absolute;top:3.7rem;right:.6rem;max-height:calc(100% - 4.4rem);cursor:auto;font:1rem/1.4 "Segoe UI",system-ui,sans-serif}
.rpl{display:block;width:100%;text-align:left;border:0;border-left:4px solid;border-radius:0;background:none;padding:.35rem .5rem;font-size:.9rem}.rpl:hover{background:var(--panel)}.rpl .t{color:var(--mut);margin-right:.4rem}
.rpp{display:flex;gap:.4rem;align-items:center;font-size:.9rem;padding:.25rem 0;border-bottom:1px solid var(--line)}.rpp i{width:.8rem;height:.8rem;border-radius:50%;flex:0 0 auto}.rpp .nm{flex:1;min-width:0;overflow-wrap:anywhere}.rpp .nm small{display:block;color:var(--mut)}.rpp button{padding:.25rem .45rem;font-size:.8rem}.rpp button[aria-pressed=true]{background:var(--ex);border-color:var(--ex)}
.exp{border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem;margin:.8rem 0}.exp h3{margin:0 0 .3rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}.exp .badge.run{background:var(--alarm)}.exp .badge.done{background:var(--line)}.exp td{vertical-align:top}.exp td small{display:block;color:var(--mut)}
.dlg .card.mid{max-width:640px}.dlg .card.aarf{max-width:820px}.dlg .card.aarv{max-width:900px}.aarimgs{display:grid;gap:.5rem}.aarsh{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.6rem;align-items:start}.aarsh input,.aarsh select{width:100%;min-width:0}.aara{display:grid;gap:.2rem}.aarft{display:flex;flex-wrap:wrap;gap:.2rem .6rem;align-items:flex-start;justify-content:flex-end}.aarft>small{flex:1 1 12rem;padding-top:.2rem}.aarft>.aarimgs.on{flex:1 1 100%}.aarft .row{margin:0;justify-content:flex-end}.aarft .row>*{flex:0 0 auto}.aarft .row button{font-size:.82rem;padding:.25rem .55rem}.aarit{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}.aarim{flex:1 1 8rem;min-width:0;display:grid;gap:.1rem}.aarit img{width:6rem;height:4.5rem;object-fit:cover;border-radius:4px;background:#0006;flex:0 0 auto}.aarit input{flex:1 1 auto;min-width:0}.aarit button{flex:0 0 auto}.aardoc figure{margin:.5rem 0;text-align:center}.aardoc figure img{max-width:100%;max-height:28rem;border-radius:4px}.aardoc figcaption{font-size:.8rem;color:var(--mut)}.aardoc{border-top:1px solid var(--line);margin-top:.4rem;padding-top:.4rem}.aardoc h2{margin:.2rem 0}.aardoc table{width:100%}#sAarC label.chk,.aaro label.chk{display:flex;align-items:center;gap:.5rem;margin:.3rem 0}.aaro{gap:1rem}.inc .fl .wip{color:var(--warn,#e0a030);border-color:var(--warn,#e0a030)}.dlg label[hidden]{display:none}.dlg label small{font-size:.78rem}.dlg h3.aarq{margin:.6rem 0 0;border-bottom:1px solid var(--line);padding-bottom:.2rem}.inc .fl .rv{color:var(--ok);border-color:var(--ok)}.aarrow>*{flex:0 0 auto}.aarlogo{height:4rem;width:auto;max-width:14rem;object-fit:contain;background:#fff;border-radius:4px;padding:.2rem}tr.aarh td{background:#ffffff0d}.urh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.4rem}.urh .urf{flex:1 1 12rem;max-width:18rem;margin:0}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,13rem),1fr));gap:0 .8rem} /* Rechte im Rollen-Dialog mehrspaltig */
.urg{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.4rem}.urb{display:grid;gap:.1rem;text-align:left;padding:.45rem .6rem .45rem 2rem;position:relative;border-radius:8px;min-height:0}.urb[hidden]{display:none}.urb small{color:var(--mut);font-size:.78rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.urb::before{content:'';position:absolute;left:.6rem;top:.6rem;width:.9rem;height:.9rem;border-radius:50%;border:2px solid var(--mut)}.urb[aria-pressed=true]{background:#1d7fd133;border-color:var(--ex)}.urb[aria-pressed=true]::before{content:'✓';border-color:var(--ex);background:var(--ex);color:#fff;font-size:.7rem;line-height:.9rem;text-align:center}.urb:disabled{opacity:.55;cursor:not-allowed}
.pwr{display:flex;gap:.35rem}.pwr input{flex:1;min-width:0;font-family:ui-monospace,Consolas,monospace}.pwr button{flex:0 0 auto}
.lsel{display:flex;flex-wrap:wrap;gap:.35rem}.lchip{display:inline-flex;align-items:center;gap:.3rem;border:1px solid var(--line);border-radius:999px;padding:.1rem .2rem .1rem .6rem}.lchip button{padding:.1rem .45rem;min-height:0;border-radius:999px}
/* Helikopter: Zahlenwerte als Karten mit Einheit, Bereich und Standard (geänderte Werte hervorgehoben) */
.anums{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.6rem;margin:.4rem 0 .6rem}
.anum{display:flex;flex-direction:column;gap:.3rem;border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem}.anum.chg{border-color:var(--ex)}
.anum label{font-weight:600}.anum .h{color:var(--mut);font-size:.82rem;flex:1}
.anum .ai{display:flex;align-items:center;gap:.4rem}.anum .ai input{width:7.5rem;margin:0;font-variant-numeric:tabular-nums}.anum .ai span{color:var(--mut)}
.anum small{color:var(--mut);font-size:.75rem}.anum small b{color:var(--ex);font-weight:600}
#sH .afld{display:flex;flex-direction:column;gap:.25rem;max-width:28rem;margin:.5rem 0}#sH .afld select{margin:0}#sH label.chk{display:flex;align-items:center;gap:.5rem;margin:.4rem 0} /* Helikopter: je Eingabe eine Zeile */
.exmap{height:min(24rem,55dvh);margin-top:.5rem;border-radius:8px;border:1px solid var(--line);background:#0c1c25;isolation:isolate}
.exleg{display:flex;flex-wrap:wrap;gap:.3rem 1rem;margin-top:.3rem;font-size:.8rem}.exleg i{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;border:1px solid #fff;margin-right:.3rem;vertical-align:-.05rem}
.pickmap{height:min(14rem,32dvh);isolation:isolate;border-radius:8px;border:1px solid var(--line);background:#0c1c25}
/* Dialog «Element»: breit, links die Felder, rechts Standort und Karte; am Handy untereinander */
.dlg .card.wide{max-width:960px}.jgrid,.jcol{display:grid;gap:.7rem;align-content:start}.jtwo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.7rem;align-items:end}.jtwo>*,.jtwo select,.jtwo input{min-width:0;width:100%}
@media(min-width:760px){.jgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}.jcol.jm{display:flex;flex-direction:column}.jm .pickmap{flex:1;height:auto;min-height:14rem}}
.lres{display:grid;gap:.25rem}.lres:empty{display:none}.lres button{text-align:left}
.rpg{font-size:.8rem;font-weight:700;color:var(--mut);margin-top:.5rem}
/* Replay: Anzeige beim Folgen (oben links auf der Karte) */
#rpFollow{position:absolute;top:.6rem;left:3.4rem;z-index:1000;background:var(--ex);color:#fff;border-radius:6px;padding:.2rem .3rem .2rem .7rem;font-size:.9rem;display:flex;gap:.4rem;align-items:center;box-shadow:0 1px 4px #0008;max-width:calc(100% - 4rem)}#rpFollow[hidden]{display:none}#rpFollow button{background:transparent;border:0;color:#fff;padding:.15rem .4rem}
.leaflet-tooltip.rplbl{background:#0f2430e6;color:#fff;border:0;box-shadow:none;font-weight:600;padding:1px 5px;font-size:calc(12px*var(--rpsz,1))} /* --rpsz: Regler «Grösse der Positionen» */
#rpSzL{display:flex;gap:.5rem;align-items:center}#rpSzL input{flex:1;padding:0}#rpSzL span{min-width:3.2rem;text-align:right;font-variant-numeric:tabular-nums}.leaflet-tooltip.rplbl::before{display:none}
@media(max-width:760px){#rpBody{flex-direction:column}#rpSide{width:auto;height:40%;border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<div id="app"></div>
<script src="common.js?v=0"></script>
<script>
/* Verwaltung: jede Person sieht die Bereiche, für die eine ihrer Benutzerrollen das Recht hat (Issue #63, NAV_PERM). Die API prüft die Berechtigung bei jedem Aufruf.
   Alle anderen sehen nur «Meine Einsätze» (Issue #61, Log und Replay der eigenen beendeten Einsätze), sofern die Verwaltung das nicht ausgeschaltet hat (my_runs). */
let me=null,users=[],roles=[],uroles=null;
onUnauth=()=>start();
// Benutzerrollen (Issue #63): mehrere je Person, Rechte = alle Rechte aller Rollen. Vergeben/entziehen nur Rollen, deren Rechte man selbst hat (prüft auch der Server)
const UR=id=>(uroles&&uroles.roles.find(r=>r.id===id))||{name:'?',perms:[]};
const ROLE_LABEL=u=>u.uroles.length?u.uroles.map(id=>esc(UR(id).name)).join(', '):'<span class="mut">keine</span>';
const urOk=r=>r.perms.every(can);
// Rollenauswahl: je Rolle eine Karte zum Antippen (aria-pressed) mit den enthaltenen Rechten
const urPermTxt=r=>r.sys==='admin'?'Alle Rechte, auch künftige':r.perms.map(k=>(uroles.perms.find(p=>p.k===k)||{name:k}).name).join(' · ')||'keine Rechte';
const roleChecks=u=>`<div class="urh"><span class="mut">Benutzerrollen <span class="urn"></span></span>${uroles.roles.length>8?'<input type="search" class="urf" placeholder="Rolle oder Recht suchen" aria-label="Rollen filtern">':''}</div><div class="urg" role="group" aria-label="Benutzerrollen">${uroles.roles.map(r=>{const on=u?u.uroles.includes(r.id):!!r.def&&urOk(r),lock=!urOk(r)||u&&u.id===me.id&&r.sys==='admin'&&on;
  return`<button type="button" class="urb" data-ur="${r.id}" aria-pressed="${on}" ${lock?'disabled':''} title="${esc(urPermTxt(r))}${lock?(urOk(r)?' – die eigene Rolle Systemadministrator bleibt':' – enthält Rechte, die du selbst nicht hast'):''}"><b>${esc(r.name)}</b><small>${esc(urPermTxt(r))}</small></button>`}).join('')}</div>`;
const pwField=(id,label)=>`<label class="mut">${label}<span class="pwr"><input id="${id}" autocomplete="off" spellcheck="false" value="${genPw()}"><button type="button" data-pwn title="Neues Passwort erzeugen">↻</button><button type="button" data-pwc>Kopieren</button></span></label>`;
const pwWire=d=>{const i=d.querySelector('.pwr input');d.querySelector('[data-pwn]').onclick=()=>i.value=genPw();
  d.querySelector('[data-pwc]').onclick=()=>navigator.clipboard.writeText(i.value).then(()=>toast('Startpasswort kopiert.','ok'),()=>{i.select();toast('Kopieren nicht möglich, bitte von Hand kopieren.','info')})};
const roleWire=el=>{const bs=[...el.querySelectorAll('.urb')],n=el.querySelector('.urn'),f=el.querySelector('.urf');
  const cnt=()=>{const k=bs.filter(b=>b.getAttribute('aria-pressed')==='true').length;n.textContent=k?`(${k} gewählt)`:'(keine gewählt)'};cnt();
  bs.forEach(b=>b.onclick=()=>{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');cnt()});
  if(f)f.oninput=()=>{const q=f.value.trim().toLowerCase();bs.forEach(b=>b.hidden=!!q&&!b.textContent.toLowerCase().includes(q))}};
const roleVal=el=>[...el.querySelectorAll('[data-ur]')].filter(c=>c.getAttribute('aria-pressed')==='true').map(c=>+c.dataset.ur);
async function start(){const a=$('#app');if(!token)return loginView(a,'Swiftwater Rescue – Verwaltung',start);
  try{me=(await api('me')).me}catch(e){if(token)a.innerHTML=`<div class="card"><p>${esc(e.message)}</p></div>`;return}
  if(me.must_change){a.innerHTML='';return pwDialog(true,start)}
  if(!nav().length&&me.my_runs==='off'){a.innerHTML=`<div class="card"><h1>Kein Zugriff</h1><p>Deine Benutzerrollen geben dir keinen Zugriff auf die Verwaltung.</p><div class="row"><a class="btn" href="./">Zur Einsatz-App</a><button id="bOut">Abmelden</button></div></div>`;$('#bOut').onclick=()=>{logout();start()};return}
  MY=myMode();const adm=nav().length>0;
  if(MY){a.innerHTML=`<header><h1>Swiftwater Rescue – Meine Einsätze</h1><span class="mut">${esc(me.name)}</span><a class="btn" href="./">Zur Einsatz-App</a>${adm?'<a class="btn" href="#" id="bVw">⚙ Verwaltung</a>':''}<button id="bPw">Passwort ändern</button><button id="bOut">Abmelden</button></header>
    <div id="wrap" class="my"><main><section id="sMy"><h2>Meine Einsätze</h2><div class="mut">Wird geladen …</div></section></main></div>`;
    $('#bPw').onclick=()=>pwDialog(false);$('#bOut').onclick=()=>{logout();start()};
    if(adm)$('#bVw').onclick=e=>{e.preventDefault();location.hash='einsatzlog'};
    document.title='Swiftwater Rescue – Meine Einsätze';return loadMy()}
  a.innerHTML=`<header><h1>Swiftwater Rescue – Verwaltung</h1><span class="mut">${esc(me.name)}</span><a class="btn" href="./">Zur Einsatz-App</a>${me.my_runs!=='off'?'<a class="btn" href="#meine" title="Log und Replay deiner eigenen Einsätze, wie für Einsatzkräfte ohne Verwaltungsrechte">📋 Meine Einsätze</a>':''}<button id="bPw">Passwort ändern</button><button id="bOut">Abmelden</button></header>
    <div id="wrap"><nav id="nav" aria-label="Bereiche der Verwaltung"><select id="navSel" aria-label="Bereich wählen">${nav().map(([g,its])=>`<optgroup label="${esc(g)}">${its.map(([k,,l])=>`<option value="${k}">${esc(l)}</option>`).join('')}</optgroup>`).join('')}</select>
    <div class="navl">${nav().map(([g,its])=>`<div class="ng">${esc(g)}</div>${its.map(([k,,l])=>`<a href="#${k}" data-k="${k}">${esc(l)}</a>`).join('')}`).join('')}</div></nav>
    <main>${navItems().map(([k,id,l])=>`<section id="${id}" hidden><h2>${esc(l)}</h2><div class="mut">Wird geladen …</div></section>`).join('')}</main></div>`;
  $('#bPw').onclick=()=>pwDialog(false);$('#bOut').onclick=()=>{logout();start()};
  $('#navSel').onchange=e=>{location.hash=e.target.value};showNav()}
/* ---------- Navigation (Issue #32) ---------- */
// Kategorien mit Unterpunkten: [Kategorie, [[Hash, Abschnitt-ID, Bezeichnung, Laden]]]. Neue Einstellungen hier als Unterpunkt aufnehmen.
// Es ist immer nur ein Abschnitt sichtbar (Hash in der Adresse, Neuladen und Zurück funktionieren); er wird bei jedem Öffnen frisch geladen.
const NAV=[
  ['Personen',[['benutzer','sU','Benutzer',loadUsers],['benutzerrollen','sUR','Benutzerrollen',loadURoles],['einsatzgruppen','sG','Einsatzgruppen',loadGroups]]],
  ['Einsatz',[['einsatztypen','sT','Einsatztypen',loadTypes],['einrueckoptionen','sM','Einrückoptionen',loadModes],['spezialrollen','sR','Spezialrollen',loadRoles],['externe','sX','Externe Einsatzkräfte',loadExt]]],
  ['Übungen',[['uebungen','sEx','Übungen vorbereiten',loadEx]]],

const airNumL={radius_km:['Umkreis','km','um PLS (plus Driftdistanz), Einsatzkräfte, Rettlinge, Externe, Markierungen und Bereiche; abgefragt werden höchstens ca. 460 km um die Mitte (Grenze der Dienste)'],max_alt_ft:['Höchste Flughöhe','ft','höher fliegende gelten als Durchflug (barometrische Höhe)'],
  max_age_s:['Höchstes Alter einer Position','s','ältere Positionen werden nicht mehr gezeigt'],trail_min:['Spur','min','zurückgelegter Weg hinter dem Symbol, 0 = keine Spur'],cache_s:['Abfrage höchstens alle','s','eine Abfrage für alle Geräte zusammen']};
const AIR_GRP=[['Relevanzzone',['radius_km','max_alt_ft']],['Anzeige',['max_age_s','trail_min']],['Abfrage',['cache_s']]];
const airNumX=(k,v)=>k==='max_alt_ft'&&v!==''&&!isNaN(v)?'≈ '+Math.round(v*.3048).toLocaleString('de-CH')+' m':''; // Flughöhe zusätzlich in Metern
function airNumCard(k){const[l,u,h]=airNumL[k],[d,lo,hi]=airS.air_num[k],v=airC[k],x=airNumX(k,v);
  return`<div class="anum${+v!==d?' chg':''}" data-anc="${k}"><label for="an_${k}">${esc(l)}</label><div class="h">${esc(h)}</div>
    <div class="ai"><input type="number" id="an_${k}" data-an="${k}" min="${lo}" max="${hi}" step="1" value="${esc(String(v))}" inputmode="numeric"><span>${esc(u)}</span><span data-anx="${k}">${x}</span></div>
    <small>Bereich ${lo.toLocaleString('de-CH')}–${hi.toLocaleString('de-CH')} · Standard ${d.toLocaleString('de-CH')}${+v!==d?' · <b>geändert</b>':''}</small></div>`}
async function loadAir(){const el=$('#sH');try{airS=await api('settings')}catch(e){el.innerHTML='<h2>Helikopter</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  airC=JSON.parse(JSON.stringify(airS.air));drawAir()}
function drawAir(){const el=$('#sH'),s=airS,c=airC,st=s.air_status||{},dt=t=>t?new Date(t*1000).toLocaleString('de-CH'):'–';
  const srcRow=(k,i)=>{const S=s.air_sources[k],x=st[k],on=c.src.includes(k);
    return`<div class="inc" style="padding:.5rem .7rem"><div class="row" style="align-items:center;margin:0"><label class="chk" style="flex:1"><input type="checkbox" data-as="${k}" ${on?'checked':''}> <b>${esc(S.name)}</b> <a href="${esc(S.site)}" target="_blank" rel="noopener" class="mut">${esc(S.site.replace(/^https:\/\//,''))}</a></label>
      <button data-au="${i}" ${i?'':'disabled'} aria-label="Nach oben">↑</button><button data-ad="${i}" ${i<c.order.length-1?'':'disabled'} aria-label="Nach unten">↓</button><button data-at="${k}">Testen</button></div>
      <div class="mut">⚠ ${esc(S.note)}</div>
      <div class="mut">${x?`Abfragen ${x.uses}, fehlgeschlagen ${x.fails} · letzter Erfolg ${dt(x.last_ok)}${x.ms!=null?` (${x.ms} ms, ${x.n} Luftfahrzeuge)`:''}${x.last_fail?` · letzter Fehler ${dt(x.last_fail)}: ${esc(x.err||'')}`:''}`:'Noch nicht abgefragt'}</div><div class="mut" id="at_${k}"></div></div>`};
  const sel=(id,o,v)=>`<select id="${id}">${Object.entries(o).map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  el.innerHTML=`<h2>Helikopter</h2><div class="mut">Zeigt Helikopter (z. B. der Rega) live auf der Karte des Einsatzes, aus offenen ADS-B-Daten (Transpondersignale, gesammelt von Freiwilligen). Der Server fragt die Daten ab und teilt sie mit allen Geräten. Nur was in der Relevanzzone des Einsatzes fliegt, erscheint.</div>
    <div class="mut"><b>Grenzen:</b> Tief fliegende Helikopter in Tälern und über dem Fluss sind für die Empfänger am Boden oft nicht sichtbar und können zeitweise fehlen. Manche Betreiber (z. B. Militär) senden keine oder gesperrte Daten. Die Anzeige ersetzt keine Absprache über Funk.</div>
    <h3>Ein- und ausschalten</h3><label class="chk"><input type="checkbox" id="aOn" ${c.on?'checked':''}> <b>Helikopterdaten verwenden</b></label>
    <div class="mut">Ausgeschaltet fragt der Server keine Daten ab, und kein Einsatz zeigt Helikopter. Bereits Aufgezeichnetes bleibt im Replay.</div>
    <div ${c.on?'':'style="opacity:.5"'}><div class="mut" style="margin-top:.5rem"><b>Vorauswahl beim Start</b>: Die Einsatzleitung kann sie beim Start und im Einsatz unter «Einsatz verwalten» ändern.</div>
    <label class="chk"><input type="checkbox" id="aDR" ${c.def_real?'checked':''} ${c.on?'':'disabled'}> Scharfe Einsätze</label>
    <label class="chk"><input type="checkbox" id="aDE" ${c.def_ex?'checked':''} ${c.on?'':'disabled'}> Übungen (auch vorbereitete)</label></div>
    <h3>Datenquellen</h3><div class="mut">Der Server fragt die eingeschalteten in dieser Reihenfolge ab, bis eine antwortet. Alle sind gratis und ohne Schlüssel, aber <b>nur für nicht-kommerzielle Nutzung</b> gedacht; die Bedingungen der Betreiber gelten.</div>
    ${c.order.map(srcRow).join('')}
    <h3>Anzeige</h3><label class="mut afld">Welche Luftfahrzeuge${sel('aF',s.air_filters,c.filter)}</label>
    <label class="mut afld">Einsatz-App: Wer sieht die Helikopter${sel('aA',s.air_app,c.app)}</label>
    <label class="chk"><input type="checkbox" id="aP" ${c.public?'checked':''}> In der öffentlichen Ansicht zeigen</label>
    <label class="chk"><input type="checkbox" id="aR" ${c.replay?'checked':''}> Aufzeichnen und im Replay zeigen (nur während der Einsatz aufgezeichnet wird)</label>
    <h3>Relevanzzone und Abfrage</h3><div class="mut">Relevant ist ein Luftfahrzeug, das sich im Umkreis um eine aktive Position des Einsatzes befindet. Um den PLS zählt zusätzlich die Driftdistanz (Fliessgeschwindigkeit × Zeit seit dem PLS, höchstens 30 km), damit das ganze Suchgebiet abgedeckt ist. 15 km entsprechen bei einem Rettungshelikopter etwa 4 Minuten Anflug.</div>
    ${AIR_GRP.map(([g,ks])=>`<div class="mut" style="margin-top:.5rem"><b>${g}</b></div><div class="anums">${ks.map(airNumCard).join('')}</div>`).join('')}
    <h3>Rettungshelikopter</h3><div class="mut">Diese werden hervorgehoben (rot) und mit ihrer Bezeichnung angeschrieben. Kennung: Anfang des Rufzeichens (Rega: RGA), Anfang des Kennzeichens (z. B. HB-Z) oder Transponder-Adresse (6 Zeichen, z. B. 4b330c).</div>
    <div id="aL">${c.rescue.map((x,i)=>`<div class="row" style="align-items:center"><input data-rk="${i}" value="${esc(x.k)}" aria-label="Kennung" style="max-width:8rem" maxlength="8"><input data-rn="${i}" value="${esc(x.n)}" aria-label="Bezeichnung" maxlength="40"><button data-rx="${i}" aria-label="Entfernen">✕</button></div>`).join('')||'<div class="mut">Keine Einträge</div>'}</div>
    <div class="row"><button id="aAdd">+ Eintrag</button></div>
    <div class="row"><button id="aSv" class="pri">Speichern</button><button id="aDf">Standard wiederherstellen</button><button id="aRl">Verwerfen</button></div>`;
  el.oninput=e=>{const t=e.target;if(t.dataset.an){const k=t.dataset.an,d=s.air_num[k][0],card=t.closest('.anum');c[k]=t.value;card.classList.toggle('chg',+t.value!==d);
    card.querySelector('[data-anx]').textContent=airNumX(k,t.value);const sm=card.querySelector('small');sm.innerHTML=sm.innerHTML.split(' · <b>')[0]+(+t.value!==d?' · <b>geändert</b>':'')}else if(t.dataset.rk)c.rescue[+t.dataset.rk].k=t.value;else if(t.dataset.rn)c.rescue[+t.dataset.rn].n=t.value};
  el.onchange=e=>{const t=e.target;if(t.dataset.as){c.src=c.order.filter(k=>k===t.dataset.as?t.checked:c.src.includes(k))}else if(t.id==='aF')c.filter=t.value;else if(t.id==='aA')c.app=t.value;else if(t.id==='aP')c.public=t.checked?1:0;else if(t.id==='aOn'){c.on=t.checked?1:0;drawAir()}else if(t.id==='aDR')c.def_real=t.checked?1:0;else if(t.id==='aDE')c.def_ex=t.checked?1:0;else if(t.id==='aR')c.replay=t.checked?1:0};
  el.onclick=async e=>{const b=e.target.closest('button');if(!b)return;const mv=(i,d)=>{const o=c.order;[o[i],o[i+d]]=[o[i+d],o[i]];c.src=o.filter(k=>c.src.includes(k));drawAir()};
    if(b.dataset.au)mv(+b.dataset.au,-1);else if(b.dataset.ad)mv(+b.dataset.ad,1);
    else if(b.dataset.rx){c.rescue.splice(+b.dataset.rx,1);drawAir()}else if(b.id==='aAdd'){c.rescue.push({k:'',n:''});drawAir();const l=$('#aL').querySelectorAll('[data-rk]');l[l.length-1].focus()}
    else if(b.dataset.at){const o=$('#at_'+b.dataset.at);b.disabled=true;o.textContent='Wird abgefragt …';
      try{const r=await api('air/test',{src:b.dataset.at});o.innerHTML=r.ok?`✓ Antwort in ${r.ms} ms: ${r.total} Luftfahrzeuge im Umkreis von 220 km um die Mitte der Schweiz, davon ${r.heli.length} Helikopter${r.heli.length?': '+r.heli.map(h=>esc((h.rescue?h.rescue+' ':'')+(h.cs||h.reg||h.hex))+(h.alt!=null?` (${h.alt?h.alt+' ft':'am Boden'})`:'')).join(', '):''}.`:`✗ Keine gültige Antwort nach ${r.ms} ms${r.status&&r.status.err?': '+esc(r.status.err):''}.`}catch(x){o.textContent='✗ '+x.message}b.disabled=false}
    else if(b.id==='aRl')loadAir();
    else if(b.id==='aDf'){if(confirm('Standardeinstellungen für Helikopter wiederherstellen (noch nicht gespeichert)?')){airC=JSON.parse(JSON.stringify(s.air_default));drawAir()}}
    else if(b.id==='aSv'){if(!c.src.length&&!confirm('Keine Datenquelle eingeschaltet: Es werden keine Helikopter angezeigt. Trotzdem speichern?'))return;
      c.rescue=c.rescue.filter(x=>x.k.trim()||x.n.trim());b.disabled=true;
      api('settings/save',{air:{...c,rescue:c.rescue}}).then(()=>{toast('Gespeichert. Gilt ab der nächsten Abfrage.');loadAir()}).catch(x=>{fail(x);b.disabled=false})}}}
/* ---------- Gewässerdaten: Haltedauer des Overpass-Caches und Overpass-Server (Reihenfolge) ---------- */
let opUrls=[],opDef=[],opOff=[];
async function loadOp(){const el=$('#sO');let s,os;try{[s,os]=await Promise.all([api('settings'),api('overpass/stats')])}catch(e){el.innerHTML='<h2>Gewässerdaten</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  opUrls=[...s.overpass_urls];opDef=s.overpass_default;opOff=[...(s.overpass_off||[])];
  el.innerHTML=`<h2>Gewässerdaten</h2><div class="mut">Das Gewässernetz für Suchgebiet und Flussdistanz (OpenStreetMap via Overpass) holt der Server und speichert es zwischen. Gleiche Abfragen, z. B. das Suchgebiet auf allen Geräten eines Einsatzes, gehen so nur einmal zu Overpass. Ist Overpass nicht erreichbar, verwendet der Server ältere Daten (bis 7 Tage).</div>
    <label class="chk"><input type="checkbox" id="opOn" ${s.overpass_on?'checked':''}> Zugriff auf Overpass</label>
    <div class="mut">Ausgeschaltet fragen weder der Server noch die Geräte Overpass ab. Suchgebiet und Flussdistanz erhalten dann nur noch Daten aus dem Zwischenspeicher (auch ältere); ohne solche erscheint das Suchgebiet als Kreis um den PLS, und die Flussdistanz ist nicht verfügbar. Gilt sofort.</div>
    <div class="row" style="align-items:end"><label class="mut">Haltedauer in Minuten (0 = nicht zwischenspeichern)<input id="opT" type="number" min="0" max="10080" step="1" value="${s.overpass_ttl}"></label><button id="opSv">Speichern</button></div>
    <h3>Overpass-Server</h3><div class="mut">Der Server fragt die eingeschalteten in dieser Reihenfolge ab (je 15 s), bis einer antwortet. Antwortet keiner, fragt das Gerät dieselben Server direkt (je 30 s). Ausgeschaltete Server bleiben in der Liste, werden aber nicht abgefragt.</div>
    <div id="opList"></div>
    <div class="row"><input id="opN" placeholder="https://…/api/interpreter" aria-label="Adresse eines Overpass-Servers" inputmode="url"><button id="opA">Hinzufügen</button></div>
    <div class="row"><button id="opUs" class="pri">Server speichern</button><button id="opUd">Standard wiederherstellen</button></div>
    <h3>Verwendung und Verfügbarkeit</h3>${opStats(os,s.overpass_urls)}`;
  $('#opOn').onchange=e=>{const c=e.target;c.disabled=true;api('settings/save',{overpass_on:c.checked?1:0}).catch(x=>{c.checked=!c.checked;fail(x)}).finally(()=>{c.disabled=false})};
  $('#opSr').onclick=()=>{if(confirm('Statistik der Overpass-Server zurücksetzen?'))api('overpass/stats/reset',{}).then(loadOp).catch(fail)};
  $('#opSv').onclick=()=>api('settings/save',{overpass_ttl:$('#opT').value}).then(()=>{toast('Gespeichert.');loadOp()}).catch(fail);
  $('#opA').onclick=()=>{const u=$('#opN').value.trim();if(!/^https:\/\/[^/?#@]+\//i.test(u))return toast('Bitte eine vollständige https-Adresse angeben, z. B. https://overpass-api.de/api/interpreter','err');
    if(!opUrls.includes(u))opUrls.push(u);$('#opN').value='';drawOpList()};
  $('#opN').onkeydown=e=>{if(e.key==='Enter')$('#opA').click()};
  $('#opUs').onclick=()=>{if(!opUrls.length)return toast('Mindestens ein Server ist nötig. «Standard wiederherstellen» setzt die vorgegebene Liste.','err');
    if(opUrls.every(u=>opOff.includes(u))&&!confirm('Alle Server sind ausgeschaltet. Overpass wird dann nicht mehr abgefragt. Trotzdem speichern?'))return;
    api('settings/save',{overpass_urls:opUrls,overpass_off:opOff.filter(u=>opUrls.includes(u))}).then(()=>{toast('Gespeichert. Gilt ab der nächsten Abfrage.');loadOp()}).catch(fail)};
  $('#opUd').onclick=()=>{if(confirm('Vorgegebene Liste wiederherstellen?\n\n'+opDef.join('\n')))api('settings/save',{overpass_urls:[],overpass_off:[]}).then(()=>{toast('Gespeichert.');loadOp()}).catch(fail)};
  drawOpList()}
// Statistik je Server (Issue #45): Versuche vom Server (Hosting) und direkt vom Gerät (Rückfall), Abfragen aus dem Zwischenspeicher zählen nicht
function opStats(os,urls){const SRC={server:'Server',device:'Gerät'},dt=t=>t?esc(new Date(t*1000).toLocaleString('de-CH')):'–',
    us=[...urls,...[...new Set(os.rows.map(r=>r.url))].filter(u=>!urls.includes(u))];
  const rows=us.flatMap(u=>{const rs=os.rows.filter(r=>r.url===u);return(rs.length?rs:[{url:u,src:'',uses:0,ok:0,fails:0}]).map((r,k)=>`<tr>${k?'':`<td rowspan="${rs.length||1}" style="overflow-wrap:anywhere">${esc(u)}${urls.includes(u)?'':' <span class="mut">(nicht mehr hinterlegt)</span>'}</td>`}
    <td>${SRC[r.src]||'–'}</td><td>${r.uses}</td><td>${r.ok}</td><td>${r.fails}</td><td>${r.uses?Math.round(r.ok/r.uses*100)+' %':'–'}</td><td>${r.ok?(r.ok_ms/r.ok/1000).toFixed(1)+' s':'–'}</td>
    <td>${dt(r.last_ok)}</td><td>${dt(r.last_fail)}${r.last_err?`<br><span class="mut">${esc(r.last_err)}</span>`:''}</td></tr>`)}).join('');
  return `<div class="mut">Jeder Versuch zählt: «Server» = Abfrage vom Hosting, «Gerät» = direkte Abfrage eines Geräts, wenn der Server keine Antwort erhielt. Der nächste Server wird nur gefragt, wenn der vorherige nicht antwortet. Abfragen aus dem Zwischenspeicher zählen nicht.${os.since?' Erfasst seit '+dt(os.since)+'.':''}</div>
    <div class="tw"><table><thead><tr><th>Server</th><th>Quelle</th><th>Versuche</th><th>Erfolgreich</th><th>Fehlgeschlagen</th><th>Quote</th><th>Ø Antwortzeit</th><th>Zuletzt erfolgreich</th><th>Zuletzt fehlgeschlagen</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="row"><button id="opSr">Statistik zurücksetzen</button></div>`}
function drawOpList(){const n=opUrls.length,el=$('#opList');
  el.innerHTML=`<div class="tw"><table><tbody>${opUrls.map((u,k)=>`<tr><td style="width:2rem">${k+1}.</td><td style="width:2rem"><input type="checkbox" data-opk="${k}" ${opOff.includes(u)?'':'checked'} aria-label="Server abfragen" title="Eingeschaltet: wird abgefragt"></td><td style="overflow-wrap:anywhere${opOff.includes(u)?';opacity:.55':''}">${esc(u)}${opOff.includes(u)?' <span class="mut">(ausgeschaltet)</span>':''}</td><td class="act"><button data-op="up" data-k="${k}" ${k?'':'disabled'} aria-label="Nach oben" title="Früher abfragen">↑</button><button data-op="dn" data-k="${k}" ${k<n-1?'':'disabled'} aria-label="Nach unten" title="Später abfragen">↓</button><button data-op="rm" data-k="${k}" ${n>1?'':'disabled'} aria-label="Entfernen" title="Entfernen">✕</button></td></tr>`).join('')}</tbody></table></div>${JSON.stringify(opUrls)!==JSON.stringify(opDef)||opOff.length?'':'<div class="mut">Vorgegebene Liste.</div>'}<div class="mut">Änderungen gelten erst nach «Server speichern».</div>`;
  el.querySelectorAll('[data-opk]').forEach(c=>c.onchange=()=>{const u=opUrls[+c.dataset.opk];opOff=opOff.filter(x=>x!==u);if(!c.checked)opOff.push(u);drawOpList()});
  el.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,o=b.dataset.op;
    if(o==='rm')opUrls.splice(k,1);else{const j=o==='up'?k-1:k+1;[opUrls[k],opUrls[j]]=[opUrls[j],opUrls[k]]}drawOpList()})}
/* ---------- Übungen vorbereiten (Issue #29) ---------- */
// Aufgebotsmeldung, Übungsleitung (Rechte der Einsatzleitung, nimmt nicht teil), Aufzeichnung, öffentlicher Link (schon vor dem Start gültig, zeigt bis dahin eine Warteseite)
// und Elemente, die die Übungsleitung in der Einsatz-App freigibt: PLS des Einsatzes, neuer Rettling, Rettling gesichtet, je mit optionaler Meldung (Nachricht an alle)
const EXK={pls:'PLS des Einsatzes',res:'Neuer Rettling',seen:'Rettling gesichtet',ext:'Neue externe Einsatzkraft',extdel:'Externe Einsatzkraft entfernen'};
// erfasst das Element einen Rettling (neuer Rettling, Sichtung eines neuen oder unbekannten); Name des Rettlings
const exOwn=x=>x.kind==='res'||x.kind==='seen'&&x.ref_id==null,exRN=x=>x.name||'Unbekannter Rettling';
// Kartenvorschau je Übung: alle Elemente in der Übersicht, Sichtungen mit Linie vom Rettling; offene Vorschauen bleiben beim Neuladen offen
const EXC={pls:'#ff5533',res:'#ff9f1c',seen:'#b06cff',ext:'#2a9d5c',extdel:'#7d8b93'},exMapOpen=new Set();
function exMap(p,box){const m=L.map(box);let sv=null;try{sv=localStorage.getItem('sw_base')}catch(e){}const B=MAP_PROVIDERS[sv]||MAP_PROVIDERS[DEFAULT_BASE];L.tileLayer(B.url,{attribution:B.attr,maxZoom:B.maxZoom}).addTo(m);
  const js=p.injects.filter(j=>j.lat!=null&&j.kind!=='extdel'); // Entfernen liegt auf der externen Einsatzkraft
  js.forEach(j=>{const r=j.kind==='seen'&&js.find(x=>x.id===j.ref_id);if(r)L.polyline([[r.lat,r.lon],[j.lat,j.lon]],{color:EXC.seen,weight:2,dashArray:'6 6'}).addTo(m)});
  js.forEach(j=>L.circleMarker([j.lat,j.lon],{radius:8,color:'#fff',weight:2,fillColor:EXC[j.kind],fillOpacity:j.released?.45:1})
    .bindTooltip(esc(j.label)+(j.released?' (freigegeben)':'')+p.injects.filter(x=>x.kind==='extdel'&&x.ref_id===j.id).map(x=>' · entfernt: '+esc(x.label)).join(''),{permanent:true,direction:'top',offset:[0,-8]}).addTo(m));
  if(js.length)m.fitBounds(L.latLngBounds(js.map(j=>[j.lat,j.lon])),{padding:[40,40],maxZoom:15});else m.setView([46.8,8.2],8);
  setTimeout(()=>m.invalidateSize(),0);return m}
const pubLink=t=>location.origin+location.pathname.replace(/[^/]*$/,'')+'public.html?k='+t;
async function loadEx(){const el=$('#sEx');let ps,us,ros,xt,gs;try{[ps,us,ros,xt,gs]=await Promise.all([api('ex/plans'),api('users'),api('roles'),api('ext_templates'),api('groups').catch(()=>[])])}catch(e){el.innerHTML='<h2>Übungen vorbereiten</h2><div class="mut">Nicht verfügbar: '+esc(e.message)+'</div>';return}
  const un=id=>(us.find(u=>u.id===id)||{}).name||'?',stat=p=>p.incident_id==null?['vorbereitet','']:p.ended_at==null?['läuft','run']:['beendet','done'];
  const rn=id=>(ros.find(r=>r.id===id)||{}).name,inj=(p,j)=>{const ref=(j.kind==='seen'||j.kind==='extdel')&&p.injects.find(x=>x.id===j.ref_id),xk=j.kind==='ext'||j.kind==='extdel';
    return `<tr><td>${esc(j.label)}<small>${EXK[j.kind]}${j.kind==='res'?': '+esc(j.name):j.kind==='ext'?': '+esc(j.name)+(j.role_id?', '+esc(rn(j.role_id)||'?'):''):j.kind==='extdel'?': '+esc(ref?ref.name:'?'):ref?': '+esc(exRN(ref)):j.kind==='seen'?(j.name?': neu, '+esc(j.name):': unbekannt'):''}</small></td><td>${esc(fmtC(j.lat,j.lon,'lv95'))}<small>${xk?'':j.ago==null?'PLS-Zeitpunkt gibt die Übungsleitung an':j.ago?'PLS '+j.ago+' min vor der Freigabe':'PLS bei der Freigabe'}</small></td><td>${j.msg?esc(j.msg):'<span class="mut">keine Meldung</span>'}</td>

      <td class="act">${j.released||p.ended_at?'':`<button data-ji="${j.id}" data-p="${p.id}">Bearbeiten</button><button data-jr="${j.id}" aria-label="Element entfernen" title="Entfernen">✕</button>`}</td></tr>`};
  el.innerHTML=`<h2>Übungen vorbereiten</h2><div class="mut">Die Übungsleitung startet die Übung in der Einsatz-App (☰ → Vorbereitete Übungen) und gibt dort die Elemente frei. Starten kann nur, wer als Übungsleitung eingetragen ist. Sie hat die Rechte der Einsatzleitung und wird nicht alarmiert, kann aber zusätzlich als Einsatzkraft teilnehmen. Erst freigegebene Elemente sind für die Teilnehmenden sichtbar und zählen fürs Suchgebiet. Der öffentliche Link lässt sich schon vorher öffnen und zeigt bis zum Start eine Warteseite.</div>
    <div class="row"><button class="pri" id="exA">Neue Übung</button></div>
    ${ps.map(p=>{const[s,c]=stat(p);return`<div class="exp"><h3>${esc(p.title)} <span class="badge ${c}">${s}</span>${p.alarm_at?` <span class="mut" style="font-weight:400">${esc(new Date(p.alarm_at*1000).toLocaleString('de-CH'))}</span>`:''}</h3>

function closeReplay(){if(!rp)return;clearInterval(rp.timer);rp.map.remove();rp=null;const o=$('#replay');if(o)o.remove()}

// Kategorien wie in der Einsatz-App (VIEW), ohne Suchgebiet (wird im Replay nicht gezeichnet); ausgeblendete pro Gerät in sw_rpview (getrennt von App und öffentlicher Ansicht)
const rpHide=(()=>{try{return new Set(JSON.parse(localStorage.getItem('sw_rpview')||'[]'))}catch(e){return new Set()}})();

// Auto-Übersicht: bei jedem Zeichnen alle sichtbaren aktiven Positionen (Einsatzkräfte mit Standort, Externe, nicht gerettete Rettlinge, PLS) im Bild halten.

function rpAutoFit(pts){if(!rp.auto||!pts.length)return;const m=rp.map,b=L.latLngBounds(pts),view=m.getBounds().pad(-.08),z=Math.min(m.getBoundsZoom(b,false,L.point(80,80)),16);

function drawReplay(){const{d,t}=rp,i=d.incident,on=(a,b)=>a!=null&&a<=t&&(b==null||t<b);

    p.ll=ll;p.mk.setLatLng(ll).setStyle({fillOpacity:age>GAP_S?.45:1});if(sv)rp.dynL.addLayer(p.mk);else rp.dynL.removeLayer(p.mk);

  const airNow=[];rp.air.forEach(a=>{const k=lastIdx(a.pts,t),p=k>=0?a.pts[k]:null,q=a.pts[k+1];let ll=null;
    if(p&&t-p[1]<=AIR_GAP_S){ll=[p[2],p[3]];if(q&&q[1]-p[1]<=AIR_GAP_S){const f=(t-p[1])/(q[1]-p[1]);ll=[p[2]+(q[2]-p[2])*f,p[3]+(q[3]-p[3])*f]}}
    if(!ll||!rpVis('air')){rp.dynL.removeLayer(a.mk);a.line.setLatLngs([]);return}
    const x={...a,lat:ll[0],lon:ll[1],alt:p[4],gnd:p[4]===0,trk:p[5],at:p[1]},h=airIconHtml(x,0,x.trk||0);
    if(h!==a.hk){a.hk=h;a.mk.setIcon(L.divIcon({className:'',html:h,iconSize:[32,32],iconAnchor:[16,16]}))}
    a.mk.setLatLng(ll).setTooltipContent(esc(airName(x))+(x.desc||x.type?' · '+esc(x.desc||x.type):''));rp.dynL.addLayer(a.mk);
    let j0=0;while(j0<=k&&a.pts[j0][1]<from)j0++;a.line.setLatLngs(win&&j0<=k?[...a.pts.slice(j0,k+1).map(z=>[z[2],z[3]]),ll]:[]);airNow.push(x)});
  // Positionen & Bereiche, Rettlinge und Nachrichten-Markierungen: nur neu zeichnen, wenn sich der sichtbare Bestand ändert
  const pois=d.pois.filter(p=>on(p.created,p.removed)),marks=d.marks.filter(m=>m.created<=t&&(m.mark||(m.unmarked!=null&&t<m.unmarked)));

// Einsatzkräfte im Replay: nach Spezialrolle gruppiert (Reihenfolge wie in der Verwaltung, ohne Rolle zuletzt), mit «Zentrieren» und «Folgen».
