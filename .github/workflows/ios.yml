# iOS-IPA bauen, signieren und optional nach App Store Connect (TestFlight) hochladen.
# Wird aufgerufen von mobile.yml (Native Apps) und testflight.yml (von Hand); Geheimnisse über «secrets: inherit», siehe mobile.yml.
name: iOS bauen

on:
  workflow_call:
    inputs:
      upload:
        description: Signiertes IPA nach App Store Connect hochladen
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.47.9'

defaults:
  run:
    working-directory: mobile/app

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Version
        id: ver
        shell: bash
        run: |
          v=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then v="${GITHUB_REF#refs/tags/mobile-v}"; fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
          # Build-Nummer aus Datum und Zeit (UTC, JJMMTThhmm): steigt über beide Workflows hinweg (Native Apps und TestFlight),
          # App Store Connect verlangt je Version eine höhere Nummer als die zuletzt hochgeladene
          b=$(date -u +%y%m%d%H%M); echo "build=$b" >> "$GITHUB_OUTPUT"; echo "::notice::Version $v, Build $b"
      - name: Zertifikat und Profil
        id: sign
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        shell: bash
        run: |
          miss=""
          [ -z "$P12" ] && miss="$miss IOS_CERT_P12_BASE64"
          [ -z "$PROFILE" ] && miss="$miss IOS_PROFILE_BASE64"
          [ -z "$TEAM" ] && miss="$miss IOS_TEAM_ID"
          [ -z "$P12_PW" ] && echo "::notice::IOS_CERT_PASSWORD ist leer (nur richtig, wenn das .p12 kein Passwort hat)"
          if [ -n "$miss" ]; then
            echo "::warning::Keine iOS-Signatur eingerichtet, es fehlt:$miss. Es entsteht ein unsigniertes IPA (nicht installierbar ohne Nachsignieren)"
            echo "signed=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          kc="$RUNNER_TEMP/build.keychain-db"; kpw=$(uuidgen)
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 -d > "$RUNNER_TEMP/app.mobileprovision"
          security create-keychain -p "$kpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PW" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kpw" "$kc"
          security list-keychain -d user -s "$kc"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          pname=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/app.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$uuid".mobileprovision
          # Nur das Ziel Runner manuell signieren (Bibliotheken bleiben unverändert)
          sed -i '' "s|CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;|CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements; CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $TEAM; PROVISIONING_PROFILE_SPECIFIER = \"$pname\"; \"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"iPhone Distribution\";|" ios/Runner.xcodeproj/project.pbxproj
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${METHOD:-app-store-connect}</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>ch.swiftwaterrescue.app</key><string>$pname</string></dict>
          </dict></plist>
          PL
          echo "signed=1" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - name: IPA bauen
        env:
          DEFINES: >-
            --dart-define=FCM_API_KEY=${{ secrets.FCM_API_KEY }}
            --dart-define=FCM_PROJECT_ID=${{ secrets.FCM_PROJECT_ID }}
            --dart-define=FCM_SENDER_ID=${{ secrets.FCM_SENDER_ID }}
            --dart-define=FCM_APP_ID_IOS=${{ secrets.FCM_APP_ID_IOS }}
          HAS_FCM: ${{ secrets.FCM_API_KEY != '' && secrets.FCM_PROJECT_ID != '' && secrets.FCM_SENDER_ID != '' && secrets.FCM_APP_ID_IOS != '' }}
        shell: bash
        run: |
          [ "$HAS_FCM" = "true" ] || echo "::warning::FCM_API_KEY, FCM_PROJECT_ID, FCM_SENDER_ID oder FCM_APP_ID_IOS fehlt: iOS-App ohne Push"
          args="--release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.build }} $DEFINES"
          mkdir -p out
          if [ "${{ steps.sign.outputs.signed }}" = "1" ]; then
            flutter build ipa $args --export-options-plist="$RUNNER_TEMP/export.plist"
            cp build/ios/ipa/*.ipa "out/swiftwater-rescue-${{ steps.ver.outputs.name }}.ipa"
            # Push-Berechtigung im signierten IPA prüfen (für TestFlight/App Store muss sie «production» sein)
            t=$(mktemp -d); unzip -q build/ios/ipa/*.ipa -d "$t"
            aps=$(codesign -d --entitlements :- "$t"/Payload/*.app 2>/dev/null | plutil -extract aps-environment raw -o - - 2>/dev/null || true)
            if [ -n "$aps" ]; then echo "::notice::aps-environment im IPA: $aps"; else echo "::warning::IPA ohne aps-environment: kein Push (Profil ohne Push Notifications?)"; fi
            rm -rf "$t"
          else
            flutter build ios $args --no-codesign
            mkdir -p "$RUNNER_TEMP/ipa/Payload"
            cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ipa/Payload/"
            (cd "$RUNNER_TEMP/ipa" && zip -qr - Payload) > "out/swiftwater-rescue-${{ steps.ver.outputs.name }}-unsigned.ipa"
          fi
      - name: Schlüsselbund aufräumen
        if: always()
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: mobile/app/out/*
          if-no-files-found: error
      # Nur wenn der Aufrufer es verlangt (Native Apps: auf main; TestFlight: immer), nur signiert für den App Store
      - name: Nach App Store Connect hochladen
        if: inputs.upload && steps.sign.outputs.signed == '1'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
          METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        shell: bash
        run: |
          if [ "${METHOD:-app-store-connect}" != "app-store-connect" ]; then
            echo "::notice::IOS_EXPORT_METHOD ist $METHOD: kein Upload nach App Store Connect"; exit 0
          fi
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$KEY" ]; then
            echo "::warning::ASC_KEY_ID, ASC_ISSUER_ID oder ASC_KEY_P8 fehlt: kein Upload nach App Store Connect"; exit 0
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          f=~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8
          # Inhalt der .p8-Datei direkt oder base64-kodiert
          if printf '%s' "$KEY" | grep -q 'BEGIN PRIVATE KEY'; then printf '%s\n' "$KEY" > "$f"; else printf '%s' "$KEY" | base64 -D > "$f"; fi
          ipa=$(ls out/*.ipa | head -1)
          xcrun altool --upload-app -t ios -f "$ipa" --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          echo "::notice::$(basename "$ipa") (Build ${{ steps.ver.outputs.build }}) an App Store Connect übergeben, erscheint nach der Verarbeitung in TestFlight"
      - name: API-Schlüssel aufräumen
        if: always()
        shell: bash
        run: rm -rf ~/.appstoreconnect/private_keys
      # Nur aus Native Apps (Tag mobile-v…), die TestFlight-Action hat kein Schreibrecht
      - name: Release
        if: startsWith(github.ref, 'refs/tags/mobile-v') && github.workflow == 'Native Apps'
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/app/out/*
