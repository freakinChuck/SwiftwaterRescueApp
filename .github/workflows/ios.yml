# iOS-IPA bauen, signieren und optional nach App Store Connect (TestFlight) hochladen; mit «submit» (Release-Tags, Issue #264)
# zusätzlich als neue App-Store-Version zur Prüfung einreichen (fastlane deliver), nach der Freigabe automatisch veröffentlicht.
# Wird aufgerufen von mobile.yml (Native Apps, auch für «nur iOS» aus testflight.yml); Geheimnisse über «secrets: inherit», siehe mobile.yml.
name: iOS bauen

on:
  workflow_call:
    inputs:
      upload:
        description: Signiertes IPA nach App Store Connect hochladen
        type: boolean
        default: false
      submit:
        description: Nach dem Upload als App-Store-Version zur Prüfung einreichen (nur mit upload)
        type: boolean
        default: false
      build:
        description: Build-Nummer (von mobile.yml, gleich wie Android); leer = BUILD_BASE plus Laufnummer
        type: string
        default: ''

env:
  FLUTTER_VERSION: '3.47.9'
  # Basis der Build-Nummer (Issue #230), gleich wie in mobile.yml
  BUILD_BASE: '611212000'
  # Ab April 2027 nimmt App Store Connect nur Builds mit dem iOS-27-SDK an (ITMS-90725). Gewählt wird das neuste Xcode dieser Hauptversion.
  XCODE_MAJOR: '27'

defaults:
  run:
    working-directory: mobile/app

jobs:
  ios:
    # Xcode 27 gibt es bei GitHub zurzeit nur im Abbild «xcode-27» (Preview); Rückfall ohne Codeänderung über die Repo-Variable IOS_RUNNER (z. B. macos-latest) und XCODE_MAJOR
    runs-on: ${{ vars.IOS_RUNNER || 'xcode-27' }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode wählen
        shell: bash
        working-directory: .
        run: |
          maj="${{ vars.IOS_XCODE_MAJOR || env.XCODE_MAJOR }}"
          x=$(ls -d /Applications/Xcode_${maj}*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$x" ]; then echo "::error::Kein Xcode $maj auf diesem Runner: $(ls -d /Applications/Xcode_*.app | xargs -n1 basename | tr '\n' ' ')"; exit 1; fi
          sudo xcode-select -s "$x/Contents/Developer"
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')/ iOS-SDK $(xcrun --sdk iphoneos --show-sdk-version)"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Version
        id: ver
        shell: bash
        run: |
          # Gemeinsame Version (Issue #175): Datei VERSION im Hauptordner, bei einem Release-Tag vX.Y.Z (bzw. älter mobile-vX.Y.Z) die Nummer des Tags
          v=$(tr -d ' \r\n' < ../../VERSION)
          if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then v="${GITHUB_REF#refs/tags/mobile-v}"; elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
          # Build-Nummer (Issue #230): von mobile.yml übergeben (gleich wie Android), sonst BUILD_BASE plus Laufnummer (von mobile.yml, auch als workflow_call);
          # App Store Connect verlangt je Version eine höhere Nummer als die zuletzt hochgeladene
          b="${{ inputs.build }}"; [ -z "$b" ] && b=$(( BUILD_BASE + ${{ github.run_number }} ))
          echo "build=$b" >> "$GITHUB_OUTPUT"; echo "::notice::Version $v, Build $b"
      - name: Zertifikat und Profil
        id: sign
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        shell: bash
        run: |
          miss=""
          [ -z "$P12" ] && miss="$miss IOS_CERT_P12_BASE64"
          [ -z "$PROFILE" ] && miss="$miss IOS_PROFILE_BASE64"
          [ -z "$TEAM" ] && miss="$miss IOS_TEAM_ID"
          [ -z "$P12_PW" ] && echo "::notice::IOS_CERT_PASSWORD ist leer (nur richtig, wenn das .p12 kein Passwort hat)"
          if [ -n "$miss" ]; then
            echo "::warning::Keine iOS-Signatur eingerichtet, es fehlt:$miss. Es entsteht ein unsigniertes IPA (nicht installierbar ohne Nachsignieren)"
            echo "signed=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          kc="$RUNNER_TEMP/build.keychain-db"; kpw=$(uuidgen)
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 -d > "$RUNNER_TEMP/app.mobileprovision"
          security create-keychain -p "$kpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PW" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kpw" "$kc"
          security list-keychain -d user -s "$kc"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          pname=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          # Jede Berechtigung aus Runner.entitlements muss im Profil stehen, sonst scheitert die Signierung unverständlich
          miss=""
          for k in com.apple.developer.usernotifications.critical-alerts com.apple.developer.usernotifications.time-sensitive; do
            grep -q "<key>$k</key>" ios/Runner/Runner.entitlements || continue
            /usr/libexec/PlistBuddy -c "Print :Entitlements:$k" "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1 || miss="$miss $k"
          done
          if [ -n "$miss" ]; then echo "::error::Provisioning-Profil «$pname» ohne:$miss. Profil im Apple-Portal neu erstellen und IOS_PROFILE_BASE64 ersetzen."; exit 1; fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/app.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$uuid".mobileprovision
          # Nur das Ziel Runner manuell signieren (Bibliotheken bleiben unverändert)
          sed -i '' "s|CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;|CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements; CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $TEAM; PROVISIONING_PROFILE_SPECIFIER = \"$pname\"; \"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"iPhone Distribution\";|" ios/Runner.xcodeproj/project.pbxproj
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${METHOD:-app-store-connect}</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>ch.swiftwaterrescue.app</key><string>$pname</string></dict>
          </dict></plist>
          PL
          echo "signed=1" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - name: IPA bauen
        env:
          DEFINES: >-
            --dart-define=FCM_API_KEY=${{ secrets.FCM_API_KEY }}
            --dart-define=FCM_PROJECT_ID=${{ secrets.FCM_PROJECT_ID }}
            --dart-define=FCM_SENDER_ID=${{ secrets.FCM_SENDER_ID }}
            --dart-define=FCM_APP_ID_IOS=${{ secrets.FCM_APP_ID_IOS }}
            --dart-define=APP_VERSION=${{ steps.ver.outputs.name }}
            --dart-define=APP_BUILD=${{ steps.ver.outputs.build }}
          HAS_FCM: ${{ secrets.FCM_API_KEY != '' && secrets.FCM_PROJECT_ID != '' && secrets.FCM_SENDER_ID != '' && secrets.FCM_APP_ID_IOS != '' }}
        shell: bash
        run: |
          [ "$HAS_FCM" = "true" ] || echo "::warning::FCM_API_KEY, FCM_PROJECT_ID, FCM_SENDER_ID oder FCM_APP_ID_IOS fehlt: iOS-App ohne Push"
          args="--release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.build }} $DEFINES"
          mkdir -p out
          if [ "${{ steps.sign.outputs.signed }}" = "1" ]; then
            flutter build ipa $args --export-options-plist="$RUNNER_TEMP/export.plist"
            cp build/ios/ipa/*.ipa "out/swiftwater-rescue-${{ steps.ver.outputs.name }}.ipa"
            # Push-Berechtigung im signierten IPA prüfen (für TestFlight/App Store muss sie «production» sein)
            t=$(mktemp -d); unzip -q build/ios/ipa/*.ipa -d "$t"
            aps=$(codesign -d --entitlements :- "$t"/Payload/*.app 2>/dev/null | plutil -extract aps-environment raw -o - - 2>/dev/null || true)
            if [ -n "$aps" ]; then echo "::notice::aps-environment im IPA: $aps"; else echo "::warning::IPA ohne aps-environment: kein Push (Profil ohne Push Notifications?)"; fi
            rm -rf "$t"
          else
            flutter build ios $args --no-codesign
            mkdir -p "$RUNNER_TEMP/ipa/Payload"
            cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ipa/Payload/"
            (cd "$RUNNER_TEMP/ipa" && zip -qr - Payload) > "out/swiftwater-rescue-${{ steps.ver.outputs.name }}-unsigned.ipa"
          fi
      - name: Schlüsselbund aufräumen
        if: always()
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: mobile/app/out/*
          if-no-files-found: error
      # Nur wenn der Aufrufer es verlangt (Native Apps: auf main; TestFlight: immer), nur signiert für den App Store
      - name: Nach App Store Connect hochladen
        id: asc
        if: inputs.upload && steps.sign.outputs.signed == '1'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
          METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        shell: bash
        run: |
          if [ "${METHOD:-app-store-connect}" != "app-store-connect" ]; then
            echo "::notice::IOS_EXPORT_METHOD ist $METHOD: kein Upload nach App Store Connect"; exit 0
          fi
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$KEY" ]; then
            echo "::warning::ASC_KEY_ID, ASC_ISSUER_ID oder ASC_KEY_P8 fehlt: kein Upload nach App Store Connect"; exit 0
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          f=~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8
          # Inhalt der .p8-Datei direkt oder base64-kodiert
          if printf '%s' "$KEY" | grep -q 'BEGIN PRIVATE KEY'; then printf '%s\n' "$KEY" > "$f"; else printf '%s' "$KEY" | base64 -D > "$f"; fi
          ipa=$(ls out/*.ipa | head -1)
          xcrun altool --upload-app -t ios -f "$ipa" --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          echo "::notice::$(basename "$ipa") (Build ${{ steps.ver.outputs.build }}) an App Store Connect übergeben, erscheint nach der Verarbeitung in TestFlight"
          echo "ok=1" >> "$GITHUB_OUTPUT"
      # Issue #264: Release-Tags gehen in den App Store. deliver wartet, bis App Store Connect den Build verarbeitet hat, legt die Version an
      # (bzw. nimmt die offene), setzt «Neue Funktionen» aus web/changes.json und reicht zur Prüfung ein. Metadaten, Bildschirmfotos und
      # Angaben zur App müssen in App Store Connect schon vollständig sein (einmalig von Hand, siehe mobile/README.md).
      - name: Im App Store zur Prüfung einreichen
        if: inputs.submit && steps.asc.outputs.ok == '1'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          LOCALE: ${{ vars.ASC_LOCALE || 'de-DE' }}
          AUTO: ${{ vars.IOS_AUTO_RELEASE || 'true' }}
          VER: ${{ steps.ver.outputs.name }}
        shell: bash
        run: |
          command -v fastlane >/dev/null || brew install fastlane
          f=~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8
          d="$RUNNER_TEMP/fl"; mkdir -p "$d/fastlane"
          export ASC_JSON="$d/asc.json" NOTES="$d/notes.txt" BUILD_NR="${{ steps.ver.outputs.build }}"
          jq -n --arg id "$KEY_ID" --arg is "$ISSUER" --rawfile k "$f" '{key_id:$id, issuer_id:$is, key:$k, in_house:false}' > "$ASC_JSON"
          # «Neue Funktionen» = Punkte von «Was ist neu» dieser Version (höchstens 4000 Zeichen)
          python3 - "$VER" "$GITHUB_WORKSPACE/web/changes.json" > "$NOTES" <<'PY'
          import json, sys
          try: vs = json.load(open(sys.argv[2], encoding='utf-8')).get('versions', [])
          except Exception: vs = []
          it = next((x.get('items', []) for x in vs if x.get('version') == sys.argv[1]), [])
          print(('\n'.join('• ' + i for i in it) or 'Verbesserungen und Fehlerbehebungen')[:4000])
          PY
          # Eigene Fastfile nur für diesen Schritt: so gehen Release Notes und Angaben zur Einreichung als Hash an deliver
          cat > "$d/fastlane/Fastfile" <<'RB'
          lane :submit do
            deliver(
              api_key_path: ENV['ASC_JSON'],
              app_identifier: 'ch.swiftwaterrescue.app',
              app_version: ENV['VER'],
              build_number: ENV['BUILD_NR'],
              skip_binary_upload: true,
              skip_screenshots: true,
              release_notes: { ENV['LOCALE'] => File.read(ENV['NOTES']).strip },
              submit_for_review: true,
              automatic_release: ENV['AUTO'] == 'true',
              submission_information: { export_compliance_uses_encryption: false, add_id_info_uses_idfa: false },
              run_precheck_before_submit: false,
              force: true
            )
          end
          RB
          (cd "$d" && fastlane submit)
          rm -f "$ASC_JSON"
          echo "::notice::Version $VER (Build ${{ steps.ver.outputs.build }}) im App Store zur Prüfung eingereicht$([ "$AUTO" = true ] && echo ', wird nach der Freigabe veröffentlicht')"
      - name: API-Schlüssel aufräumen
        if: always()
        shell: bash
        run: rm -rf ~/.appstoreconnect/private_keys
      # Nur aus Native Apps (Tag v… bzw. mobile-v…), die TestFlight-Action hat kein Schreibrecht
      - name: Release
        if: (startsWith(github.ref, 'refs/tags/mobile-v') || startsWith(github.ref, 'refs/tags/v')) && github.workflow == 'Native Apps'
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/app/out/*
