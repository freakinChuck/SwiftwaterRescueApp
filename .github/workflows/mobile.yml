# Native Apps (Issue #108): baut aus mobile/app die fertigen Pakete für Android (APK, AAB) und iOS (IPA).
# Ohne Geheimnisse entstehen ein mit dem Debug-Schlüssel signiertes APK/AAB und ein unsigniertes IPA.
# Geheimnisse (Repository → Settings → Secrets and variables → Actions), alle optional, siehe mobile/README.md:
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   iOS:     IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD, IOS_PROFILE_BASE64, IOS_TEAM_ID, IOS_EXPORT_METHOD (app-store-connect | ad-hoc | enterprise)
#   Upload:  ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App-Store-Connect-API-Schlüssel; lädt signierte IPAs von main nach TestFlight,
#            Release-Tags zusätzlich zur Prüfung und Veröffentlichung im App Store, Issue #264)
#            Variablen (optional): ASC_LOCALE (Sprache der Notes «Neue Funktionen», Standard de-DE), IOS_AUTO_RELEASE (Standard true = nach der Prüfung sofort veröffentlichen)
#   Play:    PLAY_SERVICE_ACCOUNT_JSON (Dienstkonto mit Zugriff in der Play Console; lädt das signierte AAB von main und von Release-Tags in Google Play)
#            Variablen (Actions → Variables, optional): PLAY_TRACK (main, Standard internal = interner Test), PLAY_TRACK_RELEASE (Release-Tags, Standard alpha = geschlossener Test),
#            PLAY_STATUS (Standard completed, draft solange die App unveröffentlicht ist)
#   Push:    FCM_API_KEY, FCM_PROJECT_ID, FCM_SENDER_ID, FCM_APP_ID_ANDROID, FCM_APP_ID_IOS
# Der iOS-Teil steht in ios.yml; nur iOS bauen und nach TestFlight laden: testflight.yml («Run workflow»).
# Version (Issue #175): gemeinsame Version aus der Datei VERSION. Ein Release-Tag «v<Version>» (Workflow release.yml, startet diesen Workflow auf dem Tag)
# baut genau diese Version und hängt die Pakete an den GitHub-Release; «mobile-v<Version>» baut nur, ohne Upload.
# Ziele (Issue #264): main → TestFlight bzw. Google Play «interner Test»; Release-Tag v… → App Store (Prüfung, dann veröffentlicht) bzw. Google Play «Alpha».
# Die App erhält Version und Build über --dart-define=APP_VERSION/APP_BUILD (lib/version.dart).
# Build-Nummer (Issue #230): BUILD_BASE plus Laufnummer dieses Workflows, Android und iOS erhalten dieselbe (siehe Job «check»).
# Nur iOS nach TestFlight (testflight.yml) startet diesen Workflow mit ios_only, damit es nur einen Zähler gibt.
name: Native Apps

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml', '.github/workflows/ios.yml']
    tags: ['v*', 'mobile-v*']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      ios_only:
        description: Nur iOS bauen und nach TestFlight laden (ohne Prüfung und Android, auch ausserhalb von main)
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.9'
  # Basis der Build-Nummer (Issue #230), gleich in ios.yml. Version 1.3.1 ging mit 611211921 (Datum) in Google Play live,
  # kleinere Nummern lehnt Play ab («does not allow any existing users to upgrade»). Nie verkleinern.
  BUILD_BASE: '611212000'

defaults:
  run:
    working-directory: mobile/app

jobs:
  check:
    if: ${{ !inputs.ios_only }}
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.build.outputs.build }}
    steps:
      - name: Build-Nummer
        id: build
        shell: bash
        working-directory: .
        run: |
          # Gemeinsame Build-Nummer für Android und iOS (Issue #230): BUILD_BASE plus Laufnummer dieses Workflows, steigt mit jedem Lauf um 1.
          # Google Play warnt bei grossen Sprüngen («deutlich höher als dein vorheriger Versionscode»), deshalb kein Datum mehr.
          # Nur iOS (ios_only, aus testflight.yml) nutzt denselben Zähler; «Re-run» behält die Nummer des Laufs.
          b=$(( BUILD_BASE + ${{ github.run_number }} )); echo "build=$b" >> "$GITHUB_OUTPUT"; echo "::notice::Build $b (Android und iOS)"
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: check
    # Uploads nach Google Play nacheinander: gleichzeitige Edits (z. B. Push auf main und Release-Tag) lassen sich gegenseitig
    # verfallen («This edit has expired»); wartende ältere Läufe ersetzt GitHub durch den neusten
    concurrency:
      group: android-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'play' || github.run_id }}
      cancel-in-progress: false
    if: ${{ !inputs.ios_only }}
    env:
      BUILD: ${{ needs.check.outputs.build }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Version
        id: ver
        shell: bash
        run: |
          # Gemeinsame Version (Issue #175): Datei VERSION im Hauptordner, bei einem Release-Tag vX.Y.Z (bzw. älter mobile-vX.Y.Z) die Nummer des Tags
          v=$(tr -d ' \r\n' < ../../VERSION)
          if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then v="${GITHUB_REF#refs/tags/mobile-v}"; elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
      - name: Signierschlüssel
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release-Schlüssel eingerichtet"
          else
            echo "::warning::Kein ANDROID_KEYSTORE_BASE64: signiert mit dem Debug-Schlüssel (nicht für den Play Store)"
          fi
      - run: flutter pub get
      - name: APK und AAB bauen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DEFINES: >-
            --dart-define=FCM_API_KEY=${{ secrets.FCM_API_KEY }}
            --dart-define=FCM_PROJECT_ID=${{ secrets.FCM_PROJECT_ID }}
            --dart-define=FCM_SENDER_ID=${{ secrets.FCM_SENDER_ID }}
            --dart-define=FCM_APP_ID_ANDROID=${{ secrets.FCM_APP_ID_ANDROID }}
            --dart-define=APP_VERSION=${{ steps.ver.outputs.name }}
            --dart-define=APP_BUILD=${{ needs.check.outputs.build }}
        shell: bash
        run: |
          args="--release --build-name=${{ steps.ver.outputs.name }} --build-number=$BUILD $DEFINES"
          flutter build apk $args
          flutter build appbundle $args
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/swiftwater-rescue-${{ steps.ver.outputs.name }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "out/swiftwater-rescue-${{ steps.ver.outputs.name }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/app/out/*
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/mobile-v') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/app/out/*
      # Upload in Google Play nur auf main und bei Release-Tags vX.Y.Z, nur mit Release-Schlüssel und Dienstkonto (wie TestFlight bei iOS)
      - name: Google Play prüfen
        id: play
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Kein Upload in Google Play: nur auf main und bei Release-Tags"
          elif [ -z "$ANDROID_KEYSTORE_PATH" ]; then
            echo "::warning::Kein Upload in Google Play: mit dem Debug-Schlüssel signiert"
          elif [ -z "$SA" ]; then
            echo "::warning::Kein Upload in Google Play: PLAY_SERVICE_ACCOUNT_JSON fehlt"
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi
      - name: In Google Play hochladen
        if: steps.play.outputs.go == '1'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ch.swiftwaterrescue.app
          releaseFiles: mobile/app/out/*.aab
          releaseName: ${{ steps.ver.outputs.name }} (${{ needs.check.outputs.build }})
          # Issue #264: Release-Tags in «Alpha» (geschlossener Test), main in «interner Test»
          track: ${{ startsWith(github.ref, 'refs/tags/v') && (vars.PLAY_TRACK_RELEASE || 'alpha') || (vars.PLAY_TRACK || 'internal') }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}

  ios:
    needs: check
    # ohne Prüfung bei ios_only (Job «check» übersprungen)
    if: ${{ !cancelled() && (inputs.ios_only || needs.check.result == 'success') }}
    uses: ./.github/workflows/ios.yml
    with:
      # Upload nach TestFlight auf main, bei Release-Tags vX.Y.Z und bei ios_only (beliebiger Branch)
      upload: ${{ inputs.ios_only || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
      # Issue #264: nur Release-Tags vX.Y.Z gehen zusätzlich in den App Store (Prüfung, dann veröffentlicht); main bleibt in TestFlight
      submit: ${{ !inputs.ios_only && startsWith(github.ref, 'refs/tags/v') }}
      # dieselbe Build-Nummer wie Android (Issue #230); leer bei ios_only, dann bestimmt ios.yml sie mit derselben Formel
      build: ${{ needs.check.outputs.build }}
    secrets: inherit
