# Native Apps (Issue #108): baut aus mobile/app die fertigen Pakete für Android (APK, AAB) und iOS (IPA).
# Ohne Geheimnisse entstehen ein mit dem Debug-Schlüssel signiertes APK/AAB und ein unsigniertes IPA.
# Geheimnisse (Repository → Settings → Secrets and variables → Actions), alle optional, siehe mobile/README.md:
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   iOS:     IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD, IOS_PROFILE_BASE64, IOS_TEAM_ID, IOS_EXPORT_METHOD (app-store-connect | ad-hoc | enterprise)
#   Upload:  ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App-Store-Connect-API-Schlüssel; lädt signierte IPAs von main nach TestFlight)
#   Play:    PLAY_SERVICE_ACCOUNT_JSON (Dienstkonto mit Zugriff in der Play Console; lädt das signierte AAB von main in Google Play)
#            Variablen (Actions → Variables, optional): PLAY_TRACK (Standard internal), PLAY_STATUS (Standard completed, draft solange die App unveröffentlicht ist)
#   Push:    FCM_API_KEY, FCM_PROJECT_ID, FCM_SENDER_ID, FCM_APP_ID_ANDROID, FCM_APP_ID_IOS
# Der iOS-Teil steht in ios.yml; nur iOS bauen und nach TestFlight laden: testflight.yml («Run workflow»).
# Version (Issue #175): gemeinsame Version aus der Datei VERSION. Ein Release-Tag «v<Version>» (Workflow release.yml, startet diesen Workflow auf dem Tag)
# baut genau diese Version, lädt sie wie main nach TestFlight bzw. Google Play und hängt die Pakete an den GitHub-Release; «mobile-v<Version>» geht weiterhin.
# Die App erhält Version und Build über --dart-define=APP_VERSION/APP_BUILD (lib/version.dart).
name: Native Apps

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml', '.github/workflows/ios.yml']
    tags: ['v*', 'mobile-v*']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.9'

defaults:
  run:
    working-directory: mobile/app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Version
        id: ver
        shell: bash
        run: |
          # Gemeinsame Version (Issue #175): Datei VERSION im Hauptordner, bei einem Release-Tag vX.Y.Z (bzw. älter mobile-vX.Y.Z) die Nummer des Tags
          v=$(tr -d ' \r\n' < ../../VERSION)
          if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then v="${GITHUB_REF#refs/tags/mobile-v}"; elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
      - name: Signierschlüssel
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release-Schlüssel eingerichtet"
          else
            echo "::warning::Kein ANDROID_KEYSTORE_BASE64: signiert mit dem Debug-Schlüssel (nicht für den Play Store)"
          fi
      - run: flutter pub get
      - name: APK und AAB bauen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DEFINES: >-
            --dart-define=FCM_API_KEY=${{ secrets.FCM_API_KEY }}
            --dart-define=FCM_PROJECT_ID=${{ secrets.FCM_PROJECT_ID }}
            --dart-define=FCM_SENDER_ID=${{ secrets.FCM_SENDER_ID }}
            --dart-define=FCM_APP_ID_ANDROID=${{ secrets.FCM_APP_ID_ANDROID }}
            --dart-define=APP_VERSION=${{ steps.ver.outputs.name }}
            --dart-define=APP_BUILD=${{ github.run_number }}
        shell: bash
        run: |
          args="--release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ github.run_number }} $DEFINES"
          flutter build apk $args
          flutter build appbundle $args
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/swiftwater-rescue-${{ steps.ver.outputs.name }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "out/swiftwater-rescue-${{ steps.ver.outputs.name }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/app/out/*
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/mobile-v') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/app/out/*
      # Upload in Google Play nur auf main und bei Release-Tags vX.Y.Z, nur mit Release-Schlüssel und Dienstkonto (wie TestFlight bei iOS)
      - name: Google Play prüfen
        id: play
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Kein Upload in Google Play: nur auf main und bei Release-Tags"
          elif [ -z "$ANDROID_KEYSTORE_PATH" ]; then
            echo "::warning::Kein Upload in Google Play: mit dem Debug-Schlüssel signiert"
          elif [ -z "$SA" ]; then
            echo "::warning::Kein Upload in Google Play: PLAY_SERVICE_ACCOUNT_JSON fehlt"
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi
      - name: In Google Play hochladen
        if: steps.play.outputs.go == '1'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ch.swiftwaterrescue.app
          releaseFiles: mobile/app/out/*.aab
          releaseName: ${{ steps.ver.outputs.name }} (${{ github.run_number }})
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}

  ios:
    needs: check
    uses: ./.github/workflows/ios.yml
    with:
      # Upload nach TestFlight nur auf main und bei Release-Tags vX.Y.Z
      upload: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    secrets: inherit
